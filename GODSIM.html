<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GODSIM: Divine Dominion</title>
  <meta name="description" content="A living Earth. A changing humanity. A God whose power depends on faith." />
  <style>
:root {
  --bg: #0b1020;
  --panel: #121a2e;
  --panel-2: #18223a;
  --line: #26324f;
  --text: #e6e9f2;
  --muted: #8f9ab5;
  --gold: #e0b341;
  --gold-dim: #a8862f;
  --teal: #3fb8a5;
  --red: #e2564f;
  --orange: #e8913a;
  --blue: #5b8def;
  --green: #5fbf6a;
  --purple: #a77be0;
  --radius: 8px;
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.muted { color: var(--muted); }
.gold { color: var(--gold); }
.red { color: var(--red); }
.green { color: var(--green); }
.small { font-size: 11px; }
h2, h3, h4 { margin: 0; font-weight: 650; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }

#app {
  display: grid; height: 100vh; height: 100dvh;
  grid-template-columns: 300px 1fr 370px;
  grid-template-rows: 54px 1fr 120px;
  grid-template-areas: 'top top top' 'left view right' 'left feed right';
}
#topbar { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0e1529; border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-weight: 800; letter-spacing: .12em; color: var(--gold); font-size: 16px; }
.spacer { flex: 1; }
.group { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.group button { background: none; border: 0; padding: 6px 9px; color: var(--muted); white-space: nowrap; }
.group button:hover { color: var(--text); background: #223052; }
.group button.active { background: #2a3a63; color: var(--gold); }
.group button:disabled { opacity: .4; cursor: not-allowed; }
button.plain { white-space: nowrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; }
button.plain:hover { border-color: var(--gold-dim); }

.faith { position: relative; width: 210px; cursor: help; }
.faith-row { display: flex; gap: 6px; align-items: baseline; }
.faith-label { color: var(--gold); font-weight: 700; }
#faith-num { font-variant-numeric: tabular-nums; }
.faith-net { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
.faith-bar { height: 7px; background: #1d2742; border-radius: 4px; overflow: hidden; margin-top: 3px; }
#faith-fill { height: 100%; background: linear-gradient(90deg, #b88a1d, #f5d36c); width: 0; transition: width .2s; }
.tip { position: absolute; top: 44px; left: 0; z-index: 50; background: #0d1426; border: 1px solid var(--gold-dim); border-radius: var(--radius); padding: 10px 12px; width: 280px; display: none; box-shadow: 0 8px 30px #0008; }
.faith:hover .tip, .faith:focus .tip { display: block; }
.tip table { width: 100%; border-collapse: collapse; }
.tip td { padding: 2px 0; }
.tip td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.tier { color: var(--muted); font-size: 12px; white-space: nowrap; }
.clock { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 168px; }

#left { grid-area: left; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#right { grid-area: right; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#left-body, #right-body { flex: 1; padding: 10px; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 10px 6px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--text); border-bottom-color: var(--gold); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: #2a3a63; color: var(--text); font-size: 11px; }
.badge.hot { background: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 0; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 2px 8px; font-size: 11px; color: var(--muted); }
.chip.active { border-color: var(--gold-dim); color: var(--gold); }

#viewport { grid-area: view; position: relative; overflow: hidden; background: #070b16; min-width: 0; min-height: 0; }
#canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.view-hint { position: absolute; left: 10px; top: 10px; background: #0b1020cc; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; font-size: 12px; max-width: 60%; pointer-events: none; }
.overlay-bar { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 90%; }
.overlay-bar button { background: #0b1020dd; border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; font-size: 11px; color: var(--muted); }
.overlay-bar button.active { color: var(--gold); border-color: var(--gold-dim); }
.form-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 92%; }
.form-bar .pill { background: #0b1020e6; border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; }
.form-bar button { background: #1d2a4a; border: 1px solid #34467a; border-radius: 16px; padding: 6px 12px; }
.form-bar button:hover { border-color: var(--gold); }

#feed { grid-area: feed; background: #0d1427; border-top: 1px solid var(--line); padding: 6px 12px; font-size: 12px; }
.feed-item { padding: 3px 0; display: flex; gap: 8px; cursor: pointer; border-bottom: 1px solid #ffffff08; }
.feed-item:hover { background: #ffffff06; }
.feed-time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 150px; }
.feed-item b { font-weight: 600; }
.lvl2 b { color: var(--gold); }
.lvl3 b { color: #ff9b6b; }

.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; margin-bottom: 8px; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--gold-dim); }
.card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-dim) inset; }
.card .row { display: flex; gap: 6px; align-items: center; }
.urg { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 8px; }
.urg1 { background: #24406a; color: #a9c5ff; }
.urg2 { background: #6a4a17; color: #ffd27a; }
.urg3 { background: #6e1f22; color: #ffb1ad; animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.prayer-icon { font-size: 15px; width: 18px; text-align: center; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.kv div:nth-child(odd) { color: var(--muted); }
.meter { display: grid; grid-template-columns: 110px 1fr 70px; gap: 6px; align-items: center; margin: 3px 0; }
.meter .bar { height: 6px; background: #1d2742; border-radius: 3px; overflow: hidden; }
.meter .bar > div { height: 100%; }
.meter .val { text-align: right; font-size: 11px; color: var(--muted); }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; margin: 2px 3px 2px 0; font-size: 11px; }
.tag.gift { border-color: var(--purple); color: #d2b7ff; }
.tag.warn { border-color: var(--red); color: #ffb1ad; }
.unknown { color: var(--muted); font-style: italic; }
.mem { border-left: 2px solid var(--line); padding: 2px 0 2px 8px; margin: 4px 0; }
.mem .t { color: var(--muted); font-size: 11px; }
.bthumb { display: block; width: 100%; max-width: 330px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--line); image-rendering: auto; }
.portrait { flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--line); }
.link { color: #9cc0ff; cursor: pointer; text-decoration: underline dotted; }

.action { display: flex; width: 100%; text-align: left; align-items: center; gap: 8px; background: #1c2846; border: 1px solid #2e3d66; border-radius: var(--radius); padding: 7px 9px; margin: 5px 0; }
.action:hover:not(:disabled) { border-color: var(--gold); }
.action:disabled { opacity: .5; cursor: not-allowed; }
.action .cost { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.action .sub { display: block; color: var(--muted); font-size: 11px; }
.action.silence { background: #161d33; }
select { background: #1c2846; color: var(--text); border: 1px solid #2e3d66; border-radius: 6px; padding: 4px; font: inherit; }

table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 4px; border-bottom: 1px solid #ffffff08; }

.modal { position: fixed; inset: 0; background: #03060ecc; display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 12px; width: min(920px, 94vw); max-height: 90vh; overflow-y: auto; padding: 22px 26px; box-shadow: 0 20px 80px #000a; }
.title-screen { text-align: center; }
.title-screen h1 { font-size: 46px; letter-spacing: .14em; color: var(--gold); margin: 6px 0 0; }
.title-screen .sub { letter-spacing: .3em; color: var(--muted); }
.title-screen .tagline { font-style: italic; margin: 14px 0 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.choice { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.choice.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-dim) inset; }
.choice:disabled { opacity: .45; }
.choice b { display: block; margin-bottom: 3px; }
.btn { background: linear-gradient(#e7bf55, #b88a1d); color: #1a1405; border: 0; border-radius: var(--radius); padding: 10px 20px; font-weight: 700; }
.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
.btn:disabled { opacity: .5; }
.field { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.field input[type=number], .field input[type=text] { background: #1c2846; color: var(--text); border: 1px solid #2e3d66; border-radius: 6px; padding: 6px; font: inherit; }
.chron-item { padding: 6px 0; border-bottom: 1px solid #ffffff0d; }
.chron-item .t { color: var(--muted); font-size: 11px; }

#toasts { position: fixed; right: 384px; bottom: 132px; z-index: 120; display: flex; flex-direction: column; gap: 6px; width: 320px; pointer-events: none; }
.toast { background: #101830f2; border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: var(--radius); padding: 8px 10px; box-shadow: 0 6px 24px #0008; animation: toastIn .2s ease-out; pointer-events: auto; }
.toast.bad { border-left-color: var(--red); }
.toast.alert { border-left-color: #ff9b6b; }
@keyframes toastIn { from { transform: translateY(-6px); opacity: 0; } }

.tutorial { position: fixed; z-index: 110; left: 50%; bottom: 140px; transform: translateX(-50%); width: min(520px, 90vw); background: #101830f7; border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 40px #000b; }
.tutorial .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

@media (max-width: 1650px) {
  .lbl { display: none; }
  .clock { min-width: 0; }
  #topbar { gap: 7px; }
  .group button { padding: 6px 7px; }
}
@media (max-width: 1150px) {
  #app { grid-template-columns: 250px 1fr 320px; }
  .tier, .group#views button { font-size: 11px; }
  #toasts { right: 330px; }
  .tier { display: none; }
}
@media (max-width: 900px) {
  html, body { overflow: auto; }
  #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh 110px auto auto; grid-template-areas: 'top' 'view' 'feed' 'left' 'right'; height: auto; }
  #topbar { flex-wrap: wrap; padding: 8px; height: auto; }
  #left, #right { max-height: 70vh; }
  #toasts { right: 10px; left: 10px; width: auto; }
  .grid2, .grid4 { grid-template-columns: 1fr; }
}

</style>
</head>

  <script>/* js/core/base.js */
// GODSIM core namespace, utilities, seeded RNG and calendar.
// Every file attaches to globalThis.GODSIM so the game runs from a plain
// <script> include in the browser and from require() in Node tests.
(function (G) {
  'use strict';

  G.VERSION = '0.1.0';
  G.SAVE_VERSION = 1;
  G.Data = G.Data || {};
  G.Sim = G.Sim || {};
  G.UI = G.UI || {};

  const U = (G.Util = {});
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  U.round = (v, d = 0) => {
    const m = Math.pow(10, d);
    return Math.round(v * m) / m;
  };
  U.escape = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  U.label = (v, labels) => {
    // labels: [[threshold, text], ...] ascending
    let out = labels[0][1];
    for (const [th, txt] of labels) if (v >= th) out = txt;
    return out;
  };
  U.level5 = (v) => U.label(v, [[0, 'Very low'], [20, 'Low'], [40, 'Moderate'], [60, 'High'], [80, 'Very high']]);

  // Mulberry32: small, fast, and its whole state is one integer, so it saves cleanly.
  class Rng {
    constructor(seed) {
      this.state = seed >>> 0 || 0x9e3779b9;
    }
    next() {
      this.state = (this.state + 0x6d2b79f5) >>> 0;
      let t = this.state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    float(a = 0, b = 1) {
      return a + (b - a) * this.next();
    }
    int(a, b) {
      return a + Math.floor(this.next() * (b - a + 1));
    }
    chance(p) {
      return this.next() < p;
    }
    pick(arr) {
      return arr.length ? arr[Math.floor(this.next() * arr.length)] : undefined;
    }
    weighted(items, weightFn) {
      let total = 0;
      const ws = items.map((it) => {
        const w = Math.max(0, weightFn(it));
        total += w;
        return w;
      });
      if (total <= 0) return undefined;
      let r = this.next() * total;
      for (let i = 0; i < items.length; i++) {
        r -= ws[i];
        if (r <= 0) return items[i];
      }
      return items[items.length - 1];
    }
    gauss(mean = 0, sd = 1) {
      // Irwin-Hall approximation keeps the call count fixed (determinism friendly)
      let s = 0;
      for (let i = 0; i < 6; i++) s += this.next();
      return mean + (s - 3) * sd * 1.41;
    }
    toJSON() {
      return { state: this.state };
    }
  }
  G.Rng = Rng;

  // Calendar: 12 months x 30 days. world.t is minutes since the game started.
  const T = (G.Time = {});
  T.HOUR = 60;
  T.DAY = 1440;
  T.YEAR_DAYS = 360;
  T.MONTHS = ['Frostwane', 'Thaw', 'Seedfall', 'Bloom', 'Highsun', 'Goldtide', 'Harvest', 'Emberfall', 'Mistmoon', 'Duskward', 'Snowtide', 'Deepwinter'];
  T.WEEKDAYS = ['Moonday', 'Toilday', 'Wellday', 'Thornday', 'Fairday', 'Marketday', 'Restday'];
  T.abs = (world) => world.calendar.startMinute + world.t;
  T.hour = (world) => Math.floor((T.abs(world) % T.DAY) / 60);
  T.minuteOfDay = (world) => T.abs(world) % T.DAY;
  T.dayIndex = (world) => Math.floor(T.abs(world) / T.DAY); // absolute day count
  T.weekday = (world) => T.dayIndex(world) % 7;
  T.isRestday = (world) => T.weekday(world) === 6;
  T.dateParts = (world, t) => {
    const abs = world.calendar.startMinute + (t === undefined ? world.t : t);
    const day = Math.floor(abs / T.DAY);
    const year = world.calendar.baseYear + Math.floor(day / T.YEAR_DAYS);
    const doy = day % T.YEAR_DAYS;
    const month = Math.floor(doy / 30);
    const md = (doy % 30) + 1;
    const mod = abs % T.DAY;
    return { year, month, md, hour: Math.floor(mod / 60), minute: mod % 60, weekday: day % 7 };
  };
  T.format = (world, t, withTime = true) => {
    const p = T.dateParts(world, t);
    const d = `${p.md} ${T.MONTHS[p.month]} ${p.year}`;
    if (!withTime) return d;
    return `${d}, ${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
  };
  T.duration = (min) => {
    if (min < 60) return `${Math.max(0, Math.round(min))}m`;
    if (min < T.DAY) return `${Math.round(min / 60)}h`;
    const d = min / T.DAY;
    return d < 60 ? `${Math.round(d)}d` : `${U.round(d / T.YEAR_DAYS, 1)}y`;
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

</script>
  <script>/* js/data/city.js */
// The capital city of the MVP scenario. Layout is data so new settlements can be added without touching the simulation.
(function (G) {
  'use strict';

  const homes = [];
  let n = 1;
  for (const y of [26, 31, 36]) {

      plague: { active: false, until: 0 },

      stats: { births: 0, deaths: 0, answered: 0, ignored: 0, unanswered: 0, natural: 0, miraclesWitnessed: 0, possessions: 0 },

    for (const d of G.Data.city.districts) world.reputation[d.id] = { protector: 0, judge: 0, coincidence: 0, deceiver: 0 };

// Individual simulation: population, routines, movement, needs, life events and generations.
(function (G) {

  S.traitTags = function (c) {

    if (t.kindness > 0.7) tags.push('Compassionate');
    else if (t.kindness < 0.3) tags.push('Callous');
    if (t.courage > 0.7) tags.push('Brave');
    else if (t.courage < 0.3) tags.push('Timid');
    if (t.ambition > 0.7) tags.push('Ambitious');
    if (t.piety > 0.7) tags.push('Devout');
    if (t.skepticism > 0.7) tags.push('Skeptic');
    if (t.caution > 0.7) tags.push('Cautious');
    else if (t.caution < 0.25) tags.push('Reckless');
    return tags;
  };

  function randTraits(rng) {
    const r = () => U.clamp(rng.gauss(0.5, 0.18), 0.02, 0.98);

  S.makeCharacter = function (world, spec) {

    const traits = spec.traits ? Object.assign({}, spec.traits) : randTraits(rng);

    const sx = home ? home.x + rng.float(0.5, home.w - 0.5) : 30;
    const sy = home ? home.y + rng.float(0.5, home.h - 0.5) : 30;

      id,
      first: spec.first,
      last: spec.last,
      title: spec.title || '',
      name: (spec.title ? spec.title + ' ' : '') + spec.first + ' ' + spec.last,
      sex: spec.sex,
      age: spec.age,
      alive: true,
      role: spec.role,
      occupation: spec.occupation,
      homeId: spec.home,
      workId: spec.work || null,
      factionId: spec.faction || 'commons',
      traits,

      gift: !!spec.gift,
      health: spec.health != null ? spec.health : 100,
      illness: null,
      injury: 0,
      wealth: spec.wealth != null ? spec.wealth : 40,

      renown: spec.role === 'monarch' ? 80 : 0,

    S.relate(byKey.heir, byKey.king, 'parent', 60);

    S.relate(byKey.lissa, byKey.hobb, 'spouse', 80);

    S.relate(byKey.wren, byKey.tam, 'sibling', 75);

    S.relate(byKey.king, byKey.noble, 'rival', 30);
    S.relate(byKey.reformer, byKey.scholar, 'friend', 70);
    S.relate(byKey.scholar, byKey.reformer, 'friend', 70);
    S.relate(byKey.healer, byKey.lissa, 'friend', 65);
    S.relate(byKey.lissa, byKey.healer, 'friend', 65);
    S.relate(byKey.priestess, byKey.acolyte, 'colleague', 60);

    country.leaderId = byKey.king.id;
    country.heirId = byKey.heir.id;
    world.church.leaderId = byKey.priestess.id;

    for (const f of country.factions) f.leaderId = leaders[f.id] ? leaders[f.id].id : null;

    // Ordinary households

    const eastHomes = world.buildings.filter((b) => b.type === 'farmhouse' && b.id !== 'farm3');
    const usedLast = new Set(['Brannoc', 'Ashby', 'Velmorne', 'Crane', 'Marsh', 'Fairweather', 'Thane', 'Vell', 'Pike', 'Solace']);

        S.relate(members[1], members[0], 'spouse', rng.int(45, 90));
      }
      const kids = members.length === 2 && members[0].age < 50 ? rng.int(0, 3) : 0;
      for (let k = 0; k < kids; k++) {
        const sex = rng.chance(0.5) ? 'm' : 'f';

        const kid = S.makeCharacter(world, {

    for (let i = 0; i < Math.min(sc.householdHomes.east, eastHomes.length); i++) makeHousehold(eastHomes[i], true);

    for (const y of bs) {

  S.planPath = function (fromX, fromY, tx, ty) {

    return path;
  };

  function goTo(world, c, placeId, activity) {
    c.activity = activity;
    if (c.at === placeId && c.path.length === 0) return;
    const b = S.building(world, placeId) || G.Data.city.zones.find((z) => z.id === placeId);
    if (!b) return;
    c.at = placeId;
    const tx = b.x + world.rng.float(0.6, b.w - 0.6);
    const ty = b.y + world.rng.float(0.6, b.h - 0.6);
    c.path = S.planPath(c.x, c.y, tx, ty);
  }
  S.goTo = goTo;

  S.moveCharacters = function (world) {
    for (const id in world.chars) {
      const c = world.chars[id];
      if (!c.alive || c.possessed || !c.path.length) continue;
      const speed = c.flags.evacuating || c.flags.fleeing ? RUN : c.age < 6 || c.age > 70 ? WALK * 0.7 : WALK;
      let budget = speed;
      while (budget > 0 && c.path.length) {
        const p = c.path[0];
        const d = U.dist(c.x, c.y, p.x, p.y);
        if (d <= budget) {
          c.x = p.x;
          c.y = p.y;
          c.path.shift();
          budget -= d;
        } else {
          c.x += ((p.x - c.x) / d) * budget;
          c.y += ((p.y - c.y) / d) * budget;
          budget = 0;
        }
      }
    }
  };

  // ---------- routines (hourly) ----------
  S.isAdult = (c) => c.age >= 15;

  S.hourlyRoutine = function (world, c, hour) {
    if (!c.alive || c.possessed) return;
    const rng = world.rng;
    c.asleep = false;
    if (c.flags.detainedUntil && c.flags.detainedUntil > world.t) return goTo(world, c, 'barracks', 'detained');
    if (c.flags.detainedUntil) {
      c.flags.detainedUntil = 0;
      S.addMemory(world, c, 'detained', 'Released from the gaol.', 1);
    }
    if (c.flags.trapped) {
      c.activity = 'trapped';
      c.path = [];
      return;
    }
    if (c.flags.evacuating) return goTo(world, c, 'temple', 'sheltering');
    const severe = (c.illness && c.illness.severity > 45) || c.injury > 45;
    if (severe) {
      if (c.role !== 'healer' && c.wealth > 5 && hour >= 8 && hour < 18 && rng.chance(0.5)) return goTo(world, c, 'healer', 'seeking care');
      return goTo(world, c, c.homeId, 'resting (ill)');
    }
    if (hour >= 22 || hour < 6) {
      goTo(world, c, c.homeId, 'sleeping');
      c.asleep = c.at === c.homeId && c.path.length === 0;
      return;
    }
    if (c.prophet && hour >= 10 && hour < 16 && rng.chance(0.6)) return goTo(world, c, 'market', 'preaching');
    if (T.isRestday(world) && hour >= 9 && hour < 12) {
      const attend = c.belief >= 35 || (c.role === 'priest') || (c.role === 'monarch' && c.belief > 25);
      if (attend) return goTo(world, c, 'temple', c.role === 'priest' ? 'leading worship' : 'at worship');
    }
    if (c.role === 'child') {
      if (c.age >= 6 && hour >= 8 && hour < 14 && !T.isRestday(world)) return goTo(world, c, 'academy', 'at school');
      return goTo(world, c, c.homeId, 'playing');
    }
    if (c.age > 70 && rng.chance(0.6)) return goTo(world, c, c.homeId, 'resting');
    if (hour >= 8 && hour < 17 && c.workId && !T.isRestday(world)) {
      if (hour === 12 && rng.chance(0.35)) return goTo(world, c, 'market', 'at lunch');
      return goTo(world, c, c.workId, 'working');
    }
    if (hour >= 18 && hour < 22) {
      const r = rng.next();
      if ((c.role === 'reformer' || c.factionId === 'reformers' || c.role === 'laborer') && r < 0.45) return goTo(world, c, 'tavern', 'drinking & debating');
      if (c.belief > 70 && r < 0.3) return goTo(world, c, 'temple', 'evening prayer');
      if (r < 0.2) {
        const friends = Object.keys(c.relations).filter((k) => c.relations[k].type === 'friend').map((k) => S.char(world, +k)).filter((o) => o && o.alive);
        const f = rng.pick(friends);
        if (f) return goTo(world, c, f.homeId, 'visiting ' + f.first);
      }
      if (r < 0.35) return goTo(world, c, 'market', 'strolling');
    }
    return goTo(world, c, c.homeId, 'at home');
  };

  // ---------- daily life ----------
  S.dailyLife = function (world) {
    const rng = world.rng;
    const country = world.country;
    const living = S.living(world);
    const ecoFactor = country.economy / 50;
    for (const c of living) {
      c.age += 1 / T.YEAR_DAYS;
      // Economy and needs
      const income = { merchant: 3.2, noble: 4, monarch: 5, general: 3, priest: 1.6, official: 2.6, clerk: 2, scholar: 2, healer: 1.8, guard: 1.8, soldier: 1.6, artisan: 2.2, farmer: 1.8, laborer: 1.5, servant: 1.4, innkeeper: 2, reformer: 1.4, student: 0.4, heir: 4 }[c.role] || 0;
      let earn = income * ecoFactor * (c.injury > 40 || (c.illness && c.illness.severity > 50) ? 0.2 : 1);
      if (c.role === 'farmer' && world.provinces[1].devastation > 0) earn *= 1 - world.provinces[1].devastation / 140;
      if (c.corrupt) earn += country.corruption / 40;
      c.wealth = U.clamp(c.wealth + earn - 1.25, 0, 100);
      // Households slowly repair damage to their homes.
      const home = S.building(world, c.homeId);
      if (home && home.damage > 0 && c.age >= 16 && world.flood.stage === 'none') {
        const work = c.wealth > 10 ? 4 : 1.5;
        home.damage = Math.max(0, home.damage - work);
        if (c.wealth > 10) c.wealth -= 0.5;
      }
      if (c.role === 'child') {
        const parent = S.familyOf(world, c).find((p) => p.alive && c.relations[p.id].type === 'parent');
        c.wealth = parent ? parent.wealth : c.wealth;
      }
      if (c.role === 'priest') c.wealth = Math.max(c.wealth, 20); // the temple feeds its own
      const spouse = S.spouseOf(world, c);
      if (spouse && spouse.homeId === c.homeId && c.id < spouse.id) {
        const avg = (c.wealth + spouse.wealth) / 2; // households pool their means
        c.wealth = spouse.wealth = avg;
      }
      // In a famine bread is dear: the poor go hungry first, the rich hardly notice.
      const famineHit = country.flags.famine && c.wealth < 45;
      if (c.wealth < 8 || famineHit) c.hunger = U.clamp(c.hunger + (famineHit && c.wealth >= 8 ? 8 : 14) - (country.flags.granaries ? 12 : 0), 0, 100);
      else c.hunger = Math.max(0, c.hunger - 25);
      // Alms from the Temple soften hunger.
      if (c.hunger > 40 && world.church.strength > 30) c.hunger = Math.max(0, c.hunger - world.church.strength / 6);
      // Health
      if (c.hunger > 80) c.health = Math.max(0, c.health - 2.5);
      if (!c.illness) {
        let p = 0.0025 + (c.age > 55 ? 0.004 : 0) + (c.hunger > 60 ? 0.01 : 0);
        if (world.plague.active) p += 0.035;
        if (rng.chance(p * world.settings.crisisFrequency)) {
          c.illness = { name: world.plague.active ? 'the plague' : rng.pick(ILLNESSES), severity: rng.int(20, 55) };
          S.addMemory(world, c, 'illness', `Fell ill with ${c.illness.name}.`, 1);
        }
      } else {
        const healerNear = c.activity === 'seeking care' ? 12 : 0;
        const drift = rng.float(-10, 9) - healerNear + (c.age > 60 ? 2 : 0) + (c.hunger > 60 ? 5 : 0) - (c.health - 50) / 10;
        c.illness.severity = U.clamp(c.illness.severity + drift, 0, 120);
        if (c.illness.severity <= 5) {
          S.addMemory(world, c, 'recovery', `Recovered from ${c.illness.name}.`, 1);
          c.illness = null;
        }
      }
      if (c.injury > 0) c.injury = Math.max(0, c.injury - rng.float(2, 7));
      c.health = U.clamp(c.health + (c.illness ? -c.illness.severity / 40 : 2) - (c.age > 65 ? 0.4 : 0), 0, 100);
      // Mood
      let mood = 55 + (c.wealth - 30) / 3 - c.hunger / 3 - (c.illness ? c.illness.severity / 4 : 0) - c.injury / 4;
      if (c.flags.grief && world.t - c.flags.grief > T.DAY * 40) c.flags.grief = 0;
      if (c.flags.grief) mood -= 20;
      c.mood = U.clamp(U.lerp(c.mood, mood, 0.3), 0, 100);
      if (c.inspired && c.inspired.until < world.t) c.inspired = null;
      if (c.inspiration && c.inspiration.until < world.t) c.inspiration = null;
      // Death
      let pDeath = 0;
      if (c.age > 55) pDeath += Math.pow((c.age - 55) / 40, 3) * 0.02;
      if (c.illness && c.illness.severity >= 100) pDeath += 0.5;
      if (c.health <= 0) pDeath += 0.6;
      if (c.injury >= 95) pDeath += 0.4;
      if (rng.chance(pDeath)) {
        const cause = c.illness && (c.illness.severity >= 100 || c.health <= 0) ? c.illness.name : c.injury >= 95 ? 'their injuries' : c.health <= 0 ? (c.hunger > 60 ? 'hunger' : 'frailty') : 'old age';
        S.killCharacter(world, c, cause);
      }
    }
    // Story telling: memories of miracles spread to family and friends.
    for (const c of S.living(world)) {
      const recent = c.memories.find((m) => m.kind === 'miracle' && world.t - m.t < T.DAY * 3 && !m.told);
      if (!recent) continue;
      recent.told = true;
      for (const id in c.relations) {
        const o = S.char(world, +id);
        if (!o || !o.alive || c.relations[id].type === 'rival') continue;
        const sway = (c.belief - 40) / 12 - o.traits.skepticism * 2;
        S.adjustBelief(world, o, U.clamp(sway, -2, 4));
        if (rng.chance(0.4)) S.addMemory(world, o, 'story', `Heard from ${c.first} about ${recent.text.replace(/\.$/, '').toLowerCase()}.`, 0.6);
      }
    }
    S.lifeEvents(world);
  };

  S.killCharacter = function (world, c, cause) {
    if (!c.alive) return;
    c.alive = false;
    c.diedAt = world.t;
    c.causeOfDeath = cause;
    c.path = [];
    c.activity = 'dead';
    world.stats.deaths++;
    if (c.possessed) S.endPossession(world, 'The vessel died.');
    for (const p of world.prayers) if (p.requesterId === c.id && p.status === 'pending') p.status = 'void';
    const fam = S.familyOf(world, c);
    for (const f of fam) {
      if (!f.alive) continue;
      f.flags.grief = world.t;
      S.addMemory(world, f, 'grief', `Lost ${c.first} to ${cause}.`, 2);
    }
    const level = c.role === 'monarch' || c.key ? 2 : c.age < 16 ? 1 : 0;
    S.log(world, { title: `${c.name} has died`, text: `${c.name}, aged ${Math.floor(c.age)}, died of ${cause}.`, level, kind: 'death', entities: [c.id] });
    S.onCharacterDeath(world, c);
  };

  S.lifeEvents = function (world) {
    const rng = world.rng;
    const living = S.living(world);
    if (living.length >= MAX_DETAILED) return;
    for (const c of living) {
      // Marriage among unmarried adults with a close friend
      if (c.age >= 18 && c.age < 45 && !S.spouseOf(world, c) && rng.chance(0.004)) {
        const cands = Object.keys(c.relations).map((k) => S.char(world, +k)).filter((o) => o && o.alive && o.sex !== c.sex && o.age >= 18 && o.age < 50 && !S.spouseOf(world, o) && c.relations[o.id].affinity > 55 && !S.familyOf(world, c).includes(o));
        const o = rng.pick(cands);
        if (o) {
          S.relate(c, o, 'spouse', 80);
          S.relate(o, c, 'spouse', 80);
          if (o.homeId !== c.homeId) {
            o.homeId = c.homeId;
          }
          S.addMemory(world, c, 'marriage', `Married ${o.first}.`, 2);
          S.addMemory(world, o, 'marriage', `Married ${c.first}.`, 2);
          if (c.flags.lonelyPrayer) c.flags.lonelyPrayer = 0;
          S.log(world, { title: 'A wedding', text: `${c.name} married ${o.name}.`, level: 0, kind: 'life', entities: [c.id, o.id] });
        }
      }
      // Births
      if (c.sex === 'f' && c.age >= 18 && c.age <= 42) {
        const sp = S.spouseOf(world, c);
        if (sp && sp.alive && rng.chance(0.0019)) S.birth(world, c, sp);
      }
    }
    // Migrants keep the city alive when the population falls.
    if (living.length < 40 && rng.chance(0.08)) {
      const empty = world.buildings.find((b) => b.type === 'home' && !living.some((c) => c.homeId === b.id));
      if (empty) {
        const N = G.Data.names;
        const sex = rng.chance(0.5) ? 'm' : 'f';
        const c = S.makeCharacter(world, {
          first: rng.pick(sex === 'm' ? N.male : N.female), last: rng.pick(N.last), sex, age: rng.int(18, 40), role: 'laborer',
          occupation: 'Laborer', home: empty.id, work: 'market', faction: 'commons', belief: U.clamp(rng.gauss(38, 18), 0, 100), gift: rng.chance(0.03), wealth: 20,
        });
        c.x = 0.5;
        c.y = 9.5;
        S.log(world, { title: 'A newcomer', text: `${c.name} arrived in Thornhaven looking for work.`, level: 0, kind: 'life', entities: [c.id] });
      }
    }
  };

  S.spouseOf = function (world, c) {
    for (const id in c.relations) if (c.relations[id].type === 'spouse') {
      const o = S.char(world, +id);
      if (o && o.alive) return o;
    }
    return null;
  };

  S.birth = function (world, mother, father) {
    const rng = world.rng;
    const N = G.Data.names;
    const sex = rng.chance(0.5) ? 'm' : 'f';
    // Descendants inherit cultural tradition (belief), not memories.
    const belief = U.clamp((mother.belief + father.belief) / 2 + rng.gauss(0, 10), 0, 100);
    const kid = S.makeCharacter(world, {
      first: rng.pick(sex === 'm' ? N.male : N.female), last: father.last, sex, age: 0, role: 'child', occupation: 'Child',
      home: mother.homeId, work: null, faction: mother.factionId === 'crown' ? 'crown' : 'commons', belief, gift: rng.chance(0.03), wealth: mother.wealth,
    });
    kid.x = mother.x;
    kid.y = mother.y;
    for (const p of [mother, father]) {
      S.relate(p, kid, 'child', 90);
      S.relate(kid, p, 'parent', 85);
      S.addMemory(world, p, 'birth', `Welcomed a child, ${kid.first}.`, 2);
    }
    for (const sib of S.familyOf(world, mother).filter((x) => x.alive && mother.relations[x.id].type === 'child' && x.id !== kid.id)) {
      S.relate(kid, sib, 'sibling', 60);
      S.relate(sib, kid, 'sibling', 60);
    }
    world.stats.births++;
    const royal = mother.role === 'monarch' || mother.role === 'heir' || father.role === 'monarch' || father.role === 'heir';
    S.log(world, { title: royal ? 'A royal birth' : 'A birth', text: `${kid.first} ${kid.last} was born to ${mother.first} and ${father.first}.`, level: royal ? 2 : 0, kind: 'life', entities: [kid.id] });
    return kid;
  };

  // Coming of age: children take up a trade.
  S.yearlyLife = function (world) {
    const rng = world.rng;
    for (const c of S.living(world)) {
      if (c.role === 'child' && c.age >= 15) {
        const parent = S.familyOf(world, c).find((p) => c.relations[p.id] && c.relations[p.id].type === 'parent');
        const inherit = parent && rng.chance(0.6) && ['farmer', 'merchant', 'artisan', 'laborer', 'soldier', 'guard'].includes(parent.role);
        const job = inherit ? [parent.role, parent.occupation, parent.workId, parent.factionId] : rng.pick([['laborer', 'Laborer', 'market', 'commons'], ['artisan', 'Artisan', 'market', 'commons'], ['student', 'Student', 'academy', 'reformers'], ['soldier', 'Soldier', 'barracks', 'military']]);
        c.role = job[0];
        c.occupation = job[1];
        c.workId = job[2];
        c.factionId = job[3];
        S.addMemory(world, c, 'life', `Came of age and became a ${c.occupation.toLowerCase()}.`, 1);
      }
    }
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

// The Faith economy. Net Faith = passive + belief + prayer + institutional - upkeep, clamped to [0, capacity].
(function (G) {
  'use strict';
  const S = G.Sim;
  const U = G.Util;
  const T = G.Time;

  S.updateTier = function (world) {
    const f = world.faith;
    // Divine renown: long-term play counts, but acting in the world counts more.
    f.renown = f.earned * 0.3 + f.spent * 0.7;
    let tier = 1;
    for (const t of G.Data.tiers) if (f.renown >= t.earned) tier = t.tier;
    if (world.settings.unlockAll) tier = 4;
    if (tier > f.tier && world.t > 0) {
      const info = G.Data.tiers[tier - 1];
      S.log(world, { title: `You have become ${info.title}`, text: `New powers: ${info.unlocks}.`, level: 2, kind: 'divine' });
    }
    f.tier = Math.max(f.tier, tier);
    f.capacity = G.Data.tiers[f.tier - 1].capacity + (world.settings.capacityBonus || 0);
  };

  // Rates are recomputed hourly and applied per minute (per hour units throughout).
  S.recomputeFaithRates = function (world) {
    const f = world.faith;
    const country = world.country;
    const phil = G.Data.philosophies[world.player.philosophy] || {};
    // Passive regeneration keeps the player from ever being permanently stuck.
    let passive = 1.2;
    if (phil.abstainBonus && world.t - f.lastMiracleAt > T.DAY * 3) passive *= phil.abstainBonus * 1.4;
    // Belief: intense devotion counts for more than loose affiliation.
    let belief = 0;
    const exposureMult = 1 + country.exposure / 200;
    for (const c of S.living(world)) {
      const b = c.belief / 100;
      belief += b * b * 0.22;
    }
    for (const p of world.provinces) {
      if (p.local) continue;
      const b = p.belief / 100;
      belief += p.pop * b * b * 0.1;
    }
    belief *= exposureMult;
    // Prayer-related: gratitude after answered prayers.
    let prayer = 0;
    f.boosts = f.boosts.filter((b) => b.until > world.t);
    for (const b of f.boosts) prayer += b.perHour;
    // Institutional: the church and organised movements.
    let institution = world.church.strength * 0.03 * (0.5 + country.religiousInfluence / 100);
    for (const m of world.movements) if (m.active) institution += m.strength * 0.02;
    // Upkeep
    let upkeep = 0;
    const upkeepItems = [];
    if (world.player.form === 'possession') {
      upkeep += G.Data.possession.upkeepPerHour;
      upkeepItems.push(['Possession', G.Data.possession.upkeepPerHour]);
    }
    for (const b of world.buildings) {
      if (b.protectedUntil > world.t) {
        upkeep += 2;
        upkeepItems.push([`Ward on ${b.name}`, 2]);
      }
    }
    f.rates = {
      passive: U.round(passive, 2), belief: U.round(belief, 2), prayer: U.round(prayer, 2), institution: U.round(institution, 2),
      upkeep: U.round(upkeep, 2), upkeepItems, net: U.round(passive + belief + prayer + institution - upkeep, 2),
    };
  };

  S.faithMinute = function (world) {
    const f = world.faith;
    const gain = (f.rates.passive + f.rates.belief + f.rates.prayer + f.rates.institution) / 60;
    const loss = f.rates.upkeep / 60;
    const before = f.current;
    f.current = U.clamp(f.current + gain - loss, 0, f.capacity);
    // Faith that overflows capacity is wasted and does not count toward renown.
    f.earned += Math.max(0, Math.min(gain, f.current - before + loss));
    if (f.current <= 0 && world.player.form === 'possession') S.endPossession(world, 'Your Faith ran dry and the possession broke.');
  };

  S.spendFaith = function (world, amount, what) {
    const f = world.faith;
    if (amount > f.current + 1e-6) return false;
    f.current -= amount;
    f.spent += amount;
    if (what) f.lastSpend = { what, amount, t: world.t };
    return true;
  };

  S.addGratitude = function (world, c, hours = 24) {
    const perHour = U.round(0.4 + (c.belief / 100) * 1.6, 2);
    world.faith.boosts.push({ perHour, until: world.t + hours * 60, source: c.name });
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

(function (G) {
  'use strict';
  const S = G.Sim;
  const U = G.Util;
  const T = G.Time;

  const INTERP_LABEL = {
    protector: 'a compassionate protector',
    judge: 'a wrathful judge',
    coincidence: 'coincidence',
    deceiver: 'trickery or deception',
  };
  S.INTERP_LABEL = INTERP_LABEL;

  S.reputationLabel = function (world, communityId) {
    const r = world.reputation[communityId];
    if (!r) return 'Unknown';
    const total = r.protector + r.judge + r.coincidence + r.deceiver;
    if (total < 1) return 'No opinion yet';
    let best = 'protector';
    for (const k of Object.keys(r)) if (r[k] > r[best]) best = k;
    return { protector: 'Compassionate Protector', judge: 'Wrathful Judge', coincidence: 'Coincidence', deceiver: 'Deception' }[best];
  };

  // A witnessed miracle: each witness interprets it through their own beliefs.

  S.miracleWitnessed = function (world, opts) {

    const radius = 4 + opts.magnitude * 1.5;
    const ws = S.witnesses(world, opts.x, opts.y, radius, opts.vesselId);
    const district = opts.district || S.districtAt(world, opts.x, opts.y);
    const tally = { protector: 0, judge: 0, coincidence: 0, deceiver: 0, vessel: 0 };
    const vessel = S.char(world, opts.vesselId);
    for (const w of ws) {
      let interp;
      const bel = w.belief / 100;
      const pDivine = 0.15 + bel * 0.7 - w.traits.skepticism * 0.35 + opts.magnitude * 0.06;
      const r = rng.next();
      if (vessel && rng.chance(0.55)) interp = 'vessel';
      else if (r < pDivine) {
        const fear = opts.harmful ? 0.7 : (phil.fearBias || 0) + 0.08;
        interp = rng.chance(fear) ? 'judge' : 'protector';
        if (interp === 'protector' && phil.protectorBias) interp = 'protector';
      } else if (r < pDivine + 0.25 + w.traits.skepticism * 0.2) interp = 'coincidence';
      else interp = 'deceiver';
      tally[interp]++;
      w.divine.witnessed++;
      world.stats.miraclesWitnessed++;
      if (interp === 'protector' || interp === 'judge') {

        w.interpretation = interp;
        S.addMemory(world, w, 'miracle', `Witnessed ${opts.text}. Believes it was the work of ${INTERP_LABEL[interp]}.`, 2 + opts.magnitude * 0.5);

    if (crown) {
      crown.protector += tally.protector * 0.3;
      crown.judge += tally.judge * 0.3;
    }

      vessel.renown = U.clamp(vessel.renown + 10 + ws.length * 2, 0, 100);

      S.log(world, {
        title: 'Witnesses react',
        text: `${ws.length} witnessed ${opts.text}: ${believers} called it divine, ${tally.coincidence} coincidence, ${tally.deceiver} suspect deception${vessel ? `, ${tally.vessel} credit ${vessel.first}` : ''}.`,
        level: believers >= 3 || opts.magnitude >= 3 ? 2 : 1, kind: 'reaction', entities: ws.map((w) => w.id).slice(0, 12),
      });
    }

  S.maybeFoundMovement = function (world, ws, district, opts, vessel, tally) {
    const rng = world.rng;

      const m = world.movements.find((mm) => mm.active && mm.district === district);
      m.strength = U.clamp(m.strength + 4 + opts.magnitude * 2, 0, 100);
      for (const w of ws) if (w.belief > 55 && !w.movementId) {
        w.movementId = m.id;
        m.members++;
      }
      return;
    }
    const founder = (ws.find((w) => w.gift) || ws.slice().sort((a, b) => b.belief - a.belief)[0]);
    if (!founder) return;

    let name = rng.pick(['The Watchers of the', 'The Brethren of the', 'The Circle of the', 'The Witnesses of the']) + ' ' + rng.pick(['Water', 'Lantern', 'Open Hand', 'Second Dawn', 'Quiet Flame']);
    if (vessel && tally.vessel >= 3) {
      doctrine = 'saint';
      name = `The Followers of Saint ${vessel.first}`;
    }

      id: world.nextId++, name, doctrine, district, founderId: founder.id, foundedAt: world.t, strength: 12 + opts.magnitude * 4,
      members: 0, active: true, origin: opts.text, schismRisk: 0,
    };

      w.movementId = m.id;
      m.members++;
    }

      title: 'A new religious gathering begins',
      text: `${founder.name} began gathering believers after ${opts.text}. They call themselves ${m.name} and believe the divine is ${doctrine === 'saint' ? `working through ${vessel.name}` : INTERP_LABEL[doctrine]}.`,
      level: 2, kind: 'religion', entities: [founder.id],
    });
  };

  // Daily religious dynamics: movements grow or fade, merge into the church, or split from it.
  S.dailyReligion = function (world) {
    const rng = world.rng;
    const country = world.country;
    const living = S.living(world);
    const avgBelief = living.reduce((s, c) => s + c.belief, 0) / Math.max(1, living.length);
    const ch = world.church;
    ch.members = living.filter((c) => c.belief >= 35 && !c.movementId).length;
    const priest = S.char(world, ch.leaderId);
    if (!priest || !priest.alive) {
      const next = living.filter((c) => c.role === 'priest').sort((a, b) => b.belief - a.belief)[0];
      if (next) {
        ch.leaderId = next.id;
        if (next.title !== 'High Priestess' && next.title !== 'High Priest') {
          next.title = next.sex === 'f' ? 'High Priestess' : 'High Priest';
          next.name = `${next.title} ${next.first} ${next.last}`;
        }
        S.log(world, { title: 'A new head of the Church', text: `${next.name} now leads the ${ch.name}.`, level: 2, kind: 'religion', entities: [next.id] });
      }
    }
    const target = 20 + avgBelief * 0.6 + (priest && priest.alive ? 8 : -10) - country.exposure * 0.05;
    ch.strength = U.clamp(U.lerp(ch.strength, target, 0.02), 0, 100);

    for (const m of world.movements) {
      if (!m.active) continue;
      const members = living.filter((c) => c.movementId === m.id);
      m.members = members.length;
      const founder = S.char(world, m.founderId);
      const preaching = founder && founder.alive && (founder.prophet || founder.belief > 70) ? 1 : 0;
      m.strength = U.clamp(m.strength + preaching * 0.4 + members.length * 0.05 - 0.35 + rng.float(-0.3, 0.3), 0, 100);

      if (preaching && rng.chance(0.25)) {
        const cand = rng.pick(living.filter((c) => !c.movementId && c.belief > 45 && c.age >= 14));
        if (cand) {
          cand.movementId = m.id;
          S.addMemory(world, cand, 'religion', `Joined ${m.name}.`, 1);
        }
      }
      // Fade, merge, or split
      if (m.strength <= 2) {
        m.active = false;
        for (const c of members) c.movementId = null;
        S.log(world, { title: `${m.name} fades away`, text: `With few left to keep the memory alive, ${m.name} dissolved. ${m.origin ? 'Its story lingers only as a rumour.' : ''}`, level: 1, kind: 'religion' });
        continue;
      }
      const doctrineClash = m.doctrine !== ch.doctrine;
      if (world.t - m.foundedAt > T.DAY * 20) {
        if (!doctrineClash && m.strength > 25 && rng.chance(0.03)) {
          m.active = false;
          ch.strength = U.clamp(ch.strength + m.strength * 0.3, 0, 100);
          for (const c of members) c.movementId = null;
          S.log(world, { title: `${m.name} joins the Church`, text: `${m.name} was absorbed into the ${ch.name}, its founding miracle written into scripture.`, level: 2, kind: 'religion' });
        } else if (doctrineClash && m.strength > 35 && rng.chance(0.02) && !m.schism) {
          m.schism = true;
          ch.strength = U.clamp(ch.strength - 8, 0, 100);
          country.religiousInfluence = U.clamp(country.religiousInfluence - 4, 0, 100);
          S.log(world, { title: 'Schism', text: `${m.name} declared the ${ch.name} blind to the true nature of the divine (${m.doctrine === 'saint' ? 'a living saint' : INTERP_LABEL[m.doctrine]}). The faithful are divided.`, level: 3, kind: 'religion' });
        }
      }
    }
    // Province belief drifts toward the capital's mood and church strength.
    for (const p of world.provinces) {
      if (p.local) {
        p.belief = U.lerp(p.belief, avgBelief, 0.2);
      } else {
        const t = 25 + ch.strength * 0.35 + (country.exposure > 30 ? 6 : 0) - country.literacy * 0.1;
        p.belief = U.clamp(U.lerp(p.belief, t, 0.01) + rng.float(-0.3, 0.3), 0, 100);
      }
    }
    // Science and changing belief: education raises scrutiny, but does not erase faith.
    country.literacy = U.clamp(country.literacy + 0.006 + (country.government === 'democracy' || country.government === 'republic' ? 0.01 : 0), 0, 100);
    country.exposure = U.clamp(country.exposure - 0.15, 0, 100);
  };

  // The Gift: rare people can sense the spectral player.
  S.giftCheck = function (world) {
    const p = world.player;
    if (p.form !== 'spectral') return;
    for (const c of S.living(world)) {
      if (!c.gift || c.asleep) continue;
      if (U.dist(c.x, c.y, p.x, p.y) > 4) continue;
      if (world.t - (c.flags.sensedAt || -99999) < T.DAY) continue;
      c.flags.sensedAt = world.t;
      c.flags.senses = (c.flags.senses || 0) + 1;
      const rng = world.rng;
      let reaction;
      if (c.belief > 55) {
        reaction = 'reverent';
        S.adjustBelief(world, c, 6);
        if (c.flags.senses >= 3 && !c.prophet && c.age >= 16) {
          c.prophet = true;
          S.log(world, { title: 'A prophet emerges', text: `${c.name} has sensed your presence again and again, and now speaks of it openly in the streets.`, level: 2, kind: 'religion', entities: [c.id] });
        }
      } else if (c.traits.skepticism > 0.6) {
        reaction = 'investigating';
        c.traits.skepticism = U.clamp(c.traits.skepticism - 0.03, 0, 1);
      } else reaction = rng.chance(0.5) ? 'frightened' : 'curious';
      const text = {
        reverent: 'Sensed a luminous presence nearby and wept with joy.',
        investigating: 'Saw a shimmer in the air. Is determined to find a rational explanation.',
        frightened: 'Saw a pale light watching. Is frightened.',
        curious: 'Felt something unseen nearby and is curious what it wants.',
      }[reaction];
      S.addMemory(world, c, 'gift', text, 2);
      c.known.beliefs = true;
      S.log(world, { title: `${c.first} senses you`, text: `${c.name} has The Gift and perceives your presence (${reaction}).`, level: 1, kind: 'gift', entities: [c.id] });
    }
  };

      if (option === 'compassion') c.traits.kindness = U.clamp(c.traits.kindness + 0.05, 0, 1);
      if (option === 'zeal') S.adjustBelief(world, c, 6);
      S.addMemory(world, c, 'inspired', `Felt a sudden surge of ${option}.`, 1);
      // Inspired people act on it.
      S.actOnInspiration(world, c, option);
      return { msg: `${c.first} is filled with ${option}.` };
    },
    protect(world, b) {
      b.protectedUntil = world.t + T.DAY * 2;
      const inside = S.living(world).filter((c) => c.at === b.id || c.homeId === b.id);
      for (const c of inside) {
        c.flags.trapped = false;
        c.flags.protected = b.protectedUntil;
        S.addMemory(world, c, 'miracle', `Felt a calm, golden stillness settle over ${b.name}.`, 2);
        S.adjustBelief(world, c, 6);
      }
      if (world.flood.level > 0.1 && S.inFloodZone(b.x + b.w / 2, b.y + b.h / 2, world)) {
        S.miracleWitnessed(world, { x: b.x + b.w / 2, y: b.y + b.h / 2, kind: 'protect', text: `the floodwaters parting around ${b.name}`, magnitude: 3, vesselId: vesselId(world) });
      }
      for (const c of inside) S.addGratitude(world, c, 12);
      return { msg: `${b.name} is warded for two days (${inside.length} people).` };
    },
    smite(world, c) {
      c.injury = U.clamp(c.injury + 55, 0, 100);
      c.mood = U.clamp(c.mood - 30, 0, 100);
      S.addMemory(world, c, 'miracle', 'Was struck down by an unseen force.', 3);
      c.interpretation = 'judge';
      const o = { x: c.x, y: c.y };
      S.miracleWitnessed(world, { x: o.x, y: o.y, kind: 'smite', text: `${c.first} being struck down`, magnitude: 2, harmful: true, vesselId: vesselId(world) });
      if (c.corrupt) {
        world.country.corruption = U.clamp(world.country.corruption - 6, 0, 100);
        c.corrupt = world.rng.chance(0.5);
      }
      return { msg: `${c.name} was struck down.` };
    },
    reveal(world, c) {
      const country = world.country;
      if (c.corrupt) {
        country.corruption = U.clamp(country.corruption - 15, 0, 100);
        country.legitimacy = U.clamp(country.legitimacy - 6, 0, 100);
        country.reformPressure = U.clamp(country.reformPressure + 8, 0, 100);
        c.corrupt = false;
        c.renown = U.clamp(c.renown - 30, 0, 100);
        c.flags.disgraced = world.t;
        if (c.role === 'official') {
          c.flags.detainedUntil = world.t + T.DAY * 20;
          S.goTo(world, c, 'barracks', 'detained');
        }
        S.addMemory(world, c, 'disgrace', 'Their hidden misdeeds were laid bare before the city.', 3);
        S.miracleWitnessed(world, { x: c.x, y: c.y, kind: 'reveal', text: `the ledgers of ${c.name} spilling open in the street`, magnitude: 2, vesselId: vesselId(world) });
        S.log(world, { title: 'Corruption exposed', text: `${c.name}'s embezzlement was exposed for all to see. Trust in the Crown falls; the Reformers are emboldened.`, level: 2, kind: 'politics', entities: [c.id] });
        return { msg: `${c.name}'s corruption is revealed.` };
      }
      country.legitimacy = U.clamp(country.legitimacy - 2, 0, 100);
      return { msg: `You found nothing damning about ${c.first}. Rumours spread anyway.` };
    },
    inspire_leader(world, c, option) {
      const country = world.country;
      if (option === 'embolden' || option === 'shake') {
        const sign = option === 'embolden' ? 1 : -1;
        if (c.id === country.leaderId) country.legitimacy = U.clamp(country.legitimacy + sign * 9, 0, 100);
        const f = country.factions.find((ff) => ff.leaderId === c.id);
        if (f) f.power = U.clamp(f.power + sign * 8, 0, 100);
        c.renown = U.clamp(c.renown + sign * 10, 0, 100);
        c.mood = U.clamp(c.mood + sign * 15, 0, 100);
        S.addMemory(world, c, 'inspired', option === 'embolden' ? 'Felt certain of their destiny.' : 'Was gripped by doubt and dread.', 2);
        return { msg: `${c.name} is ${option === 'embolden' ? 'emboldened' : 'shaken'}.` };
      }
      const strength = 0.6 + c.belief / 150;
      c.inspiration = { tag: option, strength, until: world.t + T.DAY * 10 };
      S.addMemory(world, c, 'inspired', `Felt drawn toward ${option}.`, 2);
      S.adjustBelief(world, c, 3);
      return { msg: `${c.name} feels drawn toward ${option}. They still decide for themselves.` };
    },
    regional(world, p, option) {
      const country = world.country;
      const rng = world.rng;
      if (option === 'calm_waters') {
        S.endFlood(world, 'The waters stilled and fell away within the hour.');
        S.miracleWitnessed(world, { x: 44, y: 22, kind: 'regional', text: 'the floodwaters suddenly falling still and receding', magnitude: 3, district: 'riverside' });
        bumpProvince(world, 'riverlands', 8);
        return { msg: 'The flood is calmed.' };
      }
      if (option === 'divert_river') {
        world.flood.diverted = true;
        for (const c of S.living(world)) {
          if (c.flags.trapped && !S.isFlooded(world, c.x, c.y)) c.flags.trapped = false;
        }
        S.log(world, { title: 'The river turns', text: 'The swollen river cut a new channel north, sparing the Riverside farms but drowning the North Fields and the Upland Farm.', level: 2, kind: 'disaster' });
        S.miracleWitnessed(world, { x: 44, y: 9, kind: 'regional', text: 'the river turning in its bed', magnitude: 3, district: 'riverside' });
        country.economy = U.clamp(country.economy - 2, 0, 100);
        return { msg: 'The river is diverted to the North Fields.' };
      }
      if (option === 'bountiful_harvest') {
        p.economy = U.clamp(p.economy + 15, 0, 100);
        country.economy = U.clamp(country.economy + 5, 0, 100);
        country.flags.famine = false;
        for (const c of S.living(world)) {
          c.hunger = 0;
          if (c.role === 'farmer') c.wealth = U.clamp(c.wealth + 20, 0, 100);
        }
        bumpProvince(world, p.id, 6);
        S.miracleWitnessed(world, { x: 54, y: 20, kind: 'regional', text: 'the fields bursting with grain overnight', magnitude: 2, district: 'riverside' });
        return { msg: `${p.name} enjoys a miraculous harvest.` };
      }
      if (option === 'cleanse_plague') {
        world.plague.active = false;
        for (const c of S.living(world)) if (c.illness && c.illness.name === 'the plague') c.illness = null;
        for (const pr of world.provinces) pr.plague = 0;
        S.log(world, { title: 'The sickness lifts', text: 'Overnight, the plague broke. The sick rose from their beds.', level: 3, kind: 'divine' });
        S.miracleWitnessed(world, { x: 20, y: 30, kind: 'regional', text: 'the plague vanishing overnight', magnitude: 3, district: 'oldtown' });
        bumpProvince(world, p.id, 10);
        return { msg: 'The plague is cleansed.' };
      }
      if (option === 'storm_on_enemy') {
        world.war.score = U.clamp(world.war.score + 30, -100, 100);
        S.log(world, { title: 'Storm over the Highmarch', text: `A sudden storm scattered the ${S.neighbor(world, world.war.enemy).name} army.`, level: 3, kind: 'war' });
        bumpProvince(world, 'highmarch', 8);
        country.exposure = U.clamp(country.exposure + 6 * rng.float(0.8, 1.2), 0, 100);
        return { msg: 'A storm breaks upon the invaders.' };
      }
      return { msg: 'Nothing happened.' };
    },
    national(world, _c, option) {
      const country = world.country;
      if (option === 'rally_nation') {
        country.legitimacy = U.clamp(country.legitimacy + 12, 0, 100);
        country.eliteLoyalty = U.clamp(country.eliteLoyalty + 10, 0, 100);
        country.revolutionRisk = Math.max(0, country.revolutionRisk - 20);
        for (const p of world.provinces) p.unrest = Math.max(0, p.unrest - 15);
        country.exposure = U.clamp(country.exposure + 8, 0, 100);
        S.log(world, { title: 'The nation rallies', text: 'A wave of shared purpose swept Velmora. Old quarrels were set aside, for now.', level: 3, kind: 'divine' });
        return { msg: 'The nation rallies.' };
      }
      if (option === 'forge_peace') {
        S.endWar(world, 'peace', 'Both armies laid down their arms after their commanders shared the same dream.');
        country.exposure = U.clamp(country.exposure + 10, 0, 100);
        return { msg: 'Peace is forged.' };
      }
      if (option === 'humble_ruler') {
        const l = S.leader(world);
        country.legitimacy = U.clamp(country.legitimacy - 25, 0, 100);
        country.corruption = U.clamp(country.corruption - 10, 0, 100);
        if (l) {
          l.traits.ambition = U.clamp(l.traits.ambition - 0.2, 0, 1);
          l.traits.kindness = U.clamp(l.traits.kindness + 0.15, 0, 1);
          S.addMemory(world, l, 'miracle', 'Was humbled before the whole court by a voice from heaven.', 3);
        }
        country.exposure = U.clamp(country.exposure + 12, 0, 100);
        S.log(world, { title: 'The ruler humbled', text: `${l ? l.name : 'The ruler'} was humbled before the court. The realm whispers of divine judgement.`, level: 3, kind: 'divine' });
        return { msg: 'The ruler is humbled.' };
      }
      return { msg: 'Nothing happened.' };
    },
    global(world) {
      for (const c of S.living(world)) {
        S.adjustBelief(world, c, 20 - c.traits.skepticism * 15);
        S.addMemory(world, c, 'miracle', 'Saw a sign blaze across the heavens.', 3);
      }
      for (const p of world.provinces) p.belief = U.clamp(p.belief + 15, 0, 100);
      world.country.exposure = U.clamp(world.country.exposure + 40, 0, 100);
      for (const n of world.neighbors) n.relation = U.clamp(n.relation + 10, -100, 100);
      S.log(world, { title: 'A sign in the heavens', text: 'For one night the sky burned with light seen across the whole world. Nothing will ever be quite the same.', level: 3, kind: 'divine' });
      return { msg: 'The whole world saw the sign.' };
    },
  };
  S.EFFECTS = EFFECTS;

  function bumpProvince(world, id, belief) {
    const p = S.province(world, id);
    if (p) p.belief = U.clamp(p.belief + belief, 0, 100);
    const r = world.reputation[id];
    if (r) r.protector += 5;
  }

  // Inspired people act according to their circumstances.
  S.actOnInspiration = function (world, c, kind) {
    if (kind === 'courage' || kind === 'compassion') {
      // Help someone in danger nearby, or organise a rescue if they hold office.
      const endangered = S.living(world).filter((o) => o.flags.trapped);
      if (endangered.length && (c.role === 'general' || c.role === 'official' || c.role === 'monarch' || c.role === 'heir' || c.role === 'soldier' || c.role === 'guard')) {
        S.organizeRescue(world, c);
      } else if (endangered.length && c.age >= 16) {
        const near = endangered.sort((a, b) => U.dist(a.x, a.y, c.x, c.y) - U.dist(b.x, b.y, c.x, c.y))[0];
        S.schedule(world, 90 + world.rng.int(0, 120), 'neighbor_rescue', { helperId: c.id, homeId: near.homeId });
        S.log(world, { title: `${c.first} sets out to help`, text: `${c.name} has resolved to reach the ${near.last} family.`, level: 1, kind: 'event', entities: [c.id, near.id] });
      }
    }
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));
