    const off = S.living(world).find((x) => x.corrupt);
    if (off && o.role !== 'official' && world.rng.chance(0.3)) return `${off.name} has been skimming the grain tax.`;
    const m = world.movements.find((mm) => mm.active);
    if (m) return `${m.name} meets in secret near the ${S.districtName(m.district)}.`;
    return '';
  };

  function mortalDeath(world, text) {
    const p = world.player;
    p.human.health = 100;
    p.human.cooldownUntil = world.t + T.DAY;

    p.x = p.human.x;
    p.y = p.human.y;
    p.form = 'spectral';
  }

  // Hourly human-form risks: guards, suspicion, floodwater.
  S.humanHourly = function (world) {
    const p = world.player;
    if (p.form !== 'human') return;
    const h = p.human;
    if (h.detainedUntil > world.t) return;
    if (h.detainedUntil && h.detainedUntil <= world.t) {
      h.detainedUntil = 0;
      S.log(world, { title: 'Released', text: 'The guards released you with a warning.', level: 0, kind: 'divine' });
    }
    const b = S.buildingAt(world, h.x, h.y);
    const guards = S.witnesses(world, h.x, h.y, 5).filter((c) => c.role === 'guard' || c.role === 'soldier' || c.role === 'general');
    if (b && b.guarded && guards.length) h.suspicion = U.clamp(h.suspicion + 25, 0, 100);
    h.suspicion = Math.max(0, h.suspicion - 2);
    if (h.suspicion >= 60 && guards.length && world.rng.chance(0.5)) {
      h.detainedUntil = world.t + 12 * 60;
      h.x = 30;
      h.y = 4;
      h.suspicion = 20;
      S.log(world, { title: 'Detained', text: 'Guards seized you as a suspicious stranger and threw you in the gaol for the night. (Abandoning the body will be noticed.)', level: 2, kind: 'divine', alert: true });
    }
    if (S.isFlooded(world, h.x, h.y) && world.flood.level > 0.5 && world.rng.chance(0.3)) {
      h.health -= world.rng.int(10, 25);
      if (h.health <= 0) mortalDeath(world, 'You drowned in the floodwater.');
    }
  };

  // Spectral observation gradually reveals what people are like (imperfect information).
  S.observeMinute = function (world) {
    const pos = S.playerPos(world);
    if (world.t % 10 !== 0) return;
    for (const c of S.living(world)) {
      if (U.dist(c.x, c.y, pos.x, pos.y) > 3) continue;
      c.flags.observed = (c.flags.observed || 0) + 10;
      if (c.flags.observed >= 30) c.known.traits = true;
      if (c.flags.observed >= 60) c.known.beliefs = true;
      if (c.flags.observed >= 120) c.known.memories = true;
    }
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

  const S = G.Sim;
  const U = G.Util;
  const T = G.Time;

  S.MAX_STEPS_PER_CALL = 3000;

  S.stepMinute = function (world) {
    world.t++;
    S.processScheduled(world);
    S.moveCharacters(world);
    S.floodMinute(world);
    S.faithMinute(world);
    S.possessionMinute(world);
    S.observeMinute(world);
    if (world.t % 5 === 0) S.giftCheck(world);
    if (world.t % 60 === 0) S.hourly(world);
    if (T.minuteOfDay(world) === 0) S.daily(world);
  };

  S.hourly = function (world) {
    const hour = T.hour(world);
    for (const id in world.chars) S.hourlyRoutine(world, world.chars[id], hour);
    S.floodRoutineOverrides(world);
    S.floodHourly(world);
    S.generatePrayers(world);
    S.prayersHourly(world);
    S.politicsHourly(world);
    S.humanHourly(world);
    S.worshipHour(world, hour);
    S.updateTier(world);
    S.recomputeFaithRates(world);
  };

  S.daily = function (world) {
    S.dailyLife(world);
    S.dailyReligion(world);
    S.dailyPolitics(world);
    S.dailyCrises(world);
    S.checkChallenge(world);
    const p = T.dateParts(world);
    if (p.month === 0 && p.md === 1) {
      S.yearlyLife(world);
      S.log(world, { title: `The year ${p.year}`, text: `A new year begins in ${world.country.name}.`, level: 1, kind: 'history' });
    }
    const living = S.living(world);
    world.history.push({
      t: world.t, faith: Math.round(world.faith.current), net: world.faith.rates.net, belief: Math.round(living.reduce((s, c) => s + c.belief, 0) / Math.max(1, living.length)),
      legitimacy: Math.round(world.country.legitimacy), stability: Math.round(world.country.stability), exposure: Math.round(world.country.exposure), pop: living.length,
    });
    if (world.history.length > 720) world.history.splice(0, world.history.length - 720);

  S.floodRoutineOverrides = function (world) {

    for (const c of S.living(world)) {
      if (c.possessed || c.flags.trapped || c.flags.evacuating || c.flags.detainedUntil > world.t) continue;
      const home = S.building(world, c.homeId);
      if (!home || !S.inFloodZone(home.x + 1, home.y + 1, world)) {

        const dest = S.building(world, c.at) || G.Data.city.zones.find((z) => z.id === c.at);
        if (dest && S.inFloodZone(dest.x + dest.w / 2, dest.y + dest.h / 2, world)) S.goTo(world, c, c.homeId, 'staying away from the flood');
        continue;
      }
      const homeWet = S.isFlooded(world, home.x + 1, home.y + 1);
      const physicallyHome = (S.buildingAt(world, c.x, c.y) || {}).id === c.homeId;
      if (homeWet && physicallyHome) {
        c.at = c.homeId; // the water is at the door: stay put
        c.path = [];
        c.activity = 'waiting out the flood';
      } else if (homeWet) {
        c.flags.evacuating = true; // cannot get home: go to the shelter
        S.goTo(world, c, 'temple', 'sheltering');
      } else {
        S.goTo(world, c, c.homeId, c.age >= 15 ? 'sandbagging the farm' : 'sheltering at home');
      }
    }
  };

  // Worship services generate a pulse of Faith and strengthen belief.
  S.worshipHour = function (world, hour) {
    if (!T.isRestday(world) || hour !== 11) return;
    const att = S.living(world).filter((c) => c.at === 'temple' && (c.activity === 'at worship' || c.activity === 'leading worship'));
    if (!att.length) return;
    const priest = S.char(world, world.church.leaderId);
    const pulse = U.round(att.length * 1.5 * (0.5 + world.church.strength / 100), 1);
    const before = world.faith.current;
    world.faith.current = U.clamp(world.faith.current + pulse, 0, world.faith.capacity);
    world.faith.earned += world.faith.current - before;
    for (const c of att) S.adjustBelief(world, c, priest && priest.alive ? 0.8 : 0.3);
    S.log(world, { title: 'Restday worship', text: `${att.length} gathered at the Temple. (+${pulse} Faith)`, level: 0, kind: 'religion' });
  };

  // Advance the world by real elapsed time scaled by speed. Returns steps run.
  S.advance = function (world, minutes) {
    const n = Math.min(Math.floor(minutes), S.MAX_STEPS_PER_CALL);
    for (let i = 0; i < n; i++) S.stepMinute(world);
    return n;
  };

  // Headless: run an exact number of minutes with no per-call cap (tests, tools).
  S.run = function (world, minutes) {
    for (let i = 0; i < minutes; i++) S.stepMinute(world);
  };

  // ---------- Challenge evaluation ----------
  S.checkChallenge = function (world) {
    const ch = world.challenge;
    if (ch.status !== 'active') return;
    const def = G.Data.challenges[ch.id];
    const c = world.country;
    const day = Math.floor(world.t / T.DAY);
    const fail = (why) => {
      ch.status = 'lost';
      S.log(world, { title: `Challenge failed: ${def.name}`, text: why, level: 3, kind: 'challenge', alert: true });
    };
    const win = (why) => {
      ch.status = 'won';
      S.log(world, { title: `Challenge complete: ${def.name}`, text: why, level: 3, kind: 'challenge', alert: true });
    };
    if (ch.id === 'silent') {
      ch.progress = day / def.days;
      if (c.exposure > 20) return fail('Too many people saw what you did. The age of silence is over.');
      if (world.church.strength < 45 && day > 30) return fail('The Church withered without signs.');
      if (day >= def.days) return win('Two years of quiet faith. The Church endures without a single public wonder.');
    } else if (ch.id === 'empire') {
      if (ch.possessedRuler) return fail('You seized the ruler directly. That is not an empire of faith.');
      if (c.religiousInfluence >= 85) ch.holdDays++;
      else ch.holdDays = 0;
      ch.progress = ch.holdDays / 60;
      if (ch.holdDays >= 60) return win('Faith shapes every law and every heart, and no one forced it.');
    } else if (ch.id === 'brink') {
      ch.progress = day / def.days;
      if (c.stability < 25 && day > 5) return fail('The kingdom tipped into collapse.');
      if (day >= def.days) return win('Velmora walked the edge of the abyss and did not fall.');
    } else if (ch.id === 'handsoff') {
      ch.progress = day / def.days;
      if (ch.miracles > def.maxMiracles) return fail('You could not keep your hands off.');
      if (day >= def.days) return c.stability >= 45 ? win('Humanity found its own way, with only the lightest touch.') : fail('Humanity floundered without you.');
    }
  };

  // ---------- Commands (the UI's only way to change the world) ----------
  S.command = function (world, cmd) {
    switch (cmd.type) {
      case 'ability':
        return S.useAbility(world, cmd.ability, cmd.target, cmd.option);
      case 'prayer':
        return S.respondPrayer(world, cmd.prayerId, cmd.kind);
      case 'form':
        return S.setForm(world, cmd.form, cmd.targetId);
      case 'possessedAct':
        return S.possessedAct(world, cmd.act);
      case 'humanAct':
        return S.humanAct(world, cmd.act);
      case 'speakGifted': {
        const c = S.char(world, cmd.targetId);
        if (!c || !c.gift) return { ok: false, msg: 'They cannot hear you.' };
        if (world.player.form !== 'spectral') return { ok: false, msg: 'Only in spectral form.' };
        if (U.dist(c.x, c.y, world.player.x, world.player.y) > 4) return { ok: false, msg: 'Move closer.' };
        if (!S.spendFaith(world, 3, 'Whisper')) return { ok: false, msg: 'Not enough Faith (3).' };
        c.known.traits = c.known.beliefs = c.known.memories = true;
        S.adjustBelief(world, c, c.belief > 40 ? 3 : -1);
        S.addMemory(world, c, 'gift', 'Heard a voice that no one else could hear.', 2);
        const r = S.rumour(world, c);
        return { ok: true, msg: `${c.first} hears you.${r ? ` They whisper back: "${r}"` : ' They whisper back that they will listen.'}` };
      }
      default:
        return { ok: false, msg: 'Unknown command' };
    }
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

// Persistence: versioned JSON saves. Derived lookups are rebuilt on load, never saved.
(function (G) {
  'use strict';
  const S = G.Sim;

  // Migrations from older save versions: { fromVersion: fn(data) -> data }
  const MIGRATIONS = {};

  S.serialize = function (world) {
    return JSON.stringify(world, (key, value) => {
      if (key === 'buildingMap' || key === 'autosaveDue') return undefined;
      return value;
    });
  };

  S.deserialize = function (json) {
    let data = typeof json === 'string' ? JSON.parse(json) : json;
    if (!data || typeof data !== 'object' || !data.chars || !data.country) throw new Error('Not a GODSIM save file.');
    let v = data.version || 0;
    if (v > G.SAVE_VERSION) throw new Error(`This save is from a newer version of GODSIM (save v${v}, game supports v${G.SAVE_VERSION}).`);
    while (v < G.SAVE_VERSION) {
      const m = MIGRATIONS[v];
      if (!m) throw new Error(`Cannot migrate save from version ${v}.`);
      data = m(data);
      v = data.version;
    }
    const rng = new G.Rng(1);
    rng.state = data.rng && data.rng.state != null ? data.rng.state >>> 0 : (data.seed >>> 0);
    data.rng = rng;
    data.buildingMap = {};
    for (const b of data.buildings) data.buildingMap[b.id] = b;
    return data;
  };

  // Storage abstraction so the same code works in the browser (localStorage) and tests (in-memory).
  S.storage = (function () {
    const mem = {};
    const ls = typeof localStorage !== 'undefined' ? localStorage : null;
    return {
      get: (k) => {
        try {
          return ls ? ls.getItem(k) : mem[k] || null;
        } catch (e) {
          return mem[k] || null;
        }
      },
      set: (k, v) => {
        try {
          if (ls) ls.setItem(k, v);
          else mem[k] = v;
          return true;
        } catch (e) {
          mem[k] = v;
          return false;
        }
      },
      remove: (k) => {
        try {
          if (ls) ls.removeItem(k);
        } catch (e) {
          /* ignore */
        }
        delete mem[k];
      },
    };
  })();

  const KEY = (slot) => `godsim.save.${slot}`;
  S.SLOTS = ['autosave', 'slot1', 'slot2', 'slot3'];

  S.saveToSlot = function (world, slot) {
    const json = S.serialize(world);
    // Keep the previous autosave as a backup to recover from a failed write.
    if (slot === 'autosave') {
      const prev = S.storage.get(KEY('autosave'));
      if (prev) S.storage.set(KEY('autosave.bak'), prev);
    }
    const ok = S.storage.set(KEY(slot), json);
    S.storage.set(
      KEY(slot) + '.meta',
      JSON.stringify({ t: world.t, date: G.Time.format(world), country: world.country.name, gov: world.country.government, savedAt: Date.now(), size: json.length })
    );
    return ok;
  };

  S.loadFromSlot = function (slot) {
    const json = S.storage.get(KEY(slot));
    if (!json) return null;
    try {
      return S.deserialize(json);
    } catch (e) {
      if (slot === 'autosave') {
        const bak = S.storage.get(KEY('autosave.bak'));
        if (bak) return S.deserialize(bak);
      }
      throw e;
    }
  };

  S.slotMeta = function (slot) {
    try {
      return JSON.parse(S.storage.get(KEY(slot) + '.meta') || 'null');
    } catch (e) {
      return null;
    }
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

// Shared UI state and helpers. The UI reads world state and sends commands; it never owns simulation logic.
(function (G) {
  'use strict';
  const UI = G.UI;
  const U = G.Util;
  const S = G.Sim;

  UI.SPEEDS = [0, 10, 30, 120, 720, 2880]; // game minutes per real second
  UI.SPEED_NAMES = ['Paused', 'Slow', 'Normal', 'Fast', 'Very fast', 'Generations'];

  UI.state = {
    world: null,
    view: 'local',
    speed: 0,
    selected: null, // { kind: 'character'|'building'|'prayer'|'province'|'country', id }
    ltab: 'prayers',
    rtab: 'inspect',
    prayerFilter: 'all',
    overlay: 'belief',
    roofMode: 'auto', // auto | cutaway
    camera: { x: 30, y: 16, zoom: 1, follow: true },
    keys: {},
    dirty: true,
    seenChronicle: 0,
    seenAlerts: 0,
    lastAutosave: 0,
    abilityOptions: {}, // remembers chosen option per ability
  };

  UI.esc = U.escape;
  UI.$ = (sel) => document.querySelector(sel);
  UI.$$ = (sel) => Array.from(document.querySelectorAll(sel));

  UI.meter = function (label, v, color, valText, title) {
    const pct = U.clamp(v, 0, 100);
    return `<div class="meter" ${title ? `title="${UI.esc(title)}"` : ''}><span>${label}</span><div class="bar"><div style="width:${pct}%;background:${color || 'var(--teal)'}"></div></div><span class="val">${valText != null ? valText : U.level5(v)}</span></div>`;
  };

  UI.toast = function (msg, kind) {
    if (!msg) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = msg;
    UI.$('#toasts').appendChild(el);
    setTimeout(() => el.remove(), kind === 'alert' ? 7000 : 4200);
    const all = UI.$$('#toasts .toast');
    while (UI.$$('#toasts .toast').length > 3) UI.$('#toasts .toast').remove();
  };

  // Send a command to the simulation and report the outcome.
  UI.cmd = function (cmd) {
    const w = UI.state.world;
    const r = G.Sim.command(w, cmd);
    if (r && r.msg) UI.toast(UI.esc(r.msg) + (r.cost ? ` <span class="gold">−${r.cost} Faith</span>` : ''), r.ok ? '' : 'bad');
    UI.state.dirty = true;
    return r;
  };

  UI.select = function (kind, id, opts = {}) {
    UI.state.selected = kind ? { kind, id } : null;
    if (kind && kind !== 'country') UI.state.rtab = 'inspect';
    if (opts.focus && kind === 'character') {
      const c = S.char(UI.state.world, id);
      if (c) {
        if (UI.state.view !== 'local') UI.setView('local');
        UI.state.camera.follow = false;
        UI.state.camera.x = c.x;
        UI.state.camera.y = c.y;
      }
    }
    UI.state.dirty = true;
  };

  UI.roleColor = function (c) {
    if (c.role === 'monarch' || c.role === 'heir') return '#f2c94c';
    if (c.role === 'priest') return '#f5f0e6';
    if (c.role === 'noble') return '#c58af9';
    if (c.role === 'general' || c.role === 'soldier' || c.role === 'guard') return '#e2564f';
    if (c.role === 'reformer' || c.factionId === 'reformers') return '#4fc3f7';
    if (c.role === 'healer') return '#7ee08a';
    if (c.role === 'farmer') return '#c9a46a';
    if (c.role === 'child') return '#ffd7a8';
    if (c.role === 'official' || c.role === 'clerk') return '#b0bec5';
    return '#d9c7b0';
  };

  UI.beliefColor = (b) => {
    // cool grey (doubt) -> gold (devotion)
    const t = U.clamp(b / 100, 0, 1);
    const r = Math.round(U.lerp(110, 245, t));
    const g = Math.round(U.lerp(120, 200, t));
    const bl = Math.round(U.lerp(150, 70, t));
    return `rgb(${r},${g},${bl})`;
  };

  UI.charLink = (c) => (c ? `<span class="link" data-char="${c.id}">${UI.esc(c.name)}</span>` : '—');
  UI.timeAgo = (w, t) => G.Time.duration(w.t - t) + ' ago';
})((globalThis.GODSIM = globalThis.GODSIM || {}));

        g.fillStyle = (xx / 6) % 2 ? '#8a6440' : '#7a5636';
        g.fillRect(xx, by, 5.5, bh);
      }
      g.fillStyle = '#4e3825';
      g.fillRect(bx, by - 3, bw, 4);
      g.fillRect(bx, by + bh - 1, bw, 4);
      for (let xx = bx; xx <= bx + bw; xx += 16) {
        g.fillRect(xx - 2, by - 5, 5, 6);
        g.fillRect(xx - 2, by + bh - 2, 5, 6);
      }
    }
    // Farm yards: fences with a gate on the south side
    for (const b of city.buildings.filter((x) => x.type === 'farmhouse')) {
      const fx = (b.x - 0.6) * P, fy = (b.y - 0.6) * P, fw = (b.w + 1.2) * P, fh = (b.h + 1.2) * P;
      g.fillStyle = 'rgba(120,95,55,0.25)';
      g.fillRect(fx, fy, fw, fh);
      g.strokeStyle = '#6b4f30';
      g.lineWidth = 2;
      const gateL = fx + fw / 2 - P * 0.6, gateR = fx + fw / 2 + P * 0.6;
      g.beginPath();
      g.moveTo(gateL, fy + fh);
      g.lineTo(fx, fy + fh);
      g.lineTo(fx, fy);
      g.lineTo(fx + fw, fy);
      g.lineTo(fx + fw, fy + fh);
      g.lineTo(gateR, fy + fh);
      g.stroke();
      g.fillStyle = '#4e3825';
      const post = (px, py) => g.fillRect(px - 1.5, py - 1.5, 3, 3);
      for (let xx = fx; xx <= fx + fw; xx += 10) {
        post(xx, fy);
        if (xx < gateL || xx > gateR) post(xx, fy + fh);
      }
      for (let yy = fy; yy <= fy + fh; yy += 10) {
        post(fx, yy);
        post(fx + fw, yy);
      }
      // hay and a cart
      const r = rnd(strHash(b.id));
      g.fillStyle = '#d0aa52';
      rr(g, fx + fw - 14, fy + 4, 10, 8, 3);
      g.fill();
      g.strokeStyle = '#a07e34';
      g.stroke();
      if (r() < 0.6) {
        g.fillStyle = '#6b4f30';
        g.fillRect(fx + 4, fy + 5, 14, 8);
        g.fillStyle = '#2b2118';
        g.beginPath();
        g.arc(fx + 7, fy + 14, 2.4, 0, Math.PI * 2);
        g.arc(fx + 15, fy + 14, 2.4, 0, Math.PI * 2);
        g.fill();
      }
    }
    // Trees and bushes on free grass
    const trees = [];
    for (let y = 0; y < city.height; y++) {
      for (let x = 0; x < city.width; x++) {
        if (occ[x][y] !== 0) continue;
        const n = hash(x, y, 9);
        const east = x > city.river.x1;
        if (n < (east ? 0.16 : 0.1)) trees.push({ x: x + 0.3 + hash(x, y, 3) * 0.4, y: y + 0.3 + hash(x, y, 4) * 0.4, s: 0.7 + hash(x, y, 5) * 0.5, kind: hash(x, y, 6) < 0.25 ? 'pine' : 'oak' });
        else if (n < (east ? 0.24 : 0.18)) {
          const bx = (x + 0.5) * P, by = (y + 0.5) * P;
          g.fillStyle = 'rgba(0,0,0,0.25)';
          g.beginPath();
          g.ellipse(bx + 2, by + 4, 7, 3, 0, 0, Math.PI * 2);
          g.fill();
          for (const [dx, dy, rad, col] of [[-3, 0, 5, '#3f6b2c'], [3, -1, 5, '#4a7a33'], [0, -3, 5, '#558a3a']]) {
            g.fillStyle = col;
            g.beginPath();
            g.arc(bx + dx, by + dy, rad, 0, Math.PI * 2);
            g.fill();
          }
        }
      }
    }
    trees.sort((a, b) => a.y - b.y);
    for (const t of trees) drawTree(g, t.x * P, t.y * P, t.s * P * 0.55, t.kind);
    return c;
  };

  function drawTree(g, x, y, r, kind) {
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.beginPath();
    g.ellipse(x + r * 0.35, y + r * 0.55, r * 1.05, r * 0.5, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#4a3420';
    g.fillRect(x - r * 0.12, y - r * 0.1, r * 0.24, r * 0.65);
    if (kind === 'pine') {
      for (let i = 0; i < 3; i++) {
        g.fillStyle = ['#244a2e', '#2d5a36', '#376a40'][i];
        const w = r * (1 - i * 0.25);
        const top = y - r * (0.6 + i * 0.45);
        g.beginPath();
        g.moveTo(x, top - r * 0.6);
        g.lineTo(x + w, top + r * 0.45);
        g.lineTo(x - w, top + r * 0.45);
        g.closePath();
        g.fill();
      }
    } else {
      const blobs = [[0, -0.75, 0.75, '#2f5a26'], [-0.45, -0.45, 0.6, '#36652b'], [0.45, -0.5, 0.6, '#36652b'], [0, -1.05, 0.55, '#427534'], [-0.2, -0.9, 0.35, '#5a9045']];
      for (const [dx, dy, rad, col] of blobs) {
        g.fillStyle = col;
        g.beginPath();
        g.arc(x + dx * r, y + dy * r, rad * r, 0, Math.PI * 2);
        g.fill();
      }
    }
  }

  // ---------- building styles ----------
  const STYLE = {
    palace: { floor: 'marble', wall: '#cfc6b4', roof: '#4d5578', roofKind: 'slate' },
    manor: { floor: 'parquet', wall: '#b8a58a', roof: '#6e3b3b', roofKind: 'tile' },
    barracks: { floor: 'stone', wall: '#8a8478', roof: '#6f6a60', roofKind: 'flat' },
    healer: { floor: 'planks', wall: '#bfae8e', roof: '#5f6f4a', roofKind: 'tile' },
    temple: { floor: 'flags', wall: '#d8d0bc', roof: '#6d7177', roofKind: 'slate' },
    market: { floor: 'cobble', wall: null, roof: null },
    academy: { floor: 'planks', wall: '#b9b2a2', roof: '#4a5a6e', roofKind: 'slate' },
    tavern: { floor: 'planks', wall: '#a88a64', roof: '#7b4a2c', roofKind: 'tile' },
    home: { floor: 'planks', wall: '#b39c7c', roof: null, roofKind: 'tile' },
    farmhouse: { floor: 'earth', wall: '#a8916c', roof: '#b8964f', roofKind: 'thatch' },
  };
  const HOME_ROOFS = ['#9c4a32', '#8a5a3a', '#7d4433', '#a35a3a', '#6e4a3a'];
  Sc.roofColor = (b) => STYLE[b.type].roof || HOME_ROOFS[strHash(b.id) % HOME_ROOFS.length];

  function floor(g, b, kind) {
    const x0 = b.x * P, y0 = b.y * P, w = b.w * P, h = b.h * P;
    const r = rnd(strHash(b.id + 'f'));
    if (kind === 'planks' || kind === 'parquet') {
      g.fillStyle = kind === 'parquet' ? '#8a6238' : '#9a7448';
      g.fillRect(x0, y0, w, h);
      for (let yy = y0; yy < y0 + h; yy += 6) {
        g.fillStyle = `rgba(60,35,15,${0.15 + r() * 0.15})`;
        g.fillRect(x0, yy, w, 1);
        for (let xx = x0 + r() * 20; xx < x0 + w; xx += 18 + r() * 14) g.fillRect(xx, yy, 1, 6);
      }
    } else if (kind === 'marble') {
      for (let yy = 0; yy < b.h * 2; yy++) for (let xx = 0; xx < b.w * 2; xx++) {
        g.fillStyle = (xx + yy) % 2 ? '#e4ddd0' : '#b9b0a4';
        g.fillRect(x0 + xx * P / 2, y0 + yy * P / 2, P / 2, P / 2);
      }
    } else if (kind === 'stone' || kind === 'flags' || kind === 'cobble') {
      g.fillStyle = kind === 'flags' ? '#a9a092' : kind === 'cobble' ? '#8c8273' : '#7e786e';
      g.fillRect(x0, y0, w, h);
      const step = kind === 'cobble' ? 7 : 12;
      for (let yy = y0; yy < y0 + h; yy += step) {
        for (let xx = x0 + ((yy / step) % 2) * step / 2; xx < x0 + w; xx += step) {
          g.fillStyle = `rgba(255,255,255,${r() * 0.08})`;
          g.fillRect(xx + 1, yy + 1, step - 2, step - 2);
          g.strokeStyle = 'rgba(0,0,0,0.18)';
          g.lineWidth = 1;
          g.strokeRect(xx + 0.5, yy + 0.5, step - 1, step - 1);
        }
      }
    } else {
      g.fillStyle = '#7d6446';
      g.fillRect(x0, y0, w, h);
      for (let k = 0; k < b.w * b.h * 6; k++) {
        g.fillStyle = `rgba(40,25,10,${r() * 0.25})`;
        g.fillRect(x0 + r() * w, y0 + r() * h, 2, 2);
      }
      for (let k = 0; k < b.w * 3; k++) {
        g.strokeStyle = 'rgba(220,190,110,0.5)';
        const sx = x0 + r() * w, sy = y0 + r() * h;
        g.beginPath();
        g.moveTo(sx, sy);
        g.lineTo(sx + 4, sy + 1);
        g.stroke();
      }
    }
  }

  // Furniture helpers (coordinates in tiles relative to building origin)
  function bed(g, b, tx, ty, blanket, vertical = true) {
    const x = (b.x + tx) * P, y = (b.y + ty) * P;
    const w = vertical ? P * 0.55 : P * 0.95, h = vertical ? P * 0.95 : P * 0.55;
    g.fillStyle = '#5b3d22';
    rr(g, x, y, w, h, 2);
    g.fill();
    g.fillStyle = blanket;
    rr(g, x + 2, y + (vertical ? h * 0.3 : 2), w - 4, vertical ? h * 0.67 : h - 4, 2);
    g.fill();
    g.fillStyle = '#efe9dc';
    if (vertical) rr(g, x + 3, y + 2, w - 6, h * 0.22, 2);
    else rr(g, x + 2, y + 3, w * 0.22, h - 6, 2);
    g.fill();
  }
  function table(g, b, tx, ty, tw, th, round) {
    const x = (b.x + tx) * P, y = (b.y + ty) * P;
    g.fillStyle = 'rgba(0,0,0,0.25)';
    if (round) {
      g.beginPath();
      g.arc(x + 2, y + 3, tw * P / 2, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#6e4a2a';
      g.beginPath();
      g.arc(x, y, tw * P / 2, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = '#4a3018';
      g.stroke();
      for (let a = 0; a < 4; a++) stool(g, x + Math.cos(a * Math.PI / 2 + 0.6) * tw * P * 0.75, y + Math.sin(a * Math.PI / 2 + 0.6) * tw * P * 0.75);
      return;
    }
    g.fillRect(x + 2, y + 3, tw * P, th * P);
    g.fillStyle = '#6e4a2a';
    g.fillRect(x, y, tw * P, th * P);
    g.strokeStyle = '#4a3018';
    g.lineWidth = 1;
    g.strokeRect(x + 0.5, y + 0.5, tw * P - 1, th * P - 1);
  }
  function stool(g, x, y) {
    g.fillStyle = '#7a5530';
    g.beginPath();
    g.arc(x, y, 3.2, 0, Math.PI * 2);
    g.fill();
  }
  function hearth(g, b, tx, ty) {
    const x = (b.x + tx) * P, y = (b.y + ty) * P;
    g.fillStyle = '#6a6460';
    rr(g, x, y, P * 0.9, P * 0.55, 3);
    g.fill();
    g.fillStyle = '#2b2522';
    g.fillRect(x + 5, y + 4, P * 0.9 - 10, P * 0.55 - 7);
    g.fillStyle = '#e8792a';
    g.beginPath();
    g.arc(x + P * 0.45, y + P * 0.32, 4, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#ffd36b';
    g.beginPath();
    g.arc(x + P * 0.45, y + P * 0.32, 2, 0, Math.PI * 2);
    g.fill();
  }
  function barrel(g, x, y) {
    g.fillStyle = '#7a5530';
    g.beginPath();
    g.arc(x, y, 5, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = '#3e2a16';
    g.lineWidth = 1;
    g.beginPath();
    g.arc(x, y, 5, 0, Math.PI * 2);
    g.arc(x, y, 3, 0, Math.PI * 2);
    g.stroke();
  }
  function shelf(g, x, y, w, items) {
    g.fillStyle = '#5b3d22';
    g.fillRect(x, y, w, 6);
    const r = rnd(strHash(`${x},${y}`));
    for (let xx = x + 1; xx < x + w - 2; xx += 3) {
      g.fillStyle = items[Math.floor(r() * items.length)];
      g.fillRect(xx, y + 1, 2.4, 4);
    }
  }
  function rug(g, b, tx, ty, tw, th, col, border) {
    const x = (b.x + tx) * P, y = (b.y + ty) * P;
    g.fillStyle = col;
    g.fillRect(x, y, tw * P, th * P);
    g.strokeStyle = border;
    g.lineWidth = 2;
    g.strokeRect(x + 3, y + 3, tw * P - 6, th * P - 6);
  }

  function furnish(g, b) {
    const r = rnd(strHash(b.id + 'furn'));
    const X = (t) => (b.x + t) * P, Y = (t) => (b.y + t) * P;
    switch (b.type) {
      case 'home': {
        const blankets = ['#7a3b3b', '#3b5a7a', '#5a7a3b', '#7a6a3b', '#5b3b7a'];
        rug(g, b, 1.3, 1.1, 1.4, 1.1, '#7a4a3a', '#c9a24a');
        bed(g, b, 0.25, 0.3, blankets[Math.floor(r() * blankets.length)]);
        if (r() < 0.7) bed(g, b, 0.9, 0.3, blankets[Math.floor(r() * blankets.length)]);
        hearth(g, b, b.w - 1.15, 0.2);
        table(g, b, b.w - 1.4, 1.5, 0.9, 0.6);
        stool(g, X(b.w - 1.55), Y(1.8));
        stool(g, X(b.w - 0.35), Y(1.8));
        g.fillStyle = '#5b3d22';
        g.fillRect(X(0.3), Y(b.h - 0.65), P * 0.7, P * 0.35); // chest
        g.fillStyle = '#c9a24a';
        g.fillRect(X(0.62), Y(b.h - 0.55), 3, 3);
        break;
      }
      case 'farmhouse': {
        bed(g, b, 0.25, 0.3, '#6b5a3a');
        bed(g, b, 0.9, 0.3, '#5a4a3a');
        hearth(g, b, b.w - 1.15, 0.2);
        table(g, b, 1.6, 1.4, 1, 0.6);
        barrel(g, X(b.w - 0.4), Y(b.h - 0.45));
        barrel(g, X(b.w - 0.85), Y(b.h - 0.4));
        g.fillStyle = '#d0aa52';
        rr(g, X(0.25), Y(b.h - 0.85), P * 0.8, P * 0.6, 3);
        g.fill();
        break;
      }
      case 'palace': {
        g.fillStyle = '#7a1f2a'; // carpet runner
        g.fillRect(X(b.w / 2 - 0.6), Y(1.4), P * 1.2, Y(b.h) - Y(1.4));
        g.strokeStyle = '#e0b341';
        g.lineWidth = 1.5;
        g.strokeRect(X(b.w / 2 - 0.5), Y(1.5), P * 1.0, Y(b.h) - Y(1.5));
        g.fillStyle = '#9a8a72'; // dais
        g.fillRect(X(b.w / 2 - 1.6), Y(0.3), P * 3.2, P * 1.2);
        g.fillStyle = '#e0b341'; // throne
        rr(g, X(b.w / 2 - 0.45), Y(0.35), P * 0.9, P * 0.85, 4);
        g.fill();
        g.fillStyle = '#7a1f2a';
        g.fillRect(X(b.w / 2 - 0.3), Y(0.55), P * 0.6, P * 0.5);
        for (const px of [1.3, b.w - 1.3]) for (let py = 1.8; py < b.h - 0.5; py += 1.8) {
          g.fillStyle = 'rgba(0,0,0,0.25)';
          g.beginPath();
          g.arc(X(px) + 2, Y(py) + 3, P * 0.32, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = '#e9e3d6';
          g.beginPath();
          g.arc(X(px), Y(py), P * 0.32, 0, Math.PI * 2);
          g.fill();
          g.strokeStyle = '#b9b0a4';
          g.stroke();
        }
        for (const bx of [0.4, 2.3, b.w - 2.9, b.w - 1]) {
          g.fillStyle = '#6e2a7e'; // banners on the north wall
          g.fillRect(X(bx), Y(0.12), P * 0.5, P * 0.7);
          g.fillStyle = '#e0b341';
          g.beginPath();
          g.arc(X(bx + 0.25), Y(0.45), 3, 0, Math.PI * 2);
          g.fill();
        }
        table(g, b, 2.2, b.h - 2.2, 2.2, 0.7);
        break;
      }
      case 'manor': {
        rug(g, b, 1, 1.5, b.w - 2, 2.4, '#5a2f3e', '#c9a24a');
        bed(g, b, 0.3, 0.3, '#4a2f5a');
        g.fillStyle = '#4a3018'; // four-poster posts
        for (const [px, py] of [[0.3, 0.3], [0.85, 0.3], [0.3, 1.25], [0.85, 1.25]]) g.fillRect(X(px), Y(py), 3, 3);
        table(g, b, b.w - 2, 0.4, 1.4, 0.7);
        shelf(g, X(2), Y(0.15), P * 2, ['#7a3b3b', '#3b5a7a', '#5a7a3b', '#c9a24a']);
        hearth(g, b, b.w - 1.2, b.h - 0.8);
        break;
      }
      case 'barracks': {
        for (let i = 0; i < 4; i++) bed(g, b, 0.3 + i * 0.8, 0.3, '#5a5a4a');
        for (let i = 0; i < 4; i++) bed(g, b, 0.3 + i * 0.8, 1.4, '#5a5a4a');
        // weapon rack
        g.fillStyle = '#5b3d22';
        g.fillRect(X(0.3), Y(b.h - 0.5), P * 1.6, 4);
        g.strokeStyle = '#b8bcc4';
        g.lineWidth = 1.5;
        for (let k = 0; k < 6; k++) {
          g.beginPath();
          g.moveTo(X(0.4) + k * 8, Y(b.h - 0.5));
          g.lineTo(X(0.4) + k * 8, Y(b.h - 1.3));
          g.stroke();
        }
        // gaol cells with bars on the east side
        const cx = b.w - 3;
        g.fillStyle = 'rgba(0,0,0,0.25)';
        g.fillRect(X(cx), Y(0.2), P * 2.8, P * 2.2);
        g.strokeStyle = '#3a3a3a';
        g.lineWidth = 2;
        for (let k = 0; k <= 2; k++) {
          g.beginPath();
          g.moveTo(X(cx + k * 1.4), Y(0.2));
          g.lineTo(X(cx + k * 1.4), Y(2.4));
          g.stroke();
        }
        g.lineWidth = 1;
        for (let xx = X(cx); xx < X(cx + 2.8); xx += 4) {
          g.beginPath();
          g.moveTo(xx, Y(2.4));
          g.lineTo(xx, Y(2.4) + 2);
          g.stroke();
        }
        g.strokeStyle = '#8f939c';
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(X(cx), Y(2.4));
        g.lineTo(X(cx + 2.8), Y(2.4));
        g.stroke();
        // training dummy
        g.fillStyle = '#c9a77a';
        g.beginPath();
        g.arc(X(b.w / 2), Y(b.h - 1), 5, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#5b3d22';
        g.fillRect(X(b.w / 2) - 8, Y(b.h - 1) - 1, 16, 2);
        break;
      }
      case 'healer': {
        for (let i = 0; i < 3; i++) bed(g, b, 0.3 + i * 0.8, 0.3, '#e9e4d8');
        shelf(g, X(b.w - 2.2), Y(0.15), P * 2, ['#4f8a5e', '#7ab36a', '#b37a4a', '#c9c27a', '#7a4a8a']);
        table(g, b, b.w - 2, 1.6, 1.2, 0.6);
        g.fillStyle = '#9a9080'; // mortar
        g.beginPath();
        g.arc(X(b.w - 1.4), Y(1.9), 4, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = '#4f8a5e'; // drying herbs
        g.lineWidth = 2;
        for (let k = 0; k < 5; k++) {
          g.beginPath();
          g.moveTo(X(0.5) + k * 9, Y(b.h - 0.4));
          g.lineTo(X(0.5) + k * 9 + 3, Y(b.h - 0.8));
          g.stroke();
        }
        break;
      }
      case 'temple': {
        g.fillStyle = '#6b2a2a'; // aisle carpet
        g.fillRect(X(b.w / 2 - 0.45), Y(1.6), P * 0.9, Y(b.h) - Y(1.6));
        for (let row = 0; row < 3; row++) {
          for (const side of [-1, 1]) {
            const px = side < 0 ? 0.7 : b.w / 2 + 0.7;
            g.fillStyle = 'rgba(0,0,0,0.25)';
            g.fillRect(X(px) + 2, Y(2.4 + row * 1.3) + 3, P * (b.w / 2 - 1.4), P * 0.4);
            g.fillStyle = '#6e4a2a';
            g.fillRect(X(px), Y(2.4 + row * 1.3), P * (b.w / 2 - 1.4), P * 0.4);
            g.fillStyle = '#5b3d22';
            g.fillRect(X(px), Y(2.4 + row * 1.3) + P * 0.32, P * (b.w / 2 - 1.4), 3);
          }
        }
        // altar with candles and the flame
        g.fillStyle = '#e9e3d6';
        g.fillRect(X(b.w / 2 - 1.3), Y(0.4), P * 2.6, P * 0.8);
        g.fillStyle = '#c9a24a';
        g.fillRect(X(b.w / 2 - 1.3), Y(0.4) + P * 0.6, P * 2.6, 3);
        for (const cx of [-1, -0.6, 0.6, 1]) {
          g.fillStyle = '#f5f0e0';
          g.fillRect(X(b.w / 2 + cx) - 1.5, Y(0.55), 3, 7);
          g.fillStyle = '#ffd36b';
          g.beginPath();
          g.arc(X(b.w / 2 + cx), Y(0.5), 2, 0, Math.PI * 2);
          g.fill();
        }
        g.fillStyle = '#ffb648';
        g.beginPath();
        g.moveTo(X(b.w / 2), Y(0.3));
        g.quadraticCurveTo(X(b.w / 2) + 7, Y(0.75), X(b.w / 2), Y(1.05));
        g.quadraticCurveTo(X(b.w / 2) - 7, Y(0.75), X(b.w / 2), Y(0.3));
        g.fill();
        for (const px of [0.35, b.w - 0.35]) for (let py = 1.5; py < b.h - 0.5; py += 1.6) {
          g.fillStyle = '#c8c0ae';
          g.beginPath();
          g.arc(X(px), Y(py), P * 0.22, 0, Math.PI * 2);
          g.fill();
        }
        break;
      }
      case 'academy': {
        g.fillStyle = '#2f3a32'; // blackboard
        g.fillRect(X(b.w / 2 - 1.2), Y(0.12), P * 2.4, P * 0.35);
        g.strokeStyle = '#e9e3d6';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(X(b.w / 2 - 1), Y(0.25));
        g.lineTo(X(b.w / 2 - 0.2), Y(0.3));
        g.moveTo(X(b.w / 2), Y(0.22));
        g.lineTo(X(b.w / 2 + 0.8), Y(0.3));
        g.stroke();
        for (let row = 0; row < 2; row++) for (let col = 0; col < 3; col++) table(g, b, 1 + col * 1.9, 1.2 + row * 1.4, 0.9, 0.45);
        shelf(g, X(0.15), Y(0.2), P * 1.6, ['#7a3b3b', '#3b5a7a', '#5a7a3b', '#c9a24a', '#5b3b7a']);
        shelf(g, X(b.w - 1.8), Y(0.2), P * 1.6, ['#7a3b3b', '#3b5a7a', '#5a7a3b', '#c9a24a', '#5b3b7a']);
        g.fillStyle = '#3f6f9e'; // globe
        g.beginPath();
        g.arc(X(b.w - 0.6), Y(b.h - 0.6), 6, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#5f9a46';
        g.beginPath();
        g.arc(X(b.w - 0.5), Y(b.h - 0.7), 3, 0, Math.PI * 2);
        g.fill();
        break;
      }
      case 'tavern': {
        g.fillStyle = '#5b3d22'; // bar counter
        g.fillRect(X(0.3), Y(0.3), P * (b.w * 0.45), P * 0.45);
        g.fillStyle = '#7a5530';
        g.fillRect(X(0.3), Y(0.3), P * (b.w * 0.45), 4);
        for (let k = 0; k < 3; k++) barrel(g, X(0.5 + k * 0.5), Y(0.2) - 2);
        for (let k = 0; k < 3; k++) table(g, b, b.w * 0.55 + k * 1.2, 1.1 + (k % 2) * 0.9, 0.55, 0, true);
        hearth(g, b, b.w - 1.1, 0.15);
        break;
      }
      case 'market': {
        // stalls with striped awnings, crates and a well
        const cols = [['#b8442f', '#efe4cf'], ['#2f6fb8', '#efe4cf'], ['#3f8a4a', '#efe4cf'], ['#c99a2f', '#5b3d22']];
        let i = 0;
        for (let sx = 0.6; sx < b.w - 1.5; sx += 2.4) {
          for (const sy of [0.4, b.h - 1.6]) {
            const [a1, a2] = cols[i++ % cols.length];
            const x = X(sx), y = Y(sy), w = P * 1.7, h = P * 1.1;
            g.fillStyle = 'rgba(0,0,0,0.3)';
            g.fillRect(x + 3, y + 4, w, h);
            for (let k = 0; k < 6; k++) {
              g.fillStyle = k % 2 ? a2 : a1;
              g.fillRect(x + (k * w) / 6, y, w / 6 + 0.5, h * 0.6);
            }
            g.fillStyle = '#7a5530';
            g.fillRect(x, y + h * 0.6, w, h * 0.4);
            const r2 = rnd(strHash(b.id + sx + sy));
            for (let k = 0; k < 5; k++) {
              g.fillStyle = ['#d94b3a', '#f2c94c', '#7ab36a', '#e8913a', '#a77be0'][Math.floor(r2() * 5)];
              g.beginPath();
              g.arc(x + 5 + k * (w - 10) / 4, y + h * 0.8, 2.5, 0, Math.PI * 2);
              g.fill();
            }
          }
        }
        const wx = X(b.w / 2), wy = Y(b.h / 2);
        g.fillStyle = 'rgba(0,0,0,0.3)';
        g.beginPath();
        g.arc(wx + 3, wy + 4, P * 0.5, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#8a8478';
        g.beginPath();
        g.arc(wx, wy, P * 0.5, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#1f3a5a';
        g.beginPath();
        g.arc(wx, wy, P * 0.32, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#5b3d22';
        g.fillRect(wx - P * 0.55, wy - 2, P * 1.1, 4);
        for (let k = 0; k < 4; k++) {
          g.fillStyle = '#8a6440';
          g.fillRect(X(1 + k * 2.3), Y(b.h / 2 - 0.2), 8, 8);
          g.strokeStyle = '#5b3d22';
          g.strokeRect(X(1 + k * 2.3) + 0.5, Y(b.h / 2 - 0.2) + 0.5, 7, 7);
        }
        break;
      }
    }
  }

  // Walls with a door gap on the south side and windows on the long walls.
  function walls(g, b, col) {
    const x0 = b.x * P, y0 = b.y * P, w = b.w * P, h = b.h * P;
    const t = 5;
    const doorW = P * 0.9;
    const dx = x0 + w / 2 - doorW / 2;
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(x0 + 3, y0 + h, w, 4); // cast shadow
    g.fillRect(x0 + w, y0 + 3, 4, h);
    g.fillStyle = col;
    g.fillRect(x0, y0, w, t);
    g.fillRect(x0, y0, t, h);
    g.fillRect(x0 + w - t, y0, t, h);
    g.fillRect(x0, y0 + h - t, dx - x0, t);
    g.fillRect(dx + doorW, y0 + h - t, x0 + w - dx - doorW, t);
    g.strokeStyle = shade(col.startsWith('#') ? col : '#888888', -0.45);
    g.lineWidth = 1;
    g.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    g.strokeRect(x0 + t - 0.5, y0 + t - 0.5, w - 2 * t + 1, h - 2 * t + 1);
    // windows
    g.fillStyle = '#9cc4e4';
    for (let xx = x0 + P; xx < x0 + w - P * 0.8; xx += P * 1.6) g.fillRect(xx, y0 + 1, P * 0.45, t - 2);
    for (let yy = y0 + P * 0.9; yy < y0 + h - P * 0.6; yy += P * 1.4) {
      g.fillRect(x0 + 1, yy, t - 2, P * 0.4);
      g.fillRect(x0 + w - t + 1, yy, t - 2, P * 0.4);
    }
    // door
    g.fillStyle = '#5b3d22';
    g.fillRect(dx, y0 + h - 2, doorW, 3);
    g.fillStyle = '#7a6a5a'; // threshold step
    g.fillRect(dx, y0 + h + 1, doorW, 3);
  }

  Sc.buildInteriors = function () {
    const city = G.Data.city;
    const c = canvas(city.width * P, city.height * P);
    const g = c.getContext('2d');
    for (const b of city.buildings) {
      const st = STYLE[b.type];
      floor(g, b, st.floor);
      furnish(g, b);
      if (st.wall) walls(g, b, st.wall);
      else {
        g.strokeStyle = 'rgba(0,0,0,0.25)';
        g.lineWidth = 2;
        g.strokeRect(b.x * P + 1, b.y * P + 1, b.w * P - 2, b.h * P - 2);
      }
    }
    return c;
  };

  // ---------- roofs ----------
  const OVER = 0.22; // roof overhang in tiles
  Sc.roofRect = (b) => ({ x: b.x - OVER, y: b.y - OVER - (b.type === 'temple' ? 0 : 0), w: b.w + OVER * 2, h: b.h + OVER * 2 });

  function hipRoof(g, x, y, w, h, col, kind, seed) {
    const horiz = w >= h;
    const inset = (horiz ? h : w) / 2;
    const faces = horiz
      ? [ // north, south, west, east
          [[x, y], [x + w, y], [x + w - inset, y + inset], [x + inset, y + inset], 0.18],
          [[x, y + h], [x + w, y + h], [x + w - inset, y + inset], [x + inset, y + inset], -0.22],
          [[x, y], [x, y + h], [x + inset, y + inset], -0.05],
          [[x + w, y], [x + w, y + h], [x + w - inset, y + inset], -0.12],
        ]
      : [
          [[x, y], [x, y + h], [x + inset, y + h - inset], [x + inset, y + inset], 0.12],
          [[x + w, y], [x + w, y + h], [x + w - inset, y + h - inset], [x + w - inset, y + inset], -0.2],
          [[x, y], [x + w, y], [x + inset, y + inset], 0.2],
          [[x, y + h], [x + w, y + h], [x + inset, y + h - inset], -0.25],
        ];
    const r = rnd(seed);
    for (const f of faces) {
      const pts = f.slice(0, -1);
      const light = f[f.length - 1];
      g.beginPath();
      pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
      g.closePath();
      g.fillStyle = shade(col, light);
      g.fill();
      // shingle / thatch texture clipped to the face
      g.save();
      g.clip();
      if (kind === 'thatch') {
        for (let k = 0; k < (w * h) / 6; k++) {
          g.strokeStyle = r() < 0.5 ? 'rgba(90,60,20,0.35)' : 'rgba(255,230,160,0.25)';
          const sx = x + r() * w, sy = y + r() * h;
          g.beginPath();
          g.moveTo(sx, sy);
          g.lineTo(sx + (r() - 0.5) * 3, sy + 5);
          g.stroke();
        }
      } else {
        const step = kind === 'slate' ? 5 : 6;
        g.strokeStyle = 'rgba(0,0,0,0.22)';
        g.lineWidth = 1;
        for (let yy = y; yy < y + h; yy += step) {
          g.beginPath();
          g.moveTo(x, yy);
          g.lineTo(x + w, yy);
          g.stroke();
          for (let xx = x + ((yy - y) / step % 2) * 4; xx < x + w; xx += 8) {
            g.beginPath();
            g.moveTo(xx, yy);
            g.lineTo(xx, yy + step);
            g.stroke();
          }
        }
        for (let k = 0; k < (w * h) / 120; k++) {
          g.fillStyle = `rgba(${r() < 0.5 ? '0,0,0' : '255,255,255'},${0.06 + r() * 0.06})`;
          g.fillRect(x + r() * w, y + r() * h, 7, step - 1);
        }
      }
      g.restore();
    }
    // ridges
    g.strokeStyle = shade(col, -0.4);
    g.lineWidth = 2;
    g.beginPath();
    if (horiz) {
      g.moveTo(x + inset, y + inset);
      g.lineTo(x + w - inset, y + inset);
      g.moveTo(x, y);
      g.lineTo(x + inset, y + inset);
      g.lineTo(x, y + h);
      g.moveTo(x + w, y);
      g.lineTo(x + w - inset, y + inset);
      g.lineTo(x + w, y + h);
    } else {
      g.moveTo(x + inset, y + inset);
      g.lineTo(x + inset, y + h - inset);
      g.moveTo(x, y);
      g.lineTo(x + inset, y + inset);
      g.lineTo(x + w, y);
      g.moveTo(x, y + h);
      g.lineTo(x + inset, y + h - inset);
      g.lineTo(x + w, y + h);
    }
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.5)';
    g.lineWidth = 1;
    g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function chimney(g, x, y) {
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(x + 3, y + 3, 9, 9);
    g.fillStyle = '#7a6a60';
    g.fillRect(x, y, 9, 9);
    g.fillStyle = '#2b2522';
    g.fillRect(x + 2, y + 2, 5, 5);
  }
  function tower(g, cx, cy, rad, wallCol, roofCol) {
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath();
    g.arc(cx + 4, cy + 5, rad, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = wallCol;
    g.beginPath();
    g.arc(cx, cy, rad, 0, Math.PI * 2);
    g.fill();
    const grad = g.createRadialGradient(cx - rad * 0.3, cy - rad * 0.3, 1, cx, cy, rad * 0.9);
    grad.addColorStop(0, shade(roofCol, 0.35));
    grad.addColorStop(1, shade(roofCol, -0.3));
    g.fillStyle = grad;
    g.beginPath();
    g.arc(cx, cy, rad * 0.85, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#e0b341';
    g.beginPath();
    g.arc(cx, cy, 2, 0, Math.PI * 2);
    g.fill();
  }
  function flag(g, x, y, col) {
    g.fillStyle = '#3a3128';
    g.fillRect(x, y - 16, 2, 16);
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(x + 2, y - 16);
    g.lineTo(x + 14, y - 12);
    g.lineTo(x + 2, y - 8);
    g.closePath();
    g.fill();
  }

  // Roofs are drawn per building into one sheet; the Local View blits each building's rect with its own alpha.
  Sc.chimneys = [];
  Sc.buildRoofs = function () {
    const city = G.Data.city;
    const c = canvas(city.width * P, city.height * P);
    const g = c.getContext('2d');
    Sc.chimneys = [];
    for (const b of city.buildings) {
      const st = STYLE[b.type];
      if (b.type === 'market') continue;
      const R = Sc.roofRect(b);
      const x = R.x * P, y = R.y * P, w = R.w * P, h = R.h * P;
      const col = Sc.roofColor(b);
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.fillRect(x + 5, y + 6, w, h);
      if (st.roofKind === 'flat') {
        g.fillStyle = col;
        g.fillRect(x, y, w, h);
        const r = rnd(strHash(b.id));
        for (let k = 0; k < 60; k++) {
          g.fillStyle = `rgba(0,0,0,${r() * 0.12})`;
          g.fillRect(x + r() * w, y + r() * h, 6, 6);
        }
        // crenellations
        g.fillStyle = shade(col, 0.2);
        for (let xx = x; xx < x + w - 4; xx += 9) {
          g.fillRect(xx, y, 6, 6);
          g.fillRect(xx, y + h - 6, 6, 6);
        }
        for (let yy = y; yy < y + h - 4; yy += 9) {
          g.fillRect(x, yy, 6, 6);
          g.fillRect(x + w - 6, yy, 6, 6);
        }
        g.strokeStyle = 'rgba(0,0,0,0.5)';
        g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
        tower(g, x + 10, y + 10, 13, '#8a8478', '#6f6a60');
        flag(g, x + w / 2, y + h / 2, '#8f2b2b');
        continue;
      }
      hipRoof(g, x, y, w, h, col, st.roofKind, strHash(b.id + 'roof'));
      if (b.type === 'home' || b.type === 'farmhouse' || b.type === 'tavern' || b.type === 'manor' || b.type === 'healer') {
        const cx = x + w * (strHash(b.id) % 2 ? 0.22 : 0.7), cy = y + h * 0.25;
        chimney(g, cx, cy);
        Sc.chimneys.push({ x: (cx + 4.5) / P, y: (cy + 4.5) / P, id: b.id });
      }
      if (b.type === 'palace') {
        for (const [tx, ty] of [[x + 6, y + 6], [x + w - 6, y + 6], [x + 6, y + h - 6], [x + w - 6, y + h - 6]]) tower(g, tx, ty, 16, '#cfc6b4', '#3f4766');
        flag(g, x + w / 2, y + h * 0.5, '#6e2a7e');
      }
      if (b.type === 'temple') {
        // bell tower with spire at the south front
        const tx = x + w / 2, ty = y + h - P * 0.9;
        g.fillStyle = 'rgba(0,0,0,0.35)';
        g.fillRect(tx - P * 0.7 + 5, ty - P * 0.7 + 6, P * 1.4, P * 1.4);
        g.fillStyle = '#d8d0bc';
        g.fillRect(tx - P * 0.7, ty - P * 0.7, P * 1.4, P * 1.4);
        g.beginPath();
        g.moveTo(tx - P * 0.6, ty - P * 0.6);
        g.lineTo(tx + P * 0.6, ty - P * 0.6);
        g.lineTo(tx, ty);
        g.closePath();
        g.fillStyle = '#7d8187';
        g.fill();
        g.beginPath();
        g.moveTo(tx - P * 0.6, ty + P * 0.6);
        g.lineTo(tx + P * 0.6, ty + P * 0.6);
        g.lineTo(tx, ty);
        g.closePath();
        g.fillStyle = '#55595f';
        g.fill();
        g.beginPath();
        g.moveTo(tx - P * 0.6, ty - P * 0.6);
        g.lineTo(tx - P * 0.6, ty + P * 0.6);
        g.lineTo(tx, ty);
        g.closePath();
        g.fillStyle = '#686c72';
        g.fill();
        g.beginPath();
        g.moveTo(tx + P * 0.6, ty - P * 0.6);
        g.lineTo(tx + P * 0.6, ty + P * 0.6);
        g.lineTo(tx, ty);
        g.closePath();
        g.fillStyle = '#5e6268';
        g.fill();
        g.fillStyle = '#e0b341';
        g.beginPath();
        g.arc(tx, ty, 3.5, 0, Math.PI * 2);
        g.fill();
        // rose window on the nave
        g.fillStyle = '#c9a24a';
        g.beginPath();
        g.arc(x + w / 2, y + P * 1.2, 7, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#7a3b8a';
        g.beginPath();
        g.arc(x + w / 2, y + P * 1.2, 4, 0, Math.PI * 2);
        g.fill();
      }
      if (b.type === 'academy') {
        const cx = x + w / 2, cy = y + h / 2;
        const grad = g.createRadialGradient(cx - 5, cy - 5, 1, cx, cy, P * 0.75);
        grad.addColorStop(0, '#9fb3c8');
        grad.addColorStop(1, '#3d4c5e');
        g.fillStyle = grad;
        g.beginPath();
        g.arc(cx, cy, P * 0.75, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = 'rgba(0,0,0,0.4)';
        g.stroke();
      }
      if (b.type === 'tavern') {
        // hanging sign over the door
        g.fillStyle = '#5b3d22';
        g.fillRect(b.x * P + b.w * P / 2 + P * 0.6, (b.y + b.h) * P - 2, 14, 10);
        g.fillStyle = '#c47a3a';
        g.beginPath();
        g.arc(b.x * P + b.w * P / 2 + P * 0.6 + 7, (b.y + b.h) * P + 3, 3, 0, Math.PI * 2);
        g.fill();
      }
    }
    return c;
  };

  // Street lamps along town roads (lit at night).
  Sc.lamps = function () {
    const city = G.Data.city;
    const out = [];
    for (const rd of city.roads) {
      if (rd.x1 > 37) continue;
      const horiz = rd.x1 - rd.x0 >= rd.y1 - rd.y0;
      if (horiz) for (let x = rd.x0 + 3; x <= rd.x1; x += 6) out.push({ x: x + 0.5, y: rd.y0 - 0.15 });
      else for (let y = rd.y0 + 3; y <= rd.y1; y += 6) out.push({ x: rd.x0 - 0.15, y: y + 0.5 });
    }
    return out;
  };

  Sc.drawLampPosts = function (ctx, lamps, sx, sy, ts) {
    for (const l of lamps) {
      const x = sx(l.x), y = sy(l.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(x - 1, y + 1, ts * 0.12, ts * 0.12);
      ctx.fillStyle = '#2b2522';
      ctx.fillRect(x - ts * 0.05, y - ts * 0.05, ts * 0.1, ts * 0.1);
      ctx.fillStyle = '#e8c870';
      ctx.fillRect(x - ts * 0.03, y - ts * 0.03, ts * 0.06, ts * 0.06);
    }
  };

  // Additive warm light at night: lamps, lit windows, hearths.
  Sc.drawLights = function (ctx, world, lamps, sx, sy, ts, alpha, now) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, rad, a, col) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, `rgba(${col},${a})`);
      g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
    };
    const flick = 0.9 + Math.sin(now / 130) * 0.05 + Math.sin(now / 57) * 0.05;
    for (const l of lamps) glow(sx(l.x), sy(l.y), ts * 2.4, 0.45 * alpha * flick, '255,190,100');
    for (const b of world.buildings) {
      if (b.type === 'market') continue;
      const lit = b.type !== 'home' || S_occupied(world, b.id);
      if (!lit) continue;
      glow(sx(b.x + b.w / 2), sy(b.y + b.h), ts * 1.6, 0.35 * alpha * flick, '255,180,90');
      if (b.type === 'temple') glow(sx(b.x + b.w / 2), sy(b.y + 1), ts * 3, 0.4 * alpha * flick, '255,210,140');
    }
    ctx.restore();
  };
  function S_occupied(world, id) {
    for (const k in world.chars) {
      const c = world.chars[k];
      if (c.alive && c.homeId === id && c.at === id) return true;
    }
    return false;
  }

  // Animated touches: river shimmer, chimney smoke, rain.
  Sc.drawRiverShimmer = function (ctx, sx, sy, ts, now, H) {
    const city = G.Data.city;
    ctx.strokeStyle = 'rgba(220,235,255,0.22)';
    ctx.lineWidth = Math.max(1, ts * 0.04);
    const flow = (now / 900) % 1;
    for (let i = 0; i < city.height * 1.2; i++) {
      const yy = ((i + flow) / 1.2) % city.height;

// Local View: the explorable city rendered on a 2D canvas.
// Layers: terrain -> interiors -> flood -> people -> roofs (smart cutaway) -> overlays -> night & weather -> markers.
(function (G) {
  'use strict';
  const UI = G.UI;
  const S = G.Sim;
  const U = G.Util;
  const L = (UI.Local = {});
  const BASE = 24; // pixels per tile at zoom 1
  L.roofAlpha = {};
  L.CUTAWAY_ZOOM = 1.7;

  function layers() {
    if (!L.terrain) {
      const Sc = UI.Scenery;
      L.terrain = Sc.buildTerrain();
      L.interiors = Sc.buildInteriors();
      L.roofs = Sc.buildRoofs();
      L.lamps = Sc.lamps();
    }
  }

  // Thumbnail of a building (roof and cutaway side by side) for the inspector.
  const thumbs = {};
  L.buildingThumb = function (b) {
    if (thumbs[b.id]) return thumbs[b.id];
    layers();
    const P = UI.Scenery.P;
    const R = UI.Scenery.roofRect(b);
    const pad = 0.5;
    const sw = (R.w + pad * 2) * P, sh = (R.h + pad * 2) * P;
    const scale = Math.min(1, 150 / sw, 110 / sh);
    const c = document.createElement('canvas');
    c.width = Math.round(sw * scale * 2 + 8);
    c.height = Math.round(sh * scale);
    const g = c.getContext('2d');
    const src = [(R.x - pad) * P, (R.y - pad) * P, sw, sh];
    g.drawImage(L.terrain, ...src, 0, 0, sw * scale, sh * scale);
    g.drawImage(L.roofs, ...src, 0, 0, sw * scale, sh * scale);
    g.drawImage(L.terrain, ...src, sw * scale + 8, 0, sw * scale, sh * scale);
    g.drawImage(L.interiors, ...src, sw * scale + 8, 0, sw * scale, sh * scale);
    thumbs[b.id] = c.toDataURL();
    return thumbs[b.id];
  };

  L.metrics = function (canvasW, canvasH) {
    const st = UI.state;
    const ts = BASE * st.camera.zoom;
    const ox = canvasW / 2 - st.camera.x * ts;
    const oy = canvasH / 2 - st.camera.y * ts;
    return { ts, ox, oy };
  };
  L.toTile = function (sx, sy, canvasW, canvasH) {
    const m = L.metrics(canvasW, canvasH);
    return { x: (sx - m.ox) / m.ts, y: (sy - m.oy) / m.ts };
  };

  L.hitTest = function (world, tx, ty) {
    let best = null;
    let bd = 0.75;
    for (const c of S.living(world)) {
      const d = Math.min(U.dist(c.x, c.y, tx, ty), U.dist(c.x, c.y - 0.45, tx, ty));
      if (d < bd) {
        bd = d;
        best = c;
      }
    }
    if (best) return { kind: 'character', id: best.id };
    const b = S.buildingAt(world, tx, ty);
    if (b) return { kind: 'building', id: b.id };

  function nightAlpha(world) {
    const m = G.Time.minuteOfDay(world) / 60;
    if (m >= 7 && m <= 18) return 0;

    if (m >= 21 || m < 5) return 0.5;
    return ((7 - m) / 2) * 0.5;
  }

  // Which roofs are lifted: zoomed in, cutaway mode, or the building holds what you are looking at.
  function updateRoofs(world, pos) {
    const st = UI.state;
    const sel = st.selected;
    const focus = new Set();
    const at = (x, y) => {
      const b = S.buildingAt(world, x, y);
      if (b) focus.add(b.id);

    at(pos.x, pos.y);
    if (sel && sel.kind === 'building') focus.add(sel.id);
    if (sel && sel.kind === 'character') {
      const c = S.char(world, sel.id);
      if (c && c.alive) at(c.x, c.y);
    }
    if (st.hover && st.hover.kind === 'building') focus.add(st.hover.id);
    const cut = st.roofMode === 'cutaway' || st.camera.zoom >= L.CUTAWAY_ZOOM;
    for (const b of world.buildings) {
      const target = b.type === 'market' || cut || focus.has(b.id) ? 0 : 1;

    const sx = (x) => ox + x * ts;
    const sy = (y) => oy + y * ts;

    ctx.fillStyle = '#070b16';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(L.terrain, ox, oy, city.width * ts, city.height * ts);
    UI.Scenery.drawRiverShimmer(ctx, sx, sy, ts, now, H);
    ctx.drawImage(L.interiors, ox, oy, city.width * ts, city.height * ts);

    // Flood water (rises over floors; roofs stay above it)
    if (world.flood.level > 0) {
      const zone = world.flood.diverted ? city.northFields : city.floodplain;
      const wave = Math.sin(now / 500) * 0.05;
      ctx.fillStyle = `rgba(78,110,140,${0.68 + wave})`;
      for (let y = zone.y0; y <= zone.y1; y++) {
        for (let x = zone.x0; x <= zone.x1; x++) {

      }

      ctx.lineWidth = 1;
      for (let i = 0; i < 90; i++) {
        const fx = zone.x0 + ((i * 7.31) % (zone.x1 - zone.x0 + 1));
        const fy = zone.y0 + ((i * 3.77 + now / 2600) % (zone.y1 - zone.y0 + 1));

        ctx.stroke();

      ctx.strokeStyle = 'rgba(120,170,255,0.5)';
      ctx.setLineDash([6, 6]);

      } else if (c.asleep && !covered) {
        ctx.fillStyle = '#9fb3d9';
        ctx.fillText('z', x + r, y - top - ((now / 600) % 1) * 6);

        ctx.fillText('★', x - r - 4, y - top);

      if (c.gift && c.known.beliefs) {

        ctx.fillStyle = 'rgba(10,14,28,0.7)';
        ctx.fillRect(x - tw / 2 - 3, ly - fsz + 1, tw + 6, fsz + 3);

        ctx.fillText(c.first, x, ly);

    if (ts >= 16) {

      for (const b of world.buildings) {
        if (b.type === 'home' || b.type === 'farmhouse') continue;
        const x = sx(b.x + b.w / 2), y = sy(b.y + b.h) + Math.min(16, ts * 0.6);

        ctx.fillStyle = 'rgba(20,16,10,0.72)';
        ctx.fillRect(x - tw / 2 - 6, y - 12, tw + 12, 17);

        ctx.strokeRect(x - tw / 2 - 5.5, y - 11.5, tw + 11, 16);
        ctx.fillStyle = '#f3e7c4';
        ctx.fillText(b.name, x, y + 1);

      ctx.strokeStyle = '#e0b34188';
      ctx.beginPath();
      ctx.arc(sx(st.moveTarget.x), sy(st.moveTarget.y), 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.textAlign = 'left';
  };

// World View: a stylised map of Velmora and its neighbours with data overlays.
(function (G) {
  'use strict';
  const UI = G.UI;
  const S = G.Sim;
  const U = G.Util;

    highmarch: [[330, 40], [560, 50], [690, 110], [680, 220], [560, 250], [420, 240], [330, 210], [360, 120]],
    crownlands: [[250, 270], [330, 210], [420, 240], [520, 250], [530, 330], [500, 420], [400, 450], [300, 420], [240, 350]],
    riverlands: [[520, 250], [560, 250], [680, 220], [700, 320], [670, 440], [590, 470], [500, 420], [530, 330]],
    saltcoast: [[300, 420], [400, 450], [500, 420], [590, 470], [560, 560], [430, 590], [320, 560], [270, 480]],
    kesh: [[690, 110], [880, 90], [960, 220], [940, 420], [860, 560], [700, 580], [590, 470], [670, 440], [700, 320], [680, 220]],
  };
  M.labels = {
    ostmark: [180, 225], highmarch: [575, 215], crownlands: [330, 400], riverlands: [632, 292], saltcoast: [385, 505], kesh: [830, 385],
  };
  M.capital = [410, 330];
  M.river = [[600, 70], [610, 150], [590, 240], [600, 320], [585, 400], [560, 470], [540, 600]];

  function pointIn(poly, x, y) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i];
      const [xj, yj] = poly[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  M.transform = function (W, H) {
    const s = Math.min(W / 1000, H / 650) * 0.96;
    return { s, ox: (W - 1000 * s) / 2, oy: (H - 650 * s) / 2 };
  };

  M.hitTest = function (world, sx, sy, W, H) {
    const t = M.transform(W, H);
    const x = (sx - t.ox) / t.s;
    const y = (sy - t.oy) / t.s;
    if (U.dist(x, y, M.capital[0], M.capital[1]) < 16) return { kind: 'capital' };
    for (const id in M.shapes) {
      if (pointIn(M.shapes[id], x, y)) {
        if (id === 'kesh' || id === 'ostmark') return { kind: 'neighbor', id };
        return { kind: 'province', id };
      }
    }
    return null;
  };

  M.overlays = {
    belief: { name: 'Faith', desc: 'Average belief' },
    stability: { name: 'Unrest', desc: 'Provincial unrest' },
    economy: { name: 'Economy', desc: 'Provincial prosperity' },
    government: { name: 'Government', desc: 'Regime type' },
    exposure: { name: 'Divine exposure', desc: 'How openly your hand has been seen' },
    reputation: { name: 'Reputation', desc: 'How communities see you' },
  };

  const GOV_COLORS = { monarchy: '#a2803a', constitutional: '#b3a24c', democracy: '#3f8fb8', republic: '#4b6a8a', dictatorship: '#8a4b3a', theocracy: '#d8c27a', revolutionary: '#b84b6a' };
  const REP_COLORS = { 'Compassionate Protector': '#e0b341', 'Wrathful Judge': '#c0504d', Coincidence: '#7f8aa3', Deception: '#7c5ea8', 'No opinion yet': '#3a4560' };

  function provinceColor(world, id, overlay) {
    const p = S.province(world, id);
    const c = world.country;
    if (!p) return '#333';
    if (overlay === 'belief') return heat(p.belief, [70, 80, 110], [240, 196, 80]);
    if (overlay === 'stability') return heat(p.unrest, [60, 120, 90], [200, 70, 60]);
    if (overlay === 'economy') return heat(p.economy, [110, 70, 60], [90, 170, 100]);
    if (overlay === 'government') return GOV_COLORS[c.government];
    if (overlay === 'exposure') return heat(c.exposure * (p.local || id === 'riverlands' ? 1 : 0.6), [50, 60, 90], [255, 240, 200]);
    if (overlay === 'reputation') return REP_COLORS[S.reputationLabel(world, id)] || '#3a4560';
    return '#555';
  }
  function heat(v, a, b) {
    const t = U.clamp(v / 100, 0, 1);
    return `rgb(${Math.round(U.lerp(a[0], b[0], t))},${Math.round(U.lerp(a[1], b[1], t))},${Math.round(U.lerp(a[2], b[2], t))})`;
  }

  // ---------- static painted terrain (built once at 2x map resolution) ----------
  M.towns = [
    { name: 'Thornhaven', x: 410, y: 330, capital: true, prov: 'crownlands' },
    { name: 'Riverford', x: 612, y: 395, prov: 'riverlands' },
    { name: 'Highwatch', x: 470, y: 150, prov: 'highmarch' },
    { name: 'Saltport', x: 455, y: 560, prov: 'saltcoast', port: true },
    { name: 'Greywell', x: 320, y: 300, prov: 'crownlands' },
    { name: 'Karsa', x: 830, y: 280, foreign: true },
    { name: 'Ostburg', x: 170, y: 140, foreign: true },
  ];
  M.roads = [['Thornhaven', 'Riverford'], ['Thornhaven', 'Highwatch'], ['Thornhaven', 'Saltport'], ['Thornhaven', 'Greywell'], ['Greywell', 'Ostburg'], ['Riverford', 'Karsa'], ['Highwatch', 'Karsa']];

  function seeded(seed) {
    let t = seed >>> 0;
    return () => {
      t = (t + 0x6d2b79f5) >>> 0;
      let r = Math.imul(t ^ (t >>> 15), t | 1);
      r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function polyPath(g, poly) {
    g.beginPath();
    poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath();
  }
  function inLand(x, y) {
    for (const id in M.shapes) if (pointIn(M.shapes[id], x, y)) return id;
    return null;
  }
  function mountain(g, x, y, s) {
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.beginPath();
    g.moveTo(x - s, y + 2);
    g.lineTo(x + s * 1.3, y + 2);
    g.lineTo(x + s * 0.2, y - s * 1.1);
    g.closePath();
    g.fill();
    g.fillStyle = '#8a7f6e';
    g.beginPath();
    g.moveTo(x - s, y);
    g.lineTo(x + s, y);
    g.lineTo(x, y - s * 1.3);
    g.closePath();
    g.fill();
    g.fillStyle = '#6b6254';
    g.beginPath();
    g.moveTo(x, y - s * 1.3);
    g.lineTo(x + s, y);
    g.lineTo(x + s * 0.15, y);
    g.closePath();
    g.fill();
    g.fillStyle = '#f2efe8';
    g.beginPath();
    g.moveTo(x, y - s * 1.3);
    g.lineTo(x - s * 0.32, y - s * 0.88);
    g.lineTo(x + s * 0.05, y - s * 0.95);
    g.lineTo(x + s * 0.3, y - s * 0.85);
    g.closePath();
    g.fill();
  }
  function forestTree(g, x, y, s, dark) {
    g.fillStyle = 'rgba(0,0,0,0.2)';
    g.beginPath();
    g.ellipse(x + 1.5, y + 1.5, s, s * 0.6, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = dark ? '#2f5530' : '#3e6b38';
    g.beginPath();
    g.arc(x, y - s * 0.4, s, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = 'rgba(160,200,120,0.35)';
    g.beginPath();
    g.arc(x - s * 0.3, y - s * 0.7, s * 0.4, 0, Math.PI * 2);
    g.fill();
  }

  M.buildBase = function () {
    const K = 2;
    const c = document.createElement('canvas');
    c.width = 1000 * K;
    c.height = 650 * K;
    const g = c.getContext('2d');
    g.scale(K, K);
    // Sea with depth gradient
    const sea = g.createRadialGradient(500, 330, 100, 500, 330, 650);
    sea.addColorStop(0, '#1d4a6e');
    sea.addColorStop(1, '#0b2236');
    g.fillStyle = sea;
    g.fillRect(0, 0, 1000, 650);
    const r = seeded(4242);
    g.strokeStyle = 'rgba(255,255,255,0.05)';
    g.lineWidth = 1;
    for (let k = 0; k < 260; k++) {
      const x = r() * 1000, y = r() * 650;
      if (inLand(x, y)) continue;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + 5, y - 3, x + 10, y);
      g.stroke();
    }
    // Shallows around the coast
    for (const [w, a] of [[26, 0.08], [16, 0.12], [8, 0.18]]) {
      g.strokeStyle = `rgba(120,190,210,${a})`;
      g.lineWidth = w;
      g.lineJoin = 'round';
      for (const id in M.shapes) {
        polyPath(g, M.shapes[id]);
        g.stroke();
      }
    }
    // Land: painted terrain clipped to the continent
    for (const id in M.shapes) {
      g.save();
      polyPath(g, M.shapes[id]);
      g.clip();
      const base = { highmarch: '#7d8a5a', ostmark: '#7a8a5e', kesh: '#97845a', saltcoast: '#9aa267', crownlands: '#8aa060', riverlands: '#7fa05a' }[id];
      g.fillStyle = base;
      g.fillRect(0, 0, 1000, 650);
      const rr = seeded(id.length * 977 + id.charCodeAt(0));
      for (let k = 0; k < 900; k++) {
        g.fillStyle = `rgba(${rr() < 0.5 ? '40,60,20' : '230,230,170'},${0.04 + rr() * 0.06})`;
        g.beginPath();
        g.arc(rr() * 1000, rr() * 650, 3 + rr() * 9, 0, Math.PI * 2);
        g.fill();
      }
      g.restore();
    }
    // Beaches
    g.strokeStyle = 'rgba(230,215,160,0.55)';
    g.lineWidth = 2.5;
    for (const id in M.shapes) {
      polyPath(g, M.shapes[id]);
      g.stroke();
    }
    // Mountains: the Highmarch ridge, Ostmark hills, the Kesh range
    const ranges = [
      { x0: 360, x1: 670, y0: 70, y1: 150, n: 34, s: [9, 15] },
      { x0: 80, x1: 300, y0: 70, y1: 140, n: 18, s: [7, 11] },
      { x0: 720, x1: 930, y0: 120, y1: 260, n: 30, s: [9, 15] },
      { x0: 700, x1: 860, y0: 430, y1: 540, n: 10, s: [6, 9] },
    ];
    const mts = [];
    for (const rg of ranges) {
      const rr = seeded(rg.x0 * 31 + rg.y0);
      for (let k = 0; k < rg.n * 3 && mts.length < 400; k++) {
        const x = rg.x0 + rr() * (rg.x1 - rg.x0), y = rg.y0 + rr() * (rg.y1 - rg.y0);
        if (!inLand(x, y - 4) || !inLand(x - 12, y) || !inLand(x + 12, y)) continue;
        if (mts.filter((m) => m.rg === rg).length >= rg.n) break;
        mts.push({ x, y, s: rg.s[0] + rr() * (rg.s[1] - rg.s[0]), rg });
      }
    }
    // Forests in the lowlands
    const fr = seeded(99);
    const trees = [];
    const clusters = [[300, 380], [230, 330], [500, 470], [640, 470], [820, 470], [120, 230], [560, 210], [880, 360], [380, 520]];
    for (const [cx, cy] of clusters) {
      for (let k = 0; k < 40; k++) {
        const a = fr() * Math.PI * 2, d = Math.sqrt(fr()) * 38;
        const x = cx + Math.cos(a) * d * 1.3, y = cy + Math.sin(a) * d;
        if (!inLand(x, y) || !inLand(x + 8, y + 8)) continue;
        if (M.towns.some((t) => Math.hypot(t.x - x, t.y - y) < 22)) continue;
        trees.push({ x, y, s: 3 + fr() * 2.5, dark: fr() < 0.4 });
      }
    }
    const items = mts.map((m) => ({ y: m.y, draw: () => mountain(g, m.x, m.y, m.s) })).concat(trees.map((t) => ({ y: t.y, draw: () => forestTree(g, t.x, t.y, t.s, t.dark) })));
    items.sort((a, b) => a.y - b.y).forEach((it) => it.draw());
    // Roads
    g.strokeStyle = 'rgba(110,80,45,0.7)';
    g.lineWidth = 2;
    g.setLineDash([6, 4]);
    for (const [a, b] of M.roads) {
      const ta = M.towns.find((t) => t.name === a), tb = M.towns.find((t) => t.name === b);
      g.beginPath();
      g.moveTo(ta.x, ta.y);
      g.quadraticCurveTo((ta.x + tb.x) / 2 + (ta.y - tb.y) * 0.1, (ta.y + tb.y) / 2 + (tb.x - ta.x) * 0.1, tb.x, tb.y);
      g.stroke();
    }
    g.setLineDash([]);
    // River with tributary
    for (const [w, col] of [[6, '#2e5f94'], [3.5, '#5d97d0']]) {
      g.strokeStyle = col;
      g.lineWidth = w;
      g.lineCap = 'round';
      g.beginPath();
      M.river.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.stroke();
      g.lineWidth = w * 0.6;
      g.beginPath();
      g.moveTo(700, 300);
      g.quadraticCurveTo(650, 330, 598, 335);
      g.stroke();
    }
    // Compass rose
    const cx = 935, cy = 585;
    g.fillStyle = 'rgba(240,230,200,0.85)';
    for (let k = 0; k < 4; k++) {
      g.save();
      g.translate(cx, cy);
      g.rotate((k * Math.PI) / 2);
      g.beginPath();
      g.moveTo(0, -30);
      g.lineTo(6, 0);
      g.lineTo(-6, 0);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.strokeStyle = 'rgba(240,230,200,0.6)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.arc(cx, cy, 18, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = '#f2e7c4';
    g.font = 'bold 12px serif';
    g.textAlign = 'center';
    g.fillText('N', cx, cy - 34);
    g.font = 'italic 14px serif';
    g.fillStyle = 'rgba(220,235,255,0.5)';
    g.fillText('The Western Sea', 90, 460);
    g.fillText('The Saltwater Gulf', 700, 620);
    return c;
  };

  M.render = function (ctx, W, H, world, now) {
    const st = UI.state;
    const t = M.transform(W, H);
    if (!M.base) M.base = M.buildBase();
    ctx.fillStyle = '#0b2236';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(t.ox, t.oy);
    ctx.scale(t.s, t.s);

      g.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.beginPath();
      ctx.ellipse(x, y, 120, 55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const sel = st.selected;
    // Overlay tint on Velmora's provinces; neighbours are shaded by stance
    for (const id in M.shapes) {
      const poly = M.shapes[id];
      polyPath(ctx, poly);
      const isNeighbor = id === 'kesh' || id === 'ostmark';
      if (isNeighbor) {
        const n = S.neighbor(world, id);
        ctx.globalAlpha = 0.38;
        ctx.fillStyle = st.overlay === 'government' ? GOV_COLORS[n.government] : world.war && world.war.enemy === id ? '#7a1f1f' : '#20283a';
      } else {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = provinceColor(world, id, st.overlay);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = isNeighbor ? 1.5 : 2;
      ctx.strokeStyle = isNeighbor ? 'rgba(40,30,20,0.6)' : 'rgba(60,40,15,0.75)';
      ctx.setLineDash(isNeighbor ? [4, 4] : []);
      ctx.stroke();
      ctx.setLineDash([]);
      if (sel && (sel.kind === 'province' || sel.kind === 'neighbor') && sel.id === id) {
        ctx.strokeStyle = '#fff6d8';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }
    // Velmora's national border, gilded
    ctx.save();
    ctx.shadowColor = 'rgba(224,179,65,0.6)';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#e0b341';
    ctx.lineWidth = 2.5;
    for (const id of ['highmarch', 'crownlands', 'riverlands', 'saltcoast']) {
      polyPath(ctx, M.shapes[id]);
      ctx.stroke();
    }
    ctx.restore();
    // Towns
    ctx.textAlign = 'center';
    for (const tw of M.towns) {
      const cap = tw.capital;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(tw.x - (cap ? 8 : 5) + 2, tw.y - (cap ? 6 : 4) + 2, cap ? 16 : 10, cap ? 12 : 8);
      ctx.fillStyle = tw.foreign ? '#c9b48a' : '#f2e7c4';
      ctx.fillRect(tw.x - (cap ? 8 : 5), tw.y - (cap ? 6 : 4), cap ? 16 : 10, cap ? 12 : 8);
      ctx.fillStyle = '#8a3b2a';
      ctx.beginPath();
      ctx.moveTo(tw.x - (cap ? 9 : 6), tw.y - (cap ? 6 : 4));
      ctx.lineTo(tw.x, tw.y - (cap ? 13 : 9));
      ctx.lineTo(tw.x + (cap ? 9 : 6), tw.y - (cap ? 6 : 4));
      ctx.closePath();
      ctx.fill();
      if (cap) {
        ctx.fillStyle = '#e0b341';
        ctx.beginPath();
        ctx.arc(tw.x, tw.y - 18, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.font = `${cap ? 'bold 13px' : '11px'} serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillText(tw.name + (cap ? ' ▸ enter' : ''), tw.x + 1, tw.y + (cap ? 20 : 16) + 1);
      ctx.fillStyle = tw.foreign ? '#e6dcc4' : '#fff8e6';
      ctx.fillText(tw.name + (cap ? ' ▸ enter' : ''), tw.x, tw.y + (cap ? 20 : 16));
    }
    // Province labels and crisis icons
    for (const id in M.labels) {
      const [x, y] = M.labels[id];
      const isNeighbor = id === 'kesh' || id === 'ostmark';
      const name = isNeighbor ? S.neighbor(world, id).name : S.province(world, id).name;
      ctx.font = `${isNeighbor ? 'italic 17px' : 'bold 16px'} serif`;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(20,14,6,0.7)';
      ctx.strokeText(name.toUpperCase(), x, y - 20);
      ctx.fillStyle = isNeighbor ? '#e6dcc4' : '#fff3d0';
      ctx.fillText(name.toUpperCase(), x, y - 20);
      if (!isNeighbor) {
        const p = S.province(world, id);
        ctx.font = '12px sans-serif';
        const v = st.overlay === 'belief' ? `Faith ${Math.round(p.belief)}` : st.overlay === 'stability' ? `Unrest ${Math.round(p.unrest)}` : st.overlay === 'economy' ? `Economy ${Math.round(p.economy)}` : st.overlay === 'reputation' ? S.reputationLabel(world, id) : st.overlay === 'exposure' ? `Exposure ${Math.round(world.country.exposure)}` : G.Data.governments[world.country.government].name;
        const txt = `${p.pop}k people · ${v}`;
        const tw = ctx.measureText(txt).width;
        ctx.fillStyle = 'rgba(15,12,8,0.65)';
        ctx.fillRect(x - tw / 2 - 5, y - 14, tw + 10, 17);
        ctx.fillStyle = '#f3e7c4';
        ctx.fillText(txt, x, y - 1);
        let icons = '';
        if (p.flooded || (id === 'riverlands' && world.flood.stage !== 'none')) icons += '🌊';
        if (p.plague || (p.local && world.plague.active)) icons += '☠';
        if (world.war && id === 'highmarch') icons += '⚔';
        if (p.devastation > 10) icons += '🏚';
        if (icons) {
          ctx.font = '20px sans-serif';
          ctx.fillText(icons, x, y + 26);
        }
      }
    }
    // Title cartouche
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(20,16,10,0.75)';
    ctx.fillRect(14, 12, 300, 52);
    ctx.strokeStyle = '#e0b341';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(18, 16, 292, 44);
    ctx.font = 'bold 18px serif';
    ctx.fillStyle = '#e0b341';
    ctx.fillText(world.country.name, 28, 36);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#e6dcc4';
    const l = S.leader(world);
    ctx.fillText(`${G.Data.governments[world.country.government].name} · ${l ? l.name : 'No leader'}`, 28, 53);
    // Legend for the active overlay
    const legend = {
      belief: ['Doubt', 'Devotion', [70, 80, 110], [240, 196, 80]],
      stability: ['Calm', 'Unrest', [60, 120, 90], [200, 70, 60]],
      economy: ['Poor', 'Prosperous', [110, 70, 60], [90, 170, 100]],
      exposure: ['Hidden', 'Exposed', [50, 60, 90], [255, 240, 200]],
    }[st.overlay];
    if (legend) {
      const lx = 20, ly = 600;
      const grad = ctx.createLinearGradient(lx, 0, lx + 160, 0);
      grad.addColorStop(0, `rgb(${legend[2].join(',')})`);
      grad.addColorStop(1, `rgb(${legend[3].join(',')})`);
      ctx.fillStyle = 'rgba(20,16,10,0.7)';
      ctx.fillRect(lx - 6, ly - 18, 172, 40);
      ctx.fillStyle = grad;
      ctx.fillRect(lx, ly, 160, 8);
      ctx.fillStyle = '#e6dcc4';
      ctx.font = '11px sans-serif';
      ctx.fillText(M.overlays[st.overlay].name, lx, ly - 5);
      ctx.fillText(legend[0], lx, ly + 19);
      ctx.textAlign = 'right';
      ctx.fillText(legend[1], lx + 160, ly + 19);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

  <script>/* js/ui/panels.js */
// Side panels, feed, top bar and contextual form bar.
(function (G) {

        <tr><td>Passive regeneration</td><td class="green">+${r.passive.toFixed(2)}</td></tr>
        <tr><td>Belief of the people</td><td class="green">+${r.belief.toFixed(2)}</td></tr>

      <div class="small" style="margin-top:6px">${esc(tier.title)}${next ? ` · next: ${esc(next.title)} at ${next.earned} renown (now ${Math.floor(f.renown || 0)})` : ''}</div>`;
    UI.$('#tier').textContent = `${tier.title}`;
    const p = T.dateParts(world);
    UI.$('#clock').innerHTML = `${T.WEEKDAYS[p.weekday]}, ${T.format(world)}`;
    UI.$$('#speed button').forEach((b) => b.classList.toggle('active', +b.dataset.speed === UI.state.speed));
    UI.$$('#views button').forEach((b) => b.classList.toggle('active', b.dataset.view === UI.state.view));

  // ---------- Left: prayers & alerts ----------
  P.left = function (world) {
