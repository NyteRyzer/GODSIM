  <script>/* js/sim/crises.js */
// Crises: floods, plague, famine and war. They emerge from simulation variables, with authored event chains for drama.
(function (G) {
  'use strict';
  const S = G.Sim;
  const U = G.Util;
  const T = G.Time;
  const H = S.handlers;

  S.neighbor = (world, id) => world.neighbors.find((n) => n.id === id);

  S.inFloodZone = function (x, y, world) {
    const zone = world && world.flood.diverted ? G.Data.city.northFields : G.Data.city.floodplain;
    return x >= zone.x0 && x < zone.x1 + 1 && y >= zone.y0 && y < zone.y1 + 1;
  };
  S.isInFloodDanger = function (world, c) {
    if (world.flood.stage === 'none' || world.flood.stage === 'receding') return false;
    const home = S.building(world, c.homeId);
    const atRisk = (x, y) => S.inFloodZone(x, y, world);
    if (home && home.protectedUntil > world.t) return atRisk(c.x, c.y) && c.at !== c.homeId;
    return atRisk(c.x, c.y) || (home && atRisk(home.x + 1, home.y + 1) && c.at === c.homeId);
  };

  // ---------- Flood ----------
  H.flood_warning = function (world, data) {
    if (world.flood.stage !== 'none') return;
    world.flood = { stage: 'warning', level: 0, diverted: false, severity: data.severity || 1, startedAt: world.t };
    world.provinces[1].flooded = true;
    S.log(world, { title: 'The river is rising', text: 'Days of rain have swollen the river. The Riverside farms lie in its path. Some families are packing; others will not leave their land.', level: 2, kind: 'disaster', alert: true });
    // Some cautious households evacuate on their own.
    for (const c of S.living(world)) {
      if (!S.isInFloodDanger(world, c)) continue;
      if (world.rng.chance(c.traits.caution * 0.6) && !(c.key && ['hobb', 'lissa', 'tam', 'wren'].includes(c.key))) {
        for (const f of [c, ...S.familyOf(world, c)]) if (f.alive && f.homeId === c.homeId) f.flags.evacuating = true;
      }
    }
    S.requestDecision(world, 'flood_relief', 10 * 60);
    S.schedule(world, 12 * 60, 'flood_rise', {});
  };
  H.flood_rise = function (world) {
    if (world.flood.stage !== 'warning') return;
    world.flood.stage = 'rising';
    S.log(world, { title: 'Floodwaters spill over the banks', text: 'Brown water creeps across the Riverside fields toward the farmhouses.', level: 2, kind: 'disaster', alert: true });
    S.schedule(world, 10 * 60, 'flood_peak', {});
  };
  H.flood_peak = function (world) {
    if (world.flood.stage !== 'rising') return;
    world.flood.stage = 'flooding';
    S.log(world, { title: 'The flood peaks', text: `The river has burst its banks. ${world.flood.diverted ? 'The North Fields are under water.' : 'The Riverside farms are under water.'}`, level: 2, kind: 'disaster', alert: true });
    S.schedule(world, 20 * 60, 'flood_recede', {});
  };
  H.flood_recede = function (world) {
    if (world.flood.stage !== 'flooding') return;
    world.flood.stage = 'receding';
    S.schedule(world, 16 * 60, 'flood_end', {});
  };
  H.flood_end = function (world) {
    if (world.flood.stage === 'none') return;
    S.endFlood(world, 'The waters drained back into the river.');
  };

  S.endFlood = function (world, text) {
    const wasDiverted = world.flood.diverted;
    world.floodEndedAt = world.t;
    const damaged = world.buildings.filter((b) => b.damage > 0).length;
    world.flood = { stage: 'none', level: 0, diverted: false, severity: 1, startedAt: 0 };
    world.provinces[1].flooded = false;
    for (const c of S.living(world)) {
      if (c.flags.trapped) {
        c.flags.trapped = false;
        S.addMemory(world, c, 'survival', 'Survived the flood, trapped until the waters fell.', 2);
      }
      if (c.flags.evacuating) {
        c.flags.evacuating = false;
        S.addMemory(world, c, 'survival', 'Sheltered in the temple during the flood.', 1);
      }
    }
    const dead = world.chronicle.filter((e) => e.kind === 'death' && /drowned/.test(e.text) && e.t > world.t - T.DAY * 4).length;
    S.log(world, {
      title: 'The flood is over',
      text: `${text} ${damaged} buildings were damaged${dead ? `, and ${dead} ${dead === 1 ? 'life was' : 'lives were'} lost` : ', but no lives were lost'}.${wasDiverted ? ' The North Fields harvest is ruined.' : ''}`,
      level: 2, kind: 'disaster',
    });
    const rl = world.provinces[1];
    rl.devastation = U.clamp(rl.devastation + damaged * 3 + dead * 6 + (wasDiverted ? 10 : 0), 0, 100);
    world.country.economy = U.clamp(world.country.economy - damaged * 0.4 - dead, 0, 100);
    S.schedule(world, T.DAY * 2, 'flood_aftermath', { dead, damaged });
  };
  H.flood_aftermath = function (world, data) {
    if (data.dead > 0 && world.country.legitimacy < 50) {
      world.country.legitimacy = U.clamp(world.country.legitimacy - data.dead * 2, 0, 100);
      S.log(world, { title: 'Anger in the Riverlands', text: 'Mourners ask why the Crown did not do more. The Reformers print the names of the dead.', level: 2, kind: 'politics' });
      world.country.reformPressure = U.clamp(world.country.reformPressure + data.dead * 3, 0, 100);
    }
  };

  // Each minute while the flood is active: water level, danger and drowning.
  S.floodMinute = function (world) {
    const f = world.flood;
    if (f.stage === 'none' || f.stage === 'warning') return;
    const target = f.stage === 'rising' ? 0.7 : f.stage === 'flooding' ? 1 : 0;
    f.level = U.clamp(f.level + (target > f.level ? 1 / 600 : -1 / 700), 0, 1);
  };
  S.floodHourly = function (world) {
    const f = world.flood;
    const rng = world.rng;
    if (f.stage === 'none' || f.stage === 'warning') return;
    for (const b of world.buildings) {
      if (S.isFlooded(world, b.x + 1, b.y + 1) && b.protectedUntil <= world.t) b.damage = U.clamp(b.damage + 5, 0, 100);
    }
    for (const c of S.living(world)) {
      if (c.possessed) continue;
      const wet = S.isFlooded(world, c.x, c.y);
      if (!wet) continue;
      if (c.flags.evacuating) continue; // already on the move
      const atHome = (S.buildingAt(world, c.x, c.y) || {}).id === c.homeId;
      if (!atHome && !c.flags.trapped) {
        // Caught in the open: flee to the shelter, perhaps hurt.
        c.flags.evacuating = true;
        if (rng.chance(0.3)) c.injury = U.clamp(c.injury + rng.int(5, 20), 0, 100);
        S.goTo(world, c, 'temple', 'fleeing the flood');
        continue;
      }
      // People at home in the flood zone get trapped if they did not leave in time.
      if (!c.flags.trapped && f.level > 0.25) {
        c.flags.trapped = true;
        c.path = [];
        c.at = c.homeId;
        S.addMemory(world, c, 'danger', 'Trapped at home by the rising water.', 2);
        const home = S.building(world, c.homeId);
        if (home && home.trappedLoggedAt !== world.flood.startedAt) {
          home.trappedLoggedAt = world.flood.startedAt;
          const fam = S.living(world).filter((o) => o.homeId === c.homeId);
          S.log(world, { title: 'Trapped by the flood', text: `The ${c.last} household (${fam.map((o) => o.first).join(', ')}) is trapped by the rising water at ${home.name}.`, level: 2, kind: 'disaster', entities: fam.map((o) => o.id), alert: true });
        }
      }
      if (c.flags.trapped && f.stage === 'flooding') {
        const frailty = c.age < 10 || c.age > 65 ? 1.6 : 1;
        if (rng.chance(0.012 * f.level * frailty * f.severity * (c.flags.endure > world.t ? 0.3 : 1))) {
          c.flags.trapped = false;
          S.killCharacter(world, c, 'drowning (drowned in the flood)');
        } else if (rng.chance(0.06 * f.level)) {
          c.injury = U.clamp(c.injury + rng.int(10, 30), 0, 100);
        }
      }
    }
  };

  // Rescue organised by an official or soldier (indirect answers lead here).
  S.organizeRescue = function (world, organizer) {
    if (world.flood.stage === 'none') return false;
    if (world.country.flags.rescueUnderway) return true;
    world.country.flags.rescueUnderway = true;
    const delay = 120 + world.rng.int(0, 180) - organizer.traits.courage * 60;
    S.schedule(world, delay, 'rescue_arrives', { organizerId: organizer.id });
    S.log(world, { title: 'A rescue is organised', text: `${organizer.name} is gathering boats and soldiers to reach the trapped farms.`, level: 2, kind: 'event', entities: [organizer.id] });
    return true;
  };
  H.rescue_arrives = function (world, data) {
    world.country.flags.rescueUnderway = false;
    const org = S.char(world, data.organizerId);
    const trapped = S.living(world).filter((c) => c.flags.trapped);
    let saved = 0;
    for (const c of trapped) {
      if (world.rng.chance(0.85)) {
        c.flags.trapped = false;
        c.flags.evacuating = true;
        saved++;
        S.addMemory(world, c, 'rescue', `Rescued from the flood by ${org ? org.first + "'s" : 'the'} boats.`, 2);
        if (org) S.relate(c, org, 'friend', 75);
      }
    }
    if (org) {
      org.renown = U.clamp(org.renown + 15, 0, 100);
      if (org.id === world.country.leaderId) world.country.legitimacy = U.clamp(world.country.legitimacy + 5, 0, 100);
      const f = world.country.factions.find((ff) => ff.leaderId === org.id || ff.id === org.factionId);
      if (f) f.power = U.clamp(f.power + 4, 0, 100);
    }
    world.country.factions.find((f) => f.id === 'commons').approval += 3;
    if (!trapped.length) {
      S.log(world, { title: 'Rescue boats reach the farms', text: `${org ? org.name : 'The rescuers'} reached the farms and found no one left to save.`, level: 1, kind: 'event', entities: org ? [org.id] : [] });
      return;
    }
    S.log(world, { title: 'Rescue boats reach the farms', text: `${org ? org.name : 'Rescuers'} reached the flooded farms and brought ${saved} people to safety. ${org ? `Many now speak well of ${org.first}.` : ''}`, level: 2, kind: 'event', entities: org ? [org.id] : [] });
  };
  H.neighbor_rescue = function (world, data) {
    const helper = S.char(world, data.helperId);
    if (!helper || !helper.alive) return;
    const fam = S.living(world).filter((c) => c.homeId === data.homeId && c.flags.trapped);
    if (!fam.length) return;
    const success = world.rng.chance(0.45 + helper.traits.courage * 0.4);
    if (success) {
      for (const c of fam) {
        c.flags.trapped = false;
        c.flags.evacuating = true;
        S.addMemory(world, c, 'rescue', `${helper.first} waded through the flood to save them.`, 3);
        S.relate(c, helper, 'friend', 85);
      }
      helper.renown = U.clamp(helper.renown + 10, 0, 100);
      S.addMemory(world, helper, 'rescue', `Saved the ${fam[0].last} family from the flood.`, 3);
      S.log(world, { title: 'A neighbour\'s courage', text: `${helper.name} reached the ${fam[0].last} family and led them to safety.`, level: 2, kind: 'event', entities: [helper.id, fam[0].id] });
    } else {
      helper.injury = U.clamp(helper.injury + 25, 0, 100);
      S.log(world, { title: 'A failed rescue', text: `${helper.name} tried to reach the ${fam[0].last} family but was swept back by the current.`, level: 1, kind: 'event', entities: [helper.id] });
    }
  };

  // ---------- Disease ----------
  H.ill_child = function (world) {
    // An authored small story near the start so the prayer inbox is not empty.
    const kids = S.living(world).filter((c) => c.role === 'child' && c.homeId.startsWith('home'));
    const c = world.rng.pick(kids);
    if (!c) return;
    c.illness = { name: 'marsh fever', severity: 48 };
    S.addMemory(world, c, 'illness', 'Fell ill with marsh fever.', 1);
  };
  H.plague_outbreak = function (world) {
    if (world.plague.active) return;
    world.plague = { active: true, until: world.t + T.DAY * world.rng.int(20, 40) };
    world.provinces[0].plague = 40;
    S.log(world, { title: 'Plague', text: 'A sickness spreads through Old Town. The healer cannot keep up.', level: 3, kind: 'disaster', alert: true });
    for (let i = 0; i < 4; i++) {
      const c = world.rng.pick(S.living(world).filter((x) => !x.illness));
      if (c) c.illness = { name: 'the plague', severity: world.rng.int(30, 60) };
    }
  };

  // ---------- War ----------
  H.war_declared = function (world, data) {
    if (world.war) return;
    const n = S.neighbor(world, data.enemy || 'kesh');
    world.war = { enemy: n.id, score: 0, startedAt: world.t, casualties: 0 };
    n.relation = -80;
    world.country.security = U.clamp(world.country.security - 5, 0, 100);
    S.log(world, { title: `War with ${n.name}`, text: `${n.name} has invaded the Highmarch.`, level: 3, kind: 'war', alert: true });
  };
  S.endWar = function (world, how, text) {
    if (!world.war) return;
    const n = S.neighbor(world, world.war.enemy);
    const country = world.country;
    if (how === 'victory') {
      country.legitimacy = U.clamp(country.legitimacy + 10, 0, 100);
      n.strength = Math.max(20, n.strength - 10);
    } else if (how === 'defeat') {
      country.legitimacy = U.clamp(country.legitimacy - 15, 0, 100);
      country.economy = U.clamp(country.economy - 8, 0, 100);
      S.province(world, 'highmarch').unrest += 25;
    }
    n.relation = how === 'peace' ? -10 : how === 'victory' ? -40 : -30;
    country.warRisk = 5;
    S.log(world, { title: how === 'victory' ? 'Victory' : how === 'defeat' ? 'Defeat' : 'Peace', text: text || `The war with ${n.name} has ended in ${how}.`, level: 3, kind: 'war' });
    world.war = null;
  };
  S.dailyWar = function (world) {
    const country = world.country;
    const rng = world.rng;
    if (world.war) {
      const n = S.neighbor(world, world.war.enemy);
      const own = (country.security + S.faction(world, 'military').power) / 2;
      world.war.score = U.clamp(world.war.score + (own - n.strength) * 0.08 + rng.float(-4, 4) + (world.war.tide || 0), -100, 100);
      world.war.casualties += rng.int(5, 40);
      country.economy = U.clamp(country.economy - 0.15, 0, 100);
      if (rng.chance(0.08)) {
        const soldier = rng.pick(S.living(world).filter((c) => c.role === 'soldier'));
        if (soldier) S.killCharacter(world, soldier, 'wounds taken in battle in the Highmarch');
      }
      if (world.war.score >= 60) S.endWar(world, 'victory', `The ${n.name} army was driven from the Highmarch.`);
      else if (world.war.score <= -60) S.endWar(world, 'defeat', `The Highmarch fell to ${n.name}. Velmora sued for peace.`);
      else if (world.t - world.war.startedAt > T.DAY * 120 && rng.chance(0.03)) S.endWar(world, 'peace', 'Exhausted, both sides signed a treaty.');
      return;
    }
    // War risk emerges from weakness and hostile neighbours.
    for (const n of world.neighbors) {
      const weakness = (60 - country.security) * 0.5 + (50 - country.stability) * 0.3;
      country.warRisk = U.clamp(country.warRisk + (weakness * n.aggression - n.relation * 0.2) * 0.012 - 0.03, 0, 100);
      n.relation = U.clamp(n.relation + rng.float(-0.4, 0.4), -100, 100);
      if (n.aggression > 0.4 && country.warRisk > 45 && !country.pendingDecision && !country.flags.warWarned) {
        country.flags.warWarned = world.t;
        S.requestDecision(world, 'war_response', 24 * 60);
      }
      if (n.aggression > 0.4 && country.warRisk > 70 && rng.chance(0.03 * world.settings.crisisFrequency)) H.war_declared(world, { enemy: n.id });
    }
    if (country.flags.warWarned && world.t - country.flags.warWarned > T.DAY * 60) country.flags.warWarned = 0;
  };

  // ---------- emergent crises (daily) ----------
  S.dailyCrises = function (world) {
    const rng = world.rng;
    const country = world.country;
    const freq = world.settings.crisisFrequency;
    const p = G.Time.dateParts(world);
    // Spring floods
    if (world.flood.stage === 'none' && (p.month === 2 || p.month === 3) && world.t - (world.floodEndedAt || -1e9) > T.DAY * 90 && rng.chance(0.008 * freq)) H.flood_warning(world, { severity: rng.float(0.7, 1.2) });
    // Plague from poverty and hunger
    const living = S.living(world);
    const avgHunger = living.reduce((s, c) => s + c.hunger, 0) / Math.max(1, living.length);
    if (!world.plague.active && rng.chance((0.0008 + avgHunger * 0.00008) * freq)) H.plague_outbreak(world);
    if (world.plague.active && world.t > world.plague.until) {
      world.plague.active = false;
      for (const pr of world.provinces) pr.plague = 0;
      S.log(world, { title: 'The plague subsides', text: 'Fewer fall sick each day. The worst has passed.', level: 2, kind: 'disaster' });
    }
    // Famine from a collapsing economy
    if (!country.flags.famine && country.economy < 25 && rng.chance(0.05)) {
      country.flags.famine = true;
      S.log(world, { title: 'Famine', text: 'Bread prices have tripled. Families go hungry.', level: 3, kind: 'disaster', alert: true });
      S.requestDecision(world, 'famine_relief', 24 * 60);
    } else if (country.flags.famine && country.economy > 35) {
      country.flags.famine = false;
      country.flags.granaries = false;
      S.log(world, { title: 'The famine ends', text: 'Grain flows again to the markets.', level: 2, kind: 'disaster' });
    }
    S.dailyWar(world);
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

</script>
  <script>/* js/sim/politics.js */
// National politics: derived stability/risk variables, leader decisions, regime transitions, succession and elections.
// Divine intervention changes conditions or leaders' inclinations, never guarantees an outcome.
(function (G) {
  'use strict';
  const S = G.Sim;
  const U = G.Util;
  const T = G.Time;
  const H = S.handlers;

  S.govName = (world) => G.Data.governments[world.country.government].name;

  S.politicsDerived = function (world) {
    const c = world.country;
    const fp = (id) => S.faction(world, id);
    c.eliteLoyalty = U.clamp((fp('nobility').approval * 0.4 + fp('military').approval * 0.4 + fp('clergy').approval * 0.2), 0, 100);
    c.stability = U.clamp(c.legitimacy * 0.35 + c.economy * 0.2 + c.security * 0.15 + c.eliteLoyalty * 0.2 + (100 - c.inequality) * 0.1 - (world.war ? 10 : 0) - (c.flags.famine ? 10 : 0), 0, 100);
    const gen = S.char(world, fp('military').leaderId);
    const genAmb = gen && gen.alive ? gen.traits.ambition : 0.3;
    c.coupRisk = U.clamp((100 - c.eliteLoyalty) * 0.35 + (fp('military').power - 45) * 0.4 + (50 - c.legitimacy) * 0.45 + genAmb * 22 + (100 - fp('military').approval) * 0.15, 0, 100);
    const living = S.living(world);
    const hunger = living.reduce((s, x) => s + x.hunger, 0) / Math.max(1, living.length);
    c.revolutionRisk = U.clamp((55 - c.legitimacy) * 0.6 + hunger * 0.3 + fp('reformers').power * 0.3 + (c.inequality - 50) * 0.35 + (100 - fp('commons').approval) * 0.2 - c.security * 0.15 + (c.grievance || 0) * 0.8, 0, 100);
    c.theocracyPressure = U.clamp((c.religiousInfluence - 50) * 1.1 + (fp('clergy').power - 50) * 0.6 + (45 - c.legitimacy) * 0.4 + c.exposure * 0.2, 0, 100);
  };

  S.dailyPolitics = function (world) {
    const c = world.country;
    const rng = world.rng;
    const gov = G.Data.governments[c.government];
    const living = S.living(world);
    const avgBelief = living.reduce((s, x) => s + x.belief, 0) / Math.max(1, living.length);
    // Slow drift of conditions
    c.grievance = Math.max(0, (c.grievance || 0) - 0.2);
    c.inequality = U.clamp(c.inequality + gov.drift.inequality + rng.float(-0.05, 0.05), 0, 100);
    c.corruption = U.clamp(c.corruption + gov.drift.corruption + rng.float(-0.05, 0.05), 0, 100);
    const devastation = world.provinces.reduce((s, p) => s + p.devastation, 0) / world.provinces.length;
    c.economy = U.clamp(c.economy + (52 - c.economy) * 0.01 - devastation * 0.004 - (world.plague.active ? 0.15 : 0) + c.technology * 0.0006 + rng.float(-0.25, 0.25), 0, 100);
    for (const p of world.provinces) p.devastation = Math.max(0, p.devastation - 0.25);
    c.treasury = U.clamp(c.treasury + (c.economy - 45) * 0.03 - (world.war ? 0.4 : 0), 0, 100);
    if (c.treasury < 15 && !c.pendingDecision && rng.chance(0.1)) S.requestDecision(world, 'tax_policy', T.DAY);
    const legitTarget = 30 + (c.economy - 50) * 0.3 + (c.security - 50) * 0.1 - (c.corruption - 50) * 0.25 + (c.government === 'democracy' || c.government === 'republic' ? 15 : 0) + (S.leader(world) ? S.leader(world).renown * 0.12 : 0);
    c.legitimacy = U.clamp(U.lerp(c.legitimacy, legitTarget, 0.015), 0, 100);
    c.institutionalTrust = U.clamp(U.lerp(c.institutionalTrust, c.legitimacy * 0.6 + (100 - c.corruption) * 0.4, 0.02), 0, 100);
    c.religiousInfluence = U.clamp(U.lerp(c.religiousInfluence, avgBelief * 0.6 + world.church.strength * 0.4 + (c.government === 'theocracy' ? 20 : 0), 0.02), 0, 100);
    c.reformPressure = U.clamp(c.reformPressure + ((c.inequality + c.corruption) / 2 - c.legitimacy) * 0.012 + S.faction(world, 'reformers').power * 0.004 + c.literacy * 0.002 - (c.government !== 'monarchy' && c.government !== 'dictatorship' ? 0.3 : 0), 0, 100);
    c.security = U.clamp(U.lerp(c.security, S.faction(world, 'military').power * 0.8 + 10, 0.02), 0, 100);
    // Factions: approval tracks how the regime serves each group's agenda.
    for (const f of c.factions) {
      let target = 50;
      if (f.id === 'crown') target = c.government === 'monarchy' || c.government === 'constitutional' ? 70 : 20;
      if (f.id === 'nobility') target = 60 - (c.government === 'democracy' ? 20 : 0) + (c.inequality - 50) * 0.3;
      if (f.id === 'clergy') target = 40 + c.religiousInfluence * 0.3 + (c.government === 'theocracy' ? 25 : 0);
      if (f.id === 'military') target = 45 + (c.treasury - 40) * 0.2 + (c.government === 'dictatorship' ? 25 : 0) + (world.war && world.war.score > 0 ? 10 : 0);
      if (f.id === 'reformers') target = 25 + (c.government === 'democracy' || c.government === 'republic' ? 40 : c.government === 'constitutional' ? 20 : 0) - c.corruption * 0.1;
      if (f.id === 'commons') target = 30 + c.economy * 0.35 - avgHungerOf(world) * 0.3 + (c.legitimacy - 40) * 0.2;
      f.approval = U.clamp(U.lerp(f.approval, target, 0.03) + rng.float(-0.4, 0.4), 0, 100);
      // Faction leaders' renown and charisma affect power
      const lead = S.char(world, f.leaderId);
      const tPower = f.id === 'reformers' ? 15 + c.reformPressure * 0.5 + c.literacy * 0.2 : f.id === 'clergy' ? 25 + world.church.strength * 0.5 : f.power;
      f.power = U.clamp(U.lerp(f.power, tPower, 0.01) + (lead && lead.alive ? lead.renown * 0.002 : -0.1), 0, 100);
      if (lead && !lead.alive) S.replaceFactionLeader(world, f);
    }
    for (const p of world.provinces) {
      const t = 20 + (100 - c.stability) * 0.4 + p.devastation * 0.3 + (p.plague || 0) * 0.2;
      p.unrest = U.clamp(U.lerp(p.unrest, t, 0.03), 0, 100);
      p.economy = U.clamp(U.lerp(p.economy, c.economy + (p.id === 'saltcoast' ? 8 : 0) - p.devastation * 0.3, 0.03), 0, 100);
    }
    S.politicsDerived(world);
    // Decision triggers
    if (!c.pendingDecision && world.t > c.decisionCooldown) {
      if ((c.government === 'monarchy') && c.reformPressure > 62 && !c.flags.petitionAt) {
        c.flags.petitionAt = world.t;
        S.log(world, { title: 'The Reformers petition the Crown', text: `${S.char(world, S.faction(world, 'reformers').leaderId)?.name || 'The Reformers'} delivered a petition with ${rng.int(800, 3000)} signatures demanding a charter of rights.`, level: 2, kind: 'politics' });
        S.requestDecision(world, 'reform_petition', T.DAY * 2);
      } else if (world.church.strength > 60 && S.faction(world, 'clergy').power > 55 && world.t - (c.flags.churchAskAt || -1e9) > T.DAY * 150 && rng.chance(0.02)) {
        c.flags.churchAskAt = world.t;
        S.requestDecision(world, 'church_privileges', T.DAY * 2);
      }
    }
    if (c.flags.petitionAt && world.t - c.flags.petitionAt > T.DAY * 70) c.flags.petitionAt = 0;
    S.checkTransitions(world);
    // Elections
    if (gov.elections && world.t >= c.nextElection) S.holdElection(world);
  };

  function avgHungerOf(world) {
    const l = S.living(world);
    return l.reduce((s, x) => s + x.hunger, 0) / Math.max(1, l.length);
  }

  S.replaceFactionLeader = function (world, f) {
    const pool = S.living(world).filter((x) => x.factionId === f.id && x.age >= 20 && x.role !== 'child');
    pool.sort((a, b) => b.renown + b.traits.ambition * 30 - (a.renown + a.traits.ambition * 30));
    f.leaderId = pool[0] ? pool[0].id : null;
    if (pool[0]) S.log(world, { title: `New leader of ${f.name}`, text: `${pool[0].name} now leads ${f.name}.`, level: 1, kind: 'politics', entities: [pool[0].id] });
  };

  // ---------- Decisions ----------
  S.requestDecision = function (world, decisionId, delayMin) {
    const c = world.country;
    if (c.pendingDecision) return false;
    const leader = S.leader(world);
    if (!leader) return false;
    c.pendingDecision = { id: world.nextId++, decisionId, leaderId: leader.id, dueAt: world.t + delayMin, requestedAt: world.t };
    const d = G.Data.decisions[decisionId];
    S.log(world, { title: 'A decision looms', text: `${leader.name} must decide: ${d.title}. (In ${T.duration(delayMin)})`, level: 2, kind: 'politics', entities: [leader.id], alert: true });
    return true;
  };

  // Leader utility: personality + beliefs + divine inspiration + noise. Leaders keep their own goals.
  S.decisionUtilities = function (world, leader, decision) {
    const t = leader.traits;
    const insp = leader.inspiration && leader.inspiration.until > world.t ? leader.inspiration : null;
    return decision.options.map((o) => {
      let u = 0;
      for (const tag of o.tags) {
        if (tag === 'mercy') u += t.kindness * 1.2;
        if (tag === 'order') u += t.caution * 0.6 + t.ambition * 0.5 + (1 - t.kindness) * 0.3;
        if (tag === 'piety') u += t.piety * 0.8 + leader.belief / 100;
        if (tag === 'reform') u += (1 - t.ambition) * 0.5 + t.kindness * 0.4 + t.skepticism * 0.3 - (leader.role === 'monarch' ? 0.4 : 0);
        if (tag === 'peace') u += t.caution * 0.6 + t.kindness * 0.3;
        if (tag === 'war') u += t.courage * 0.6 + t.ambition * 0.4;
        if (insp && insp.tag === tag) u += insp.strength * (0.6 + leader.belief / 100);
      }
      u /= Math.max(1, o.tags.length * 0.8);
      return { option: o, utility: u };
    });
  };

  S.resolveDecision = function (world, forcedOptionId, byPlayer) {
    const c = world.country;
    const pd = c.pendingDecision;
    if (!pd) return null;
    const d = G.Data.decisions[pd.decisionId];
    const leader = S.char(world, pd.leaderId);
    c.pendingDecision = null;
    c.decisionCooldown = world.t + T.DAY * 3;
    if (!leader || !leader.alive) return null;
    let choice;
    if (forcedOptionId) choice = d.options.find((o) => o.id === forcedOptionId);
    if (!choice) {
      const utils = S.decisionUtilities(world, leader, d);
      for (const u of utils) u.utility += world.rng.float(-0.25, 0.25); // a believer can still make a poor choice
      utils.sort((a, b) => b.utility - a.utility);
      choice = utils[0].option;
    }
    S.applyDecisionEffects(world, choice);
    S.addMemory(world, leader, 'decision', `Decided: ${choice.label}.`, 2);
    S.log(world, { title: `${leader.first} decides`, text: `${leader.name} chose to ${choice.label.charAt(0).toLowerCase() + choice.label.slice(1)}.${byPlayer ? ' The court thought the voice strange, as if someone else were speaking.' : ''}`, level: 2, kind: 'politics', entities: [leader.id] });
    if (byPlayer) {
      world.country.exposure = U.clamp(world.country.exposure + 1, 0, 100);
      leader.flags.oddBehaviour = (leader.flags.oddBehaviour || 0) + 1;
    }
    return choice;
  };

  S.applyDecisionEffects = function (world, o) {
    const c = world.country;
    for (const k in o.effects || {}) c[k] = U.clamp((c[k] || 0) + o.effects[k], 0, 100);
    for (const k in o.factions || {}) {
      const f = S.faction(world, k);
      if (f) f.approval = U.clamp(f.approval + o.factions[k], 0, 100);
    }
    if (o.flag === 'rescue') {
      const gen = S.char(world, S.faction(world, 'military').leaderId) || S.leader(world);
      if (gen) S.organizeRescue(world, gen);
    }
    if (o.flag === 'arrests') {
      const ref = S.char(world, S.faction(world, 'reformers').leaderId);
      if (ref && ref.alive) {
        ref.flags.detainedUntil = world.t + T.DAY * 30;
        S.goTo(world, ref, 'barracks', 'detained');
        S.addMemory(world, ref, 'detained', 'Arrested on the orders of the Crown.', 3);
        S.log(world, { title: 'Arrests', text: `${ref.name} was arrested and thrown in the gaol.`, level: 2, kind: 'politics', entities: [ref.id] });
      }
    }
    if (o.flag === 'mobilize') c.warRisk = U.clamp(c.warRisk - 15, 0, 100);
    if (o.flag === 'granaries') c.flags.granaries = true;
    if (o.transition) S.transition(world, o.transition, 'The charter was signed in the Great Hall.');
    S.politicsDerived(world);
  };

  H.decision_due = function () {};

  S.politicsHourly = function (world) {
    const pd = world.country.pendingDecision;
    if (pd && world.t >= pd.dueAt) {
      // If the player possesses the leader at the moment of decision, they decide.
      if (world.player.form === 'possession' && world.player.possessId === pd.leaderId && world.player.pendingChoice) {
        S.resolveDecision(world, world.player.pendingChoice, true);
        world.player.pendingChoice = null;
      } else S.resolveDecision(world, null, false);
    }
  };

  // ---------- Regime change ----------
  S.transition = function (world, toGov, text, newLeader) {
    const c = world.country;
    const from = c.government;
    if (from === toGov) return;
    c.government = toGov;
    c.govSince = world.t;
    if (newLeader) {
      c.leaderId = newLeader.id;
      newLeader.renown = U.clamp(newLeader.renown + 25, 0, 100);
    }
    const gov = G.Data.governments[toGov];
    if (gov.elections) c.nextElection = world.t + T.DAY * (toGov === 'democracy' ? 30 : 20);
    c.legitimacy = U.clamp(c.legitimacy + (toGov === 'democracy' || toGov === 'republic' ? 12 : toGov === 'constitutional' ? 8 : -5), 0, 100);
    const l = S.leader(world);
    if (l) retitle(world, l, gov.leaderTitle);
    S.log(world, {
      title: `${G.Data.governments[from].name} → ${gov.name}`,
      text: `${text} ${c.name} is now a ${gov.name.toLowerCase()}${l ? `, led by ${l.name}` : ''}.`,
      level: 3, kind: 'regime', alert: true,
    });
    if (toGov !== 'monarchy' && toGov !== 'constitutional') c.name = c.name.replace(/^Kingdom of /, toGov === 'theocracy' ? 'Holy State of ' : toGov === 'dictatorship' ? 'Protectorate of ' : 'Republic of ');
    else if (!/^Kingdom of /.test(c.name)) c.name = 'Kingdom of ' + c.name.replace(/^(Holy State of |Protectorate of |Republic of )/, '');
  };

  function retitle(world, ch, title) {
    if (!ch) return;
    const royal = ch.role === 'monarch' || ch.role === 'heir';
    const t = title === 'Monarch' ? (ch.sex === 'f' ? 'Queen' : 'King') : title;
    if (royal && title !== 'Monarch' && (ch.title === 'King' || ch.title === 'Queen')) ch.title = '';
    ch.title = t;
    ch.name = `${t ? t + ' ' : ''}${ch.first} ${ch.last}`;
  }

  S.checkTransitions = function (world) {
    const c = world.country;
    const rng = world.rng;
    const since = world.t - c.govSince;
    if (since < T.DAY * 15) return;
    // Coup: the army seizes power.
    if (c.government !== 'dictatorship' && c.coupRisk > 68 && rng.chance((c.coupRisk - 68) * 0.004)) {
      const gen = S.char(world, S.faction(world, 'military').leaderId);
      if (gen && gen.alive && gen.traits.ambition > 0.5) {
        const old = S.leader(world);
        if (old && old.alive && old.id !== gen.id) {
          old.flags.detainedUntil = world.t + T.DAY * 365;
          S.addMemory(world, old, 'coup', `Overthrown by ${gen.name}.`, 3);
        }
        gen.role = 'monarch' === gen.role ? gen.role : gen.role;
        S.transition(world, 'dictatorship', `Soldiers loyal to ${gen.name} seized the palace at dawn.`, gen);
        S.faction(world, 'military').approval = 85;
        S.faction(world, 'reformers').approval = 10;
        return;
      }
    }
    // Revolution: the people rise.
    if ((c.government === 'monarchy' || c.government === 'dictatorship' || c.government === 'theocracy') && c.revolutionRisk > 66 && rng.chance((c.revolutionRisk - 66) * 0.004)) {
      const ref = S.char(world, S.faction(world, 'reformers').leaderId);
      const old = S.leader(world);
      if (old && old.alive) {
        old.flags.detainedUntil = world.t + T.DAY * 365;
        S.addMemory(world, old, 'revolution', 'Deposed by the revolution.', 3);
      }
      if (ref && ref.alive) ref.flags.detainedUntil = 0;
      S.transition(world, 'revolutionary', 'Crowds stormed the palace gates. The old order fell in a single night.', ref && ref.alive ? ref : null);
      return;
    }
    // Revolutionary committee → republic
    if (c.government === 'revolutionary' && since > T.DAY * 40 && rng.chance(0.05)) {
      S.transition(world, 'republic', 'The Committee proclaimed a constitution and called the first presidential election.');
      return;
    }
    // Theocracy: the Church takes the throne.
    if (c.government !== 'theocracy' && c.theocracyPressure > 70 && rng.chance((c.theocracyPressure - 70) * 0.003)) {
      const priest = S.char(world, world.church.leaderId);
      if (priest && priest.alive) {
        S.transition(world, 'theocracy', `${priest.name} proclaimed that the miracles of recent years revealed divine will: the realm would be ruled by the Church.`, priest);
        return;
      }
    }
    // Constitutional monarchy → democracy once the assembly matures
    if (c.government === 'constitutional' && since > T.DAY * 90 && c.reformPressure > 45 && rng.chance(0.015)) {
      S.transition(world, 'democracy', 'The assembly voted to hold elections for a First Minister; the crown became ceremonial.');
    }
  };

  S.holdElection = function (world) {
    const c = world.country;
    const gov = G.Data.governments[c.government];
    c.nextElection = world.t + T.DAY * gov.elections;
    c.lastElection = world.t;
    const cands = c.factions.filter((f) => f.leaderId && S.char(world, f.leaderId) && S.char(world, f.leaderId).alive && !['crown'].includes(f.id))
      .map((f) => {
        const l = S.char(world, f.leaderId);
        const support = f.power * 0.5 + l.renown * 0.4 + (f.id === 'reformers' ? c.reformPressure * 0.2 : 0) + (f.id === 'clergy' ? c.religiousInfluence * 0.2 : 0) + world.rng.float(0, 25) + (l.id === c.leaderId ? 8 : 0);
        return { f, l, support };
      })
      .sort((a, b) => b.support - a.support);
    if (!cands.length) return;
    const win = cands[0];
    const prev = S.leader(world);
    const old = c.leaderId;
    c.leaderId = win.l.id;
    if (prev && prev.id !== win.l.id && prev.alive && prev.role !== 'monarch') retitle(world, prev, '');
    retitle(world, win.l, gov.leaderTitle);
    win.f.approval = U.clamp(win.f.approval + 10, 0, 100);
    c.legitimacy = U.clamp(c.legitimacy + 4, 0, 100);
    S.log(world, { title: 'Election', text: `${win.l.name} (${win.f.name}) won the election${old === win.l.id ? ' and remains in office' : ''}. Runner-up: ${cands[1] ? cands[1].l.name : 'none'}.`, level: 2, kind: 'politics', entities: [win.l.id] });
  };

  // ---------- Succession ----------
  S.onCharacterDeath = function (world, ch) {
    const c = world.country;
    if (ch.id === c.leaderId) {
      if (c.government === 'monarchy' || c.government === 'constitutional') {
        const heir = S.char(world, c.heirId);
        if (heir && heir.alive) {
          c.leaderId = heir.id;
          heir.role = 'monarch';
          heir.occupation = heir.sex === 'f' ? 'Queen of Velmora' : 'King of Velmora';
          retitle(world, heir, 'Monarch');
          heir.renown = U.clamp(heir.renown + 40, 0, 100);
          c.legitimacy = U.clamp(c.legitimacy + (heir.traits.kindness > 0.6 ? 6 : 0) - 4, 0, 100);
          S.faction(world, 'crown').leaderId = heir.id;
          const kids = S.familyOf(world, heir).filter((k) => k.alive && heir.relations[k.id].type === 'child');
          c.heirId = kids.length ? kids[0].id : null;
          if (kids[0]) kids[0].role = kids[0].age >= 15 ? 'heir' : kids[0].role;
          S.log(world, { title: 'Succession', text: `${heir.name} ascends the throne after the death of ${ch.name}.`, level: 3, kind: 'regime', entities: [heir.id], alert: true });
        } else {
          // Succession crisis: a noble claimant
          const noble = S.char(world, S.faction(world, 'nobility').leaderId);
          c.legitimacy = U.clamp(c.legitimacy - 15, 0, 100);
          if (noble && noble.alive) {
            c.leaderId = noble.id;
            noble.role = 'monarch';
            retitle(world, noble, 'Monarch');
            S.faction(world, 'crown').leaderId = noble.id;
            S.log(world, { title: 'Succession crisis', text: `With no heir, ${noble.name} claimed the crown. Many doubt the claim.`, level: 3, kind: 'regime', entities: [noble.id], alert: true });
          }
        }
      } else if (c.government === 'theocracy') {
        world.church.leaderId = null;
        S.dailyReligion(world);
        c.leaderId = world.church.leaderId;
        S.log(world, { title: 'A new Hierarch', text: 'The Church chose a successor.', level: 2, kind: 'regime' });
      } else {
        const f = c.factions.slice().sort((a, b) => b.power - a.power).find((ff) => ff.leaderId && ff.leaderId !== ch.id && S.char(world, ff.leaderId)?.alive);
        if (f) {
          c.leaderId = f.leaderId;
          retitle(world, S.char(world, f.leaderId), G.Data.governments[c.government].leaderTitle);
          S.log(world, { title: 'Interim leader', text: `${S.char(world, f.leaderId).name} took power after the death of ${ch.name}.`, level: 2, kind: 'regime' });
        }
        c.legitimacy = U.clamp(c.legitimacy - 8, 0, 100);
      }
      if (c.pendingDecision) c.pendingDecision.leaderId = c.leaderId;
    }
    if (ch.id === c.heirId) {
      const king = S.leader(world);
      const kids = king ? S.familyOf(world, king).filter((k) => k.alive && king.relations[k.id].type === 'child') : [];
      c.heirId = kids.length ? kids[0].id : null;
      if (c.government === 'monarchy') S.log(world, { title: 'The heir is dead', text: c.heirId ? `${S.char(world, c.heirId).name} is now heir.` : 'The line of succession is broken.', level: 2, kind: 'regime' });
    }
  };

  // The Crown claims witnessed miracles as proof of divine favor; a rival may challenge the claim.
  H.crown_claims_miracle = function (world, data) {
    const c = world.country;
    const king = S.leader(world);
    if (!king || !king.alive || world.t - (c.flags.lastClaim || -99999) < T.DAY * 5) return;
    if (c.government !== 'monarchy' && c.government !== 'constitutional' && c.government !== 'theocracy') return;
    if (king.traits.ambition < 0.4 && king.belief < 50) return;
    c.flags.lastClaim = world.t;
    c.legitimacy = U.clamp(c.legitimacy + 5, 0, 100);
    S.log(world, { title: 'The Crown claims divine favor', text: `${king.name} proclaimed that ${data.text} proves heaven blesses the throne.`, level: 2, kind: 'politics', entities: [king.id] });
    const rival = S.char(world, S.faction(world, 'nobility').leaderId);
    if (rival && rival.alive && rival.traits.ambition > 0.6 && rival.id !== king.id) {
      c.eliteLoyalty = U.clamp(c.eliteLoyalty - 3, 0, 100);
      S.faction(world, 'nobility').approval = U.clamp(S.faction(world, 'nobility').approval - 5, 0, 100);
      S.log(world, { title: 'A rival challenges the claim', text: `${rival.name} sneered that the miracle owed nothing to the King, and much to the priests' theatre.`, level: 1, kind: 'politics', entities: [rival.id] });
    }
  };
})((globalThis.GODSIM = globalThis.GODSIM || {}));

  <script>/* js/sim/prayers.js */
// Prayers: generated by people from their circumstances and beliefs; resolved by the player or by the world.
// Response types: direct, indirect, delayed, silence, alternative.
(function (G) {
  'use strict';
  const S = G.Sim;
  const U = G.Util;
  const T = G.Time;
  const H = S.handlers;

  const URGENCY = ['', 'Low', 'Urgent', 'Critical'];
  S.URGENCY = URGENCY;
  const EXPIRY = [0, T.DAY * 4, T.DAY * 2, 14 * 60];
  const MAX_PENDING = 10;

  const sevOf = (c) => Math.max(c.illness ? c.illness.severity : 0, c.injury);
  const nearestBy = (world, c, filter) =>
    S.living(world).filter((o) => o.id !== c.id && filter(o)).sort((a, b) => U.dist(a.x, a.y, c.x, c.y) - U.dist(b.x, b.y, c.x, c.y))[0] || null;

  // Each template: urgency(world,c) -> 0..3, situation, plea, options, resolved(world,c), natural daily chance.
  const TEMPLATES = {
    health: {
      category: 'Health & healing', icon: '✚',
      urgency(world, c) {
        const v = sevOf(c);
        if (v < 18) return 0;
        return v >= 70 ? 3 : v >= 40 ? 2 : 1;
      },
      situation: (world, c) => (c.illness ? `${c.first} suffers from ${c.illness.name}.` : `${c.first} is badly injured.`),
      plea: (c) => (c.age < 14 ? `Please, make ${c.sex === 'f' ? 'her' : 'him'} well again.` : 'Spare me this sickness. I have people who need me.'),
      resolved: (world, c) => sevOf(c) < 12,
      natural: 0.25,
      direct: { ability: 'heal', target: 'self', label: 'Heal them', certainty: 'Certain', risk: 'Witnesses will talk; exposure rises.' },
      indirect: {
        label: 'Inspire a healer to tend them', cost: 25, certainty: 'Likely', risk: 'The healer, not you, may be credited. Can fail if the illness is grave.',
        run(world, p, c) {
          const healer = nearestBy(world, c, (o) => o.role === 'healer' || o.role === 'priest');
          if (!healer) return { ok: false, text: 'There is no one to send.' };
          const p0 = 0.85 - sevOf(c) / 200 + healer.traits.kindness * 0.1;
          S.schedule(world, 60 + world.rng.int(0, 120), 'indirect_heal', { cId: c.id, hId: healer.id, chance: p0, prayerId: p.id });
          S.addMemory(world, healer, 'inspired', `Felt urged to visit ${c.first}.`, 1);
          return { ok: true, text: `${healer.name} feels a sudden urge to visit ${c.first}.`, pending: true };
        },
      },
      delayed: {
        label: 'Grant a slow recovery', cost: 30, certainty: 'Probable over days', risk: 'They will suffer meanwhile, and may give up hope.',
        run(world, p, c) {
          S.schedule(world, T.DAY * world.rng.float(1, 3), 'delayed_heal', { cId: c.id, prayerId: p.id });
          return { ok: true, text: `${c.first}'s body has begun, slowly, to mend.`, pending: true };
        },
      },
      alternative: {
        label: 'Ease their suffering, not the illness', cost: 20, certainty: 'Certain (partial)', risk: 'The illness remains. They may find peace, or feel cheated.',
        run(world, p, c) {
          if (c.illness) c.illness.severity = Math.max(5, c.illness.severity * 0.6);
          c.injury *= 0.6;
          c.mood = U.clamp(c.mood + 20, 0, 100);
          S.adjustBelief(world, c, world.rng.chance(0.6) ? 4 : -2);
          S.addMemory(world, c, 'prayer', 'The pain eased after praying, though the sickness lingers.', 1.5);
          return { ok: true, text: `${c.first}'s pain eases; the illness lingers.` };
        },
      },
    },
    provision: {
      category: 'Food, shelter & livelihood', icon: '⚘',
      urgency(world, c) {
        if (c.role === 'child' || c.age < 15) return 0;
        const home = S.building(world, c.homeId);
        if (home && home.damage > 40) return 2;
        if (c.hunger > 75) return 3;
        if (c.hunger > 50 || c.wealth < 8) return 2;
        if (c.wealth < 10) return 1;
        return 0;
      },
      situation: (world, c) => {
        const home = S.building(world, c.homeId);
        if (home && home.damage > 40) return `The flood ruined the ${c.last} home.`;
        return c.hunger > 50 ? `The ${c.last} household is going hungry.` : `${c.first} cannot find enough work to pay the rent.`;
      },
      plea: () => 'Give us this day our bread. I am not asking for more.',
      resolved: (world, c) => c.hunger < 40 && c.wealth >= 15 && !((S.building(world, c.homeId) || {}).damage > 40),
      natural: 0.12,
      direct: { ability: 'provide', target: 'self', label: 'Provide for the household', certainty: 'Certain', risk: 'A visible miracle; neighbours may grow jealous.' },
      indirect: {
        label: 'Move a wealthy neighbour to help', cost: 25, certainty: 'Uncertain', risk: 'Depends on the generosity of the person you move.',
        run(world, p, c) {
          const rich = S.living(world).filter((o) => o.id !== c.id && o.wealth > 50 && o.age >= 18).sort((a, b) => b.traits.kindness - a.traits.kindness)[0];
          if (!rich) return { ok: false, text: 'No one has enough to share.' };
          const helps = world.rng.chance(0.25 + rich.traits.kindness * 0.7);
          if (helps) {
            rich.wealth -= 15;
            c.wealth = U.clamp(c.wealth + 30, 0, 100);
            c.hunger = 0;
            const home = S.building(world, c.homeId);
            if (home) home.damage = Math.max(0, home.damage - 40);
            S.relate(c, rich, 'friend', 75);
            rich.renown = U.clamp(rich.renown + 5, 0, 100);
            S.addMemory(world, c, 'help', `${rich.first} offered work and bread when it was most needed.`, 2);
            S.addMemory(world, rich, 'help', `Felt moved to help the ${c.last} household.`, 1);
            return { ok: true, text: `${rich.name} offered help to the ${c.last} household.`, resolved: true, credit: rich.belief > 50 ? 'divine' : 'human' };
          }
          S.addMemory(world, rich, 'inspired', `Felt a pang of conscience about the ${c.last} household, and ignored it.`, 1);
          return { ok: true, text: `${rich.name} felt the nudge, but kept their purse closed.`, resolved: false };
        },
      },
      delayed: {
        label: 'Open a door in the coming days', cost: 30, certainty: 'Probable', risk: 'They must hold on until it comes.',
        run(world, p, c) {
          S.schedule(world, T.DAY * world.rng.float(2, 4), 'delayed_fortune', { cId: c.id, prayerId: p.id });
          return { ok: true, text: 'An opportunity is on its way.', pending: true };
        },
      },
      alternative: {
        label: 'Fill their table, but not their purse', cost: 25, certainty: 'Certain (partial)', risk: 'Hunger returns if nothing else changes.',
        run(world, p, c) {
          for (const f of [c, ...S.familyOf(world, c)]) if (f.alive && f.homeId === c.homeId) f.hunger = 0;
          S.adjustBelief(world, c, 3);
          S.addMemory(world, c, 'prayer', 'There was bread enough for tonight.', 1);
          return { ok: true, text: 'The household eats tonight.' };
        },
      },
    },
    safety: {
      category: 'Safety in disaster or conflict', icon: '☂',
      urgency(world, c) {
        if (c.flags.trapped) return 3;
        if (S.isInFloodDanger(world, c)) return world.flood.stage === 'warning' ? 1 : 2;
        if (world.war && (c.role === 'soldier' || c.role === 'general')) return 1;
        return 0;
      },
      situation: (world, c) => (c.flags.trapped ? `${c.first} is trapped by floodwater at ${S.building(world, c.homeId)?.name || 'home'}.` : S.isInFloodDanger(world, c) ? `The flood is coming for ${c.first}'s home.` : `${c.first} fears for their life in the war.`),
      plea: (c) => (c.flags.trapped ? (c.age < 15 ? 'The water is coming in. Please, please help us.' : Object.values(c.relations).some((r) => r.type === 'child') ? 'The water is at the door. Please, save my children.' : 'The water is at the door. Please, save us.') : 'Keep us safe. Turn the water from our door.'),
      resolved: (world, c) => !c.flags.trapped && !S.isInFloodDanger(world, c) && !(world.war && (c.role === 'soldier' || c.role === 'general')),
      natural: 0.1,
      direct: { ability: 'protect', target: 'home', label: 'Ward their home', certainty: 'Certain', risk: 'The water parting around a single house will be seen and remembered.' },
      indirect: {
        label: 'Inspire an official to organise a rescue', cost: 60, certainty: 'Uncertain', risk: 'Human choices decide the outcome. The rescuer gains the glory.',
        run(world, p, c) {
          const off = [S.char(world, S.faction(world, 'military').leaderId), S.char(world, world.country.heirId), S.leader(world), ...S.living(world).filter((o) => o.role === 'official')].filter((o) => o && o.alive);
          const best = off.sort((a, b) => b.traits.kindness + b.traits.courage - (a.traits.kindness + a.traits.courage))[0];
          if (!best) return { ok: false, text: 'There is no one to inspire.' };
          if (world.flood.stage === 'none') return { ok: false, text: 'There is no flood to rescue them from.' };
          const willing = world.rng.chance(0.35 + best.traits.kindness * 0.35 + best.traits.courage * 0.25);
          S.addMemory(world, best, 'inspired', `Could not stop thinking about the families on the Riverside.`, 1);
          if (willing) {
            S.organizeRescue(world, best);
            return { ok: true, text: `${best.name} is organising a rescue.`, pending: true };
          }
          return { ok: true, text: `${best.name} hesitated, and did nothing.`, resolved: false };
        },
      },
      delayed: {
        label: 'Help them endure until morning', cost: 35, certainty: 'Probable', risk: 'They may be hurt in the long hours.',
        run(world, p, c) {
          for (const f of S.living(world).filter((o) => o.homeId === c.homeId)) f.flags.endure = world.t + T.DAY;
          S.schedule(world, 6 * 60, 'delayed_safety', { homeId: c.homeId, prayerId: p.id });
          return { ok: true, text: 'They will find a way to endure.', pending: true };
        },
      },
      alternative: {
        label: 'Divert the river elsewhere (regional miracle)', ability: 'regional', option: 'divert_river', certainty: 'Certain', risk: 'Saves the floodplain; the North Fields and the Upland Farm flood instead.',
      },
    },
    family: {
      category: 'Love, family & grief', icon: '♥',
      urgency(world, c) {
        if (c.flags.grief && world.t - c.flags.grief < T.DAY * 30) return c.mood < 30 ? 2 : 1;
        if (c.age >= 20 && c.age < 40 && !S.spouseOf(world, c) && c.mood < 50 && c.role !== 'priest') return 1;
        const estranged = Object.keys(c.relations).find((k) => ['parent', 'child', 'sibling'].includes(c.relations[k].type) && c.relations[k].affinity < 30);
        return estranged ? 1 : 0;
      },
      situation: (world, c) => {
        if (c.flags.grief) {
          const m = c.memories.slice().reverse().find((x) => x.kind === 'grief');
          return `${c.first} is grieving. ${m ? m.text : ''}`;
        }
        if (!S.spouseOf(world, c)) return `${c.first} is lonely and longs for a partner.`;
        return `${c.first} is estranged from family.`;
      },
      plea: (c) => (c.flags.grief ? 'Tell me they are at peace. Tell me why.' : 'Do not let me be alone.'),
      resolved: (world, c) => !c.flags.grief && c.mood > 50,
      natural: 0.12,
      direct: { ability: 'vision', option: 'comfort', target: 'self', label: 'Send a comforting vision', certainty: 'Likely', risk: 'Visions can be misunderstood.' },
      indirect: {
        label: 'Move a friend to visit', cost: 15, certainty: 'Likely', risk: 'A friend can comfort, but cannot replace the lost.',
        run(world, p, c) {
          const fid = Object.keys(c.relations).find((k) => c.relations[k].type === 'friend' && S.char(world, +k)?.alive);
          const f = S.char(world, +fid);
          if (!f) return { ok: false, text: `${c.first} has no friends to send.` };
          c.mood = U.clamp(c.mood + 18, 0, 100);
          c.relations[f.id].affinity = U.clamp(c.relations[f.id].affinity + 10, 0, 100);
          S.goTo(world, f, c.homeId, `visiting ${c.first}`);
          S.addMemory(world, c, 'comfort', `${f.first} came by when it mattered.`, 1.5);
          return { ok: true, text: `${f.name} went to sit with ${c.first}.`, resolved: c.mood > 50 || world.rng.chance(0.5), credit: 'human' };
        },
      },
      delayed: {
        label: 'Arrange a chance meeting', cost: 25, certainty: 'Uncertain', risk: 'Love cannot be commanded.',
        run(world, p, c) {
          S.schedule(world, T.DAY * world.rng.float(2, 7), 'delayed_meeting', { cId: c.id, prayerId: p.id });
          return { ok: true, text: 'Paths will cross.', pending: true };
        },
      },
      alternative: {
        label: 'Grant acceptance rather than answers', cost: 15, certainty: 'Certain (partial)', risk: 'They may stop asking, and stop praying.',
        run(world, p, c) {
          c.mood = U.clamp(c.mood + 12, 0, 100);
          if (c.flags.grief) c.flags.grief = world.t - T.DAY * 25;
          S.adjustBelief(world, c, -1);
          S.addMemory(world, c, 'prayer', 'Found a quiet acceptance.', 1);
          return { ok: true, text: `${c.first} finds a quiet acceptance.`, resolved: true };
        },
      },
    },
    justice: {
      category: 'Justice, freedom & political change', icon: '⚖',
      urgency(world, c) {
        if (c.flags.detainedUntil > world.t) return 2;
        const country = world.country;
        if ((c.factionId === 'reformers' || c.factionId === 'commons') && c.age >= 18 && country.corruption > 50 && country.legitimacy < 45 && c.belief > 25 && world.rng.chance(0.02)) return 1;
        return 0;
      },
      situation: (world, c) => (c.flags.detainedUntil > world.t ? `${c.first} languishes in the gaol.` : `${c.first} is outraged by corruption at court.`),
      plea: (c) => (c.flags.detainedUntil ? 'I have done nothing but speak the truth. Set me free.' : 'How long will the wicked prosper? Show them for what they are.'),
      resolved: (world, c) => !(c.flags.detainedUntil > world.t) && world.country.corruption < 40,
      natural: 0.05,
      direct: {
        ability: 'reveal', target: 'corrupt', label: 'Reveal the wrongdoing of a corrupt official', certainty: 'Certain', risk: 'The Crown loses face; the Reformers grow bolder.',
      },
      indirect: {
        label: 'Inspire the Reformers\' leader', cost: 50, certainty: 'Uncertain', risk: 'Reform may become revolution.',
        run(world, p, c) {
          const ref = S.char(world, S.faction(world, 'reformers').leaderId);
          if (!ref || !ref.alive) return { ok: false, text: 'The Reformers have no leader.' };
          S.faction(world, 'reformers').power = U.clamp(S.faction(world, 'reformers').power + 5, 0, 100);
          world.country.reformPressure = U.clamp(world.country.reformPressure + 7, 0, 100);
          ref.renown = U.clamp(ref.renown + 6, 0, 100);
          S.addMemory(world, ref, 'inspired', 'Wrote the most stirring pamphlet of their life in a single night.', 2);
          if (c.flags.detainedUntil > world.t && world.rng.chance(0.4)) {
            c.flags.detainedUntil = world.t + 60;
            return { ok: true, text: `${ref.name}'s pamphlets shamed the court into releasing ${c.first}.`, resolved: true, credit: 'human' };
          }
          return { ok: true, text: `${ref.name}'s new pamphlet is the talk of the taverns.`, resolved: false };
        },
      },
      delayed: {
        label: 'Sow the seeds of change', cost: 40, certainty: 'Slow', risk: 'Change may come too late for them.',
        run(world, p, c) {
          for (let i = 1; i <= 5; i++) S.schedule(world, T.DAY * i * 2, 'reform_seed', {});
          return { ok: true, text: 'Discontent with corruption will grow.', resolved: false };
        },
      },
      alternative: {
        label: 'A small mercy: soften their jailers', cost: 30, certainty: 'Likely', risk: 'Nothing changes at court.',
        run(world, p, c) {
          if (c.flags.detainedUntil > world.t) {
            c.flags.detainedUntil = world.t + 60;
            S.addMemory(world, c, 'prayer', 'The guard left the door unlocked. Walked free.', 2);
            S.adjustBelief(world, c, 6);
            return { ok: true, text: `${c.first} walks free.`, resolved: true };
          }
          c.mood = U.clamp(c.mood + 10, 0, 100);
          return { ok: true, text: `${c.first} feels heard.`, resolved: true };
        },
      },
    },
    guidance: {
      category: 'Guidance & spiritual understanding', icon: '✦',
      urgency(world, c) {
        if (c.age < 14) return 0;
        const recentMiracle = c.memories.find((m) => (m.kind === 'miracle' || m.kind === 'gift' || m.kind === 'possessed') && world.t - m.t < T.DAY * 4);
        if (recentMiracle && c.belief > 20) return 1;
        if (c.belief > 30 && c.belief < 80 && world.rng.chance(0.012)) return 1;
        return 0;
      },
      situation: (world, c) => {
        const m = c.memories.slice().reverse().find((x) => x.kind === 'miracle' || x.kind === 'gift' || x.kind === 'possessed');
        return m && world.t - m.t < T.DAY * 4 ? `${c.first} is shaken by what happened and seeks meaning.` : `${c.first} stands at a crossroads and asks what to do.`;
      },
      plea: () => 'What do you want of me? Show me the way.',
      resolved: () => false,
      natural: 0.3,
      direct: { ability: 'vision', option: 'guidance', target: 'self', label: 'Send a vision of guidance', certainty: 'Likely', risk: 'They will act on what they think you meant.' },
      indirect: {
        label: 'Send a priest to counsel them', cost: 12, certainty: 'Likely', risk: 'The priest will teach the Church\'s interpretation, not yours.',
        run(world, p, c) {
          const pr = nearestBy(world, c, (o) => o.role === 'priest');
          if (!pr) return { ok: false, text: 'There is no priest.' };
          S.adjustBelief(world, c, 4);
          if (!c.movementId && world.rng.chance(0.4)) c.interpretation = world.church.doctrine;
          S.addMemory(world, c, 'counsel', `${pr.first} offered counsel.`, 1);
          return { ok: true, text: `${pr.name} counselled ${c.first}.`, resolved: true, credit: 'church' };
        },
      },
      delayed: {
        label: 'Promise a sign to come', cost: 10, certainty: 'Probable', risk: 'They may read meaning into anything.',
        run(world, p, c) {
          S.schedule(world, T.DAY * world.rng.float(1, 3), 'delayed_sign', { cId: c.id, prayerId: p.id });
          return { ok: true, text: 'A sign will come.', pending: true };
        },
      },
      alternative: { label: 'Send an ambiguous sign', ability: 'subtle_sign', target: 'self', certainty: 'Ambiguous', risk: 'They may find no meaning in it at all.' },
    },
    victory: {
      category: 'Military victory & protection from invasion', icon: '⚔',
      urgency(world, c) {
        if (!world.war) return 0;
        if (c.id === world.country.leaderId || c.role === 'general') return 3;
        if (c.role === 'soldier') return 2;
        return 0;
      },
      situation: (world) => `${S.neighbor(world, world.war.enemy).name} armies hold ground in the Highmarch.`,
      plea: () => 'Give our arms strength. Drive them from our land.',
      resolved: (world) => !world.war,
      natural: 0.02,
      direct: { ability: 'regional', option: 'storm_on_enemy', target: 'province:highmarch', label: 'Storm upon the invader', certainty: 'Strong effect', risk: 'A massive, public miracle. The enemy will hate you too.' },
      indirect: {
        label: 'Inspire the general', cost: 150, certainty: 'Uncertain', risk: 'Courage is not always wisdom.',
        run(world) {
          if (!world.war) return { ok: false, text: 'There is no war.' };
          const gen = S.char(world, S.faction(world, 'military').leaderId);
          const good = world.rng.chance(0.55 + (gen ? gen.traits.courage * 0.3 : 0));
          world.war.score = U.clamp(world.war.score + (good ? 15 : -5), -100, 100);
          return { ok: true, text: good ? `${gen ? gen.name : 'The general'} led a bold charge that broke the enemy line.` : `${gen ? gen.name : 'The general'} charged recklessly and lost men.`, resolved: false };
        },
      },
      delayed: {
        label: 'Turn the tide over the coming weeks', cost: 300, certainty: 'Gradual', risk: 'Many will die before the tide turns.',
        run(world) {
          if (!world.war) return { ok: false, text: 'There is no war.' };
          world.war.tide = 1.5;
          return { ok: true, text: 'Fortune will slowly favour Velmora.', resolved: false };
        },
      },
      alternative: {
        label: 'Shield the soldiers, not the cause', cost: 200, certainty: 'Certain', risk: 'The war goes on; pressure for peace grows.',
        run(world) {
          if (!world.war) return { ok: false, text: 'There is no war.' };
          world.war.shield = world.t + T.DAY * 30;
          world.country.warRisk = U.clamp(world.country.warRisk - 10, 0, 100);
          if (world.rng.chance(0.3)) S.endWar(world, 'peace', 'With few dead on either side, envoys found it easy to agree a truce.');
          return { ok: true, text: 'The soldiers are shielded.', resolved: !world.war };
        },
      },
    },
    discovery: {
      category: 'Discovery & hopes for the future', icon: '☉',
      urgency(world, c) {
        if ((c.role === 'scholar' || c.role === 'student') && world.rng.chance(0.03)) return 1;
        return 0;
      },
      situation: (world, c) => `${c.first} is stuck on a problem in natural philosophy and hopes for a breakthrough.`,
      plea: (c) => (c.belief < 25 ? 'If anyone is listening, which I doubt: let me understand.' : 'Open my eyes to how the world is made.'),
      resolved: () => false,
      natural: 0.15,
      direct: { ability: 'vision', option: 'insight', target: 'self', label: 'Grant an insight', certainty: 'Likely', risk: 'A skeptic will credit their own genius.' },
      indirect: {
        label: 'Kindle curiosity in a student', cost: 20, certainty: 'Uncertain', risk: 'Slow, and someone else gets the credit.',
        run(world) {
          world.country.literacy = U.clamp(world.country.literacy + 1, 0, 100);
          if (world.rng.chance(0.5)) world.country.technology = U.clamp(world.country.technology + 1.5, 0, 100);
          return { ok: true, text: 'A student at the Academy finds new passion for learning.', resolved: true, credit: 'human' };
        },
      },
      delayed: {
        label: 'Plant an idea to bloom later', cost: 25, certainty: 'Probable', risk: 'It may bloom in someone else\'s mind.',
        run(world, p, c) {
          S.schedule(world, T.DAY * world.rng.float(3, 7), 'delayed_insight', { cId: c.id, prayerId: p.id });
          return { ok: true, text: 'An idea will grow.', pending: true };
        },
      },
      alternative: null,
    },
  };
  S.PRAYER_TEMPLATES = TEMPLATES;

  // ---------- generation ----------
  S.generatePrayers = function (world) {
    const rng = world.rng;
    const pending = world.prayers.filter((p) => p.status === 'pending');
    if (pending.length >= MAX_PENDING) return;
    const pendingBy = new Set(pending.map((p) => p.requesterId));
    for (const c of S.living(world)) {
      if (c.asleep || c.possessed || pendingBy.has(c.id) || world.t < c.prayerCooldownUntil) continue;
      if (c.belief < 8 && !c.flags.trapped) continue;
      let best = null;
      for (const id in TEMPLATES) {
        const u = TEMPLATES[id].urgency(world, c);
        if (u > 0 && (!best || u > best.u)) best = { id, u };
      }
      if (!best) continue;
      // Desperation overrides doubt; devout people pray more often.
      const p = (0.005 + (c.belief / 100) * 0.018 + c.traits.piety * 0.008) * (best.u === 3 ? 12 : best.u === 2 ? 3 : 1);
      if (!rng.chance(p)) continue;
      S.createPrayer(world, c, best.id, best.u);
      pendingBy.add(c.id);
      if (world.prayers.filter((x) => x.status === 'pending').length >= MAX_PENDING) break;
    }
  };

  S.createPrayer = function (world, c, typeId, urgency) {
    const tpl = TEMPLATES[typeId];
    const p = {
      id: world.nextId++, typeId, category: tpl.category, icon: tpl.icon, requesterId: c.id, requesterName: c.name,
      location: { x: c.x, y: c.y, district: S.districtAt(world, c.x, c.y), place: (S.building(world, c.at) || {}).name || S.districtName(S.districtAt(world, c.x, c.y)) },
      situation: tpl.situation(world, c), plea: tpl.plea(c), urgency, createdAt: world.t, expiresAt: world.t + EXPIRY[urgency],
      status: 'pending', response: null, outcome: null, beliefAtTime: Math.round(c.belief),
      memories: c.memories.slice(-3).map((m) => m.text), history: Object.assign({}, c.divine),
    };
    world.prayers.push(p);
    c.prayerCooldownUntil = world.t + T.DAY * (urgency >= 3 ? 0.25 : 3);
    if (world.prayers.length > 400) world.prayers = world.prayers.filter((x) => x.status === 'pending' || world.t - x.createdAt < T.DAY * 60);
    if (urgency >= 3) S.log(world, { title: 'A desperate prayer', text: `${c.name}: "${p.plea}"`, level: 1, kind: 'prayer', entities: [c.id] });
    return p;
  };

  // ---------- options shown on a prayer card ----------
  S.resolveTargetRef = function (world, p, spec) {
    const c = S.char(world, p.requesterId);
    if (!spec.target || spec.target === 'self') return { kind: 'character', id: c.id };
    if (spec.target === 'home') return { kind: 'building', id: c.homeId };
    if (spec.target === 'corrupt') {
      const off = S.living(world).find((o) => o.corrupt);
      return off ? { kind: 'character', id: off.id } : null;
    }
    if (spec.target.startsWith('province:')) return { kind: 'province', id: spec.target.split(':')[1] };
    return null;
  };

  S.prayerOptions = function (world, p) {
    const tpl = TEMPLATES[p.typeId];
    const c = S.char(world, p.requesterId);
    if (!tpl || !c) return [];
    const out = [];
    const abilityOption = (kind, spec) => {
      const ref = S.resolveTargetRef(world, p, spec);
      let target = null;
      if (ref) target = ref.kind === 'character' ? S.char(world, ref.id) : ref.kind === 'building' ? S.building(world, ref.id) : S.province(world, ref.id);
      const check = ref ? S.canUseAbility(world, spec.ability, target, spec.option) : { ok: false, reason: 'No valid target' };
      const cost = ref ? S.abilityCost(world, spec.ability, target, spec.option) : 0;
      out.push({ kind, label: spec.label || G.Data.abilities[spec.ability].name, cost, certainty: spec.certainty, risk: spec.risk, available: check.ok, reason: check.ok ? '' : check.reason });
    };
    abilityOption('direct', tpl.direct);
    for (const kind of ['indirect', 'delayed', 'alternative']) {
      const spec = tpl[kind];
      if (!spec) continue;
      if (spec.ability) {
        abilityOption(kind, spec);
        continue;
      }
      const cost = Math.round(spec.cost * (world.settings.costMultiplier || 1));
      let available = world.player.form !== 'human' && world.faith.current >= cost;
      let reason = world.player.form === 'human' ? 'No divine abilities in human form' : available ? '' : `Not enough Faith (${cost})`;
      out.push({ kind, label: spec.label, cost, certainty: spec.certainty, risk: spec.risk, available, reason });
    }
    out.push({ kind: 'silence', label: 'Remain silent', cost: 0, certainty: 'The world decides', risk: 'They will interpret your silence for themselves.', available: true, reason: '' });
    return out;
  };

  // ---------- responding ----------
  S.respondPrayer = function (world, prayerId, kind) {
    const p = world.prayers.find((x) => x.id === prayerId);
    if (!p || p.status !== 'pending') return { ok: false, msg: 'That prayer is no longer pending.' };
    const tpl = TEMPLATES[p.typeId];
    const c = S.char(world, p.requesterId);
    if (!c || !c.alive) {
      p.status = 'void';
      return { ok: false, msg: 'They are gone.' };
    }
    if (kind === 'silence') {
      p.status = 'ignored';
      p.response = 'silence';
      world.stats.ignored++;
      S.schedule(world, Math.max(60, p.expiresAt - world.t), 'silence_outcome', { prayerId: p.id });
      S.log(world, { title: 'You remained silent', text: `You did not answer ${c.name}. The world will take its course.`, level: 0, kind: 'prayer', entities: [c.id] });
      return { ok: true, msg: 'You remain silent.' };
    }
    const spec = tpl[kind];
    if (!spec) return { ok: false, msg: 'Not possible.' };
    if (world.player.form === 'human') return { ok: false, msg: 'No divine abilities in human form.' };
    if (spec.ability) {
      const ref = S.resolveTargetRef(world, p, spec);
      if (!ref) return { ok: false, msg: 'No valid target.' };
      p.respondingWith = kind;
      const r = S.useAbility(world, spec.ability, ref, spec.option);
      p.respondingWith = null;
      if (!r.ok) return r;
      if (p.status === 'pending') {
        // The ability did not by itself satisfy the prayer (e.g. ambiguous sign)
        markAnswered(world, p, kind, r.msg, false);
      }
      return r;
    }
    const cost = Math.round(spec.cost * (world.settings.costMultiplier || 1));
    if (!S.spendFaith(world, cost, spec.label)) return { ok: false, msg: `Not enough Faith (${cost}).` };
    const r = spec.run(world, p, c);
    if (!r.ok) {
      world.faith.current += cost; // refund
      world.faith.spent -= cost;
      return { ok: false, msg: r.text };
    }
    p.response = kind;
    p.outcome = r.text;
    if (r.pending) p.status = 'answered';
    else markAnswered(world, p, kind, r.text, r.resolved !== false, r.credit);
    if (r.pending) {
      world.stats.answered++;
      c.divine.answered++;
    }
    S.log(world, { title: `${kindLabel(kind)} answer`, text: `${c.name}'s prayer: ${r.text}`, level: 1, kind: 'prayer', entities: [c.id], cost });
    S.recomputeFaithRates(world);
    return { ok: true, msg: r.text, cost };
  };

  function kindLabel(k) {
    return { direct: 'Direct', indirect: 'Indirect', delayed: 'Delayed', alternative: 'Alternative', silence: 'Silent' }[k] || k;
  }

  function markAnswered(world, p, kind, text, satisfied, credit) {
    const c = S.char(world, p.requesterId);
    p.status = 'answered';
    p.response = kind;
    p.outcome = text;
    world.stats.answered++;
    if (!c) return;
    c.divine.answered++;
    if (satisfied) {
      // Who gets the credit shapes belief.
      if (credit === 'human') S.adjustBelief(world, c, c.belief > 50 ? 3 : 0.5);
      else if (credit === 'church') world.church.strength = U.clamp(world.church.strength + 0.5, 0, 100);
      else S.adjustBelief(world, c, 6);
      S.addMemory(world, c, 'prayer', `Prayed (${p.category.toLowerCase()}) and was answered.`, 2);
      S.addGratitude(world, c, 18);
      // Communities come to expect protection.
      world.reputation[p.location.district] && (world.reputation[p.location.district].expectation = (world.reputation[p.location.district].expectation || 0) + 1);
    }
  }

  // Abilities used directly (not via a card) can still satisfy pending prayers.
  S.prayersAfterAbility = function (world, abilityId, target, option, kind) {
    for (const p of world.prayers) {
      if (p.status !== 'pending') continue;
      const tpl = TEMPLATES[p.typeId];
      const c = S.char(world, p.requesterId);
      if (!c) continue;
      let hit = false;
      if (kind === 'character' && target && target.id === c.id) {
        if (tpl.direct.ability === abilityId && (!tpl.direct.option || tpl.direct.option === option)) hit = true;
        if (tpl.alternative && tpl.alternative.ability === abilityId) hit = true;
      }
      if (kind === 'building' && target && abilityId === 'protect' && (c.homeId === target.id || c.at === target.id) && p.typeId === 'safety') hit = true;
      if (abilityId === 'regional' && (option === 'calm_waters' || option === 'divert_river') && p.typeId === 'safety' && tpl.resolved(world, c)) hit = true;
      if (abilityId === 'regional' && option === 'cleanse_plague' && p.typeId === 'health' && tpl.resolved(world, c)) hit = true;
      if ((abilityId === 'national' && option === 'forge_peace') || (abilityId === 'regional' && option === 'storm_on_enemy')) if (p.typeId === 'victory') hit = true;
      if (abilityId === 'reveal' && p.typeId === 'justice') hit = true;
      if (abilityId === 'regional' && option === 'bountiful_harvest' && p.typeId === 'provision') hit = true;
      if (hit) markAnswered(world, p, p.respondingWith || 'direct', 'Answered by your miracle.', true);
    }
  };

  // ---------- hourly upkeep: natural resolution and expiry ----------
  S.prayersHourly = function (world) {
    const rng = world.rng;
    for (const p of world.prayers) {
      if (p.status !== 'pending') continue;
      const c = S.char(world, p.requesterId);
      const tpl = TEMPLATES[p.typeId];
      if (!c || !c.alive) {
        p.status = 'void';
        continue;
      }
      if (tpl.resolved(world, c) && world.t - p.createdAt > 60) {
        p.status = 'resolved';
        p.outcome = 'Resolved without divine help.';
        world.stats.natural++;
        naturalInterpretation(world, c, p);
        continue;
      }
      if (world.t >= p.expiresAt) {
        if (rng.chance(tpl.natural)) {
          p.status = 'resolved';
          p.outcome = 'Things worked out on their own.';
          world.stats.natural++;
          naturalInterpretation(world, c, p);
        } else {
          p.status = 'unanswered';
          p.outcome = 'No answer came.';
          world.stats.unanswered++;
          disappointment(world, c, p);
        }
      }
    }
  };

  function naturalInterpretation(world, c, p) {
    // Believers may credit the divine anyway; skeptics credit themselves.
    if (c.belief > 50) {
      S.adjustBelief(world, c, 2);
      S.addMemory(world, c, 'prayer', `Prayed for help (${p.category.toLowerCase()}); things improved, and they believe heaven listened.`, 1);
    } else S.addMemory(world, c, 'prayer', `Prayed for help (${p.category.toLowerCase()}); things improved on their own.`, 0.8);
  }

  function disappointment(world, c, p) {
    const rng = world.rng;
    c.divine.unanswered++;
    const district = p.location.district;
    const expectation = (world.reputation[district] && world.reputation[district].expectation) || 0;
    // Expectations raised by past miracles make silence hurt more.
    const base = 2 + p.urgency * 1.5 + Math.min(6, expectation * 0.8);
    const r = rng.next();
    let text;
    if (c.traits.piety > 0.6 && r < 0.5) {
      text = 'No answer came. Decided it must be part of a greater plan.';
      S.adjustBelief(world, c, -base * 0.2);
    } else if (r < 0.7) {
      text = 'No answer came. Doubt is creeping in.';
      S.adjustBelief(world, c, -base);
    } else {
      text = 'No answer came. Is angry at heaven.';
      S.adjustBelief(world, c, -base * 1.4);
      c.mood = U.clamp(c.mood - 8, 0, 100);
    }
    S.addMemory(world, c, 'prayer', text, 1.5);
    if (p.urgency >= 3) S.log(world, { title: 'An unanswered prayer', text: `${c.name}'s desperate prayer went unanswered. ${text.replace('No answer came. ', '')}`, level: 1, kind: 'prayer', entities: [c.id] });
  }

  H.silence_outcome = function (world, data) {
    const p = world.prayers.find((x) => x.id === data.prayerId);
    if (!p) return;
    const c = S.char(world, p.requesterId);
    if (!c || !c.alive) return;
    const tpl = TEMPLATES[p.typeId];
    if (tpl.resolved(world, c) || world.rng.chance(tpl.natural)) {
      p.outcome = 'Resolved without divine help.';
      naturalInterpretation(world, c, p);
    } else {
      p.outcome = 'Silence. No help came.';
      disappointment(world, c, p);
    }
  };

  // ---------- delayed / indirect resolutions ----------
  const findP = (world, id) => world.prayers.find((x) => x.id === id);
  function finish(world, prayerId, c, text, good) {
    const p = findP(world, prayerId);
    if (p) p.outcome = text;
    if (c && good) {
      S.adjustBelief(world, c, 5);
      S.addGratitude(world, c, 12);
    }
    S.log(world, { title: good ? 'A prayer fulfilled' : 'A prayer falls short', text, level: 1, kind: 'prayer', entities: c ? [c.id] : [] });
  }
  H.indirect_heal = function (world, d) {
    const c = S.char(world, d.cId);
    const h = S.char(world, d.hId);
    if (!c || !c.alive || !h || !h.alive) return;
    S.goTo(world, h, c.homeId, `tending ${c.first}`);
    if (world.rng.chance(d.chance)) {
      if (c.illness) c.illness.severity = Math.max(0, c.illness.severity - 50);
      if (c.illness && c.illness.severity < 10) c.illness = null;
      c.injury = Math.max(0, c.injury - 40);
      h.renown = U.clamp(h.renown + 6, 0, 100);
      S.relate(c, h, 'friend', 80);
      S.addMemory(world, c, 'help', `${h.first} came and tended to them.`, 2);
      finish(world, d.prayerId, c, `${h.name} tended ${c.first}, who is recovering. Some say ${h.first} has a healing touch.`, true);
    } else finish(world, d.prayerId, c, `${h.name} tended ${c.first}, but could not turn the illness.`, false);
  };
  H.delayed_heal = function (world, d) {
    const c = S.char(world, d.cId);
    if (!c || !c.alive) return;
    if (world.rng.chance(0.85)) {
      c.illness = null;
      c.injury = 0;
      c.health = Math.max(c.health, 70);
      S.addMemory(world, c, 'prayer', 'Recovered, slowly, as if someone had answered.', 2);
      finish(world, d.prayerId, c, `${c.name} has recovered.`, true);
    } else finish(world, d.prayerId, c, `${c.name}'s recovery stalled.`, false);
  };
  H.delayed_fortune = function (world, d) {
    const c = S.char(world, d.cId);
    if (!c || !c.alive) return;
    c.wealth = U.clamp(c.wealth + 35, 0, 100);
    c.hunger = 0;
    const home = S.building(world, c.homeId);
    if (home) home.damage = Math.max(0, home.damage - 50);
    S.addMemory(world, c, 'prayer', 'Was offered steady work out of nowhere.', 2);
    finish(world, d.prayerId, c, `${c.name} found steady work.`, true);
  };
  H.delayed_meeting = function (world, d) {
    const c = S.char(world, d.cId);
    if (!c || !c.alive) return;
    if (c.flags.grief) {
      c.flags.grief = 0;
      c.mood = U.clamp(c.mood + 20, 0, 100);
      return finish(world, d.prayerId, c, `${c.name} met someone who had lost what they had lost. They talked until dawn.`, true);
    }
    const cand = S.living(world).find((o) => o.id !== c.id && o.sex !== c.sex && o.age >= 18 && Math.abs(o.age - c.age) < 12 && !S.spouseOf(world, o) && !c.relations[o.id]);
    if (cand && world.rng.chance(0.75)) {
      S.relate(c, cand, 'friend', 70);
      S.relate(cand, c, 'friend', 70);
      c.mood = U.clamp(c.mood + 20, 0, 100);
      S.addMemory(world, c, 'love', `Met ${cand.first} by chance at the market.`, 2);

  S.playerPos = function (world) {

      if (v) return { x: v.x, y: v.y };

      p.y = U.clamp(p.y + dy, 0, Hh() - 0.01);

    const ny = U.clamp(body.y + dy, 0, Hh() - 0.01);

    if (!S.inRiver(nx, body.y) && !deepWater(world, nx, body.y)) body.x = nx;
    if (!S.inRiver(body.x, ny) && !deepWater(world, body.x, ny)) body.y = ny;

  // ---------- Form changes ----------
  S.setForm = function (world, form, targetId) {

  function leaveHuman(world) {

  S.endPossession = function (world, reason) {

      if (world.flood.stage !== 'none' && S.isInFloodDanger(world, o)) acts.push({ id: 'warn', targetId: o.id, label: `Urge ${o.first} to flee the flood` });

    }

      for (const f of fam) {
        f.flags.trapped = false;
        f.flags.evacuating = true;

      }

      if (o.illness) o.illness.severity = Math.max(0, o.illness.severity - 10);
      o.injury = Math.max(0, o.injury - 10);
      o.mood = U.clamp(o.mood + 8, 0, 100);

  function describeWorry(world, o) {

  }
  function rpick(world, arr) {
    return arr[Math.floor(((world.t * 7919) % 1000) / 1000 * arr.length)];
  }

  // Rumours give the player imperfect, second-hand information.
  S.rumour = function (world, o) {
